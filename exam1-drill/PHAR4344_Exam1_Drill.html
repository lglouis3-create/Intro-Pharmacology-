{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-drc", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~8–~10, ~16–~18; Pharmacodynamics-Day_2_2026s copy.pdf slide ~56; transcript 9/24", "quote": "So my dose is going to be on the bottom, on the X axis. My response is gonna be on the Y axis, which is on the up or down, OK?", "id": "T-drc-1", "stem": "Which term is defined as: A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency?", "options": [{"t": "Dose–response curve (DRC / CRC)", "correct": true, "why": "This is the definition of Dose–response curve (DRC / CRC)."}, {"t": "Symmetrical vs asymmetrical shifts", "correct": false, "why": "Symmetrical vs asymmetrical shifts: Symmetrical shifts: successive rightward shifts of equal size produced by increasing doses of an orthosteric competitor (competitive antagonist, inverse agonist, irreversible antagonist), because a tenfold increase in one drug needs a tenfold increase in the other. Asymmetrical shifts: shifts of unequal size produced by allosteric agonists and antagonists, whose binding at the other site does not depend on the agonist."}, {"t": "Binding curve (Bmax)", "correct": false, "why": "Binding curve (Bmax): Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity."}, {"t": "Graded response", "correct": false, "why": "Graded response: A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect."}], "teach": "A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency. DRC: increasing individual doses in vivo (ADME, apparent potency). CRC: increasing concentration in vitro (molar, pharmacological potency). Affinity is on the x-axis, efficacy on the y-axis, potency a combination of the two.", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-drc", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~8–~10, ~16–~18; Pharmacodynamics-Day_2_2026s copy.pdf slide ~56; transcript 9/24", "quote": "So my dose is going to be on the bottom, on the X axis. My response is gonna be on the Y axis, which is on the up or down, OK?", "id": "T-drc-2", "stem": "What does the term \"Dose–response curve (DRC / CRC)\" mean?", "options": [{"t": "A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency.", "correct": true, "why": "This is the definition of Dose–response curve (DRC / CRC)."}, {"t": "The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency.", "correct": false, "why": "That defines apparent potency."}, {"t": "Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity.", "correct": false, "why": "That defines binding curve (bmax)."}, {"t": "A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect.", "correct": false, "why": "That defines graded response."}], "teach": "A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency. DRC: increasing individual doses in vivo (ADME, apparent potency). CRC: increasing concentration in vitro (molar, pharmacological potency). Affinity is on the x-axis, efficacy on the y-axis, potency a combination of the two.", "dupOf": "T-drc-1", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-graded-response", "tags": ["term"], "source": "slide", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~10, ~16, ~18; transcript 9/24", "quote": "Graded response by multiple increases of drug doses over a specific range", "id": "T-graded-response-1", "stem": "Which term is defined as: A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect?", "options": [{"t": "Graded response", "correct": true, "why": "This is the definition of Graded response."}, {"t": "Dose–response curve (DRC / CRC)", "correct": false, "why": "Dose–response curve (DRC / CRC): A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency."}, {"t": "Threshold", "correct": false, "why": "Threshold: The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50."}, {"t": "Slope", "correct": false, "why": "Slope: The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax."}], "teach": "A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect. The y-axis is normalized (% of maximum response or response per tissue weight) to eliminate biological variability between individuals: “now I can compare apples with apples.”"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-graded-response", "tags": ["term"], "source": "slide", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~10, ~16, ~18; transcript 9/24", "quote": "Graded response by multiple increases of drug doses over a specific range", "id": "T-graded-response-2", "stem": "What does the term \"Graded response\" mean?", "options": [{"t": "A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect.", "correct": true, "why": "This is the definition of Graded response."}, {"t": "A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency.", "correct": false, "why": "That defines dose–response curve (drc / crc)."}, {"t": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50.", "correct": false, "why": "That defines threshold."}, {"t": "The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax.", "correct": false, "why": "That defines slope."}], "teach": "A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect. The y-axis is normalized (% of maximum response or response per tissue weight) to eliminate biological variability between individuals: “now I can compare apples with apples.”", "dupOf": "T-graded-response-1"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-threshold", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~20–~21; transcript 9/24", "quote": "Remember that the threshold is the dose right before something happens, right? So I know that at any dose below this, no effect.", "id": "T-threshold-1", "stem": "Which term is defined as: The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50?", "options": [{"t": "Threshold", "correct": true, "why": "This is the definition of Threshold."}, {"t": "EC50 / ED50", "correct": false, "why": "EC50 / ED50: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)."}, {"t": "Emax (maximal response, ceiling)", "correct": false, "why": "Emax (maximal response, ceiling): The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy."}, {"t": "Slope", "correct": false, "why": "Slope: The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax."}], "teach": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50. Threshold is where the curve starts; EC50 is the halfway point; Emax is the ceiling.", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-threshold", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~20–~21; transcript 9/24", "quote": "Remember that the threshold is the dose right before something happens, right? So I know that at any dose below this, no effect.", "id": "T-threshold-2", "stem": "What does the term \"Threshold\" mean?", "options": [{"t": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50.", "correct": true, "why": "This is the definition of Threshold."}, {"t": "EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional).", "correct": false, "why": "That defines ec50 / ed50."}, {"t": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.", "correct": false, "why": "That defines emax (maximal response, ceiling)."}, {"t": "The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax.", "correct": false, "why": "That defines slope."}], "teach": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50. Threshold is where the curve starts; EC50 is the halfway point; Emax is the ceiling.", "dupOf": "T-threshold-1", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-emax", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~11–~14, ~20–~21, ~27; transcript 9/24", "quote": "What are the two reasons why we have reached the Emacs and we can’t keep going up? All the receptors are occupied or I max out the physiological system, right?", "id": "T-emax-1", "stem": "Which term is defined as: The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy?", "options": [{"t": "Emax (maximal response, ceiling)", "correct": true, "why": "This is the definition of Emax (maximal response, ceiling)."}, {"t": "Symmetrical vs asymmetrical shifts", "correct": false, "why": "Symmetrical vs asymmetrical shifts: Symmetrical shifts: successive rightward shifts of equal size produced by increasing doses of an orthosteric competitor (competitive antagonist, inverse agonist, irreversible antagonist), because a tenfold increase in one drug needs a tenfold increase in the other. Asymmetrical shifts: shifts of unequal size produced by allosteric agonists and antagonists, whose binding at the other site does not depend on the agonist."}, {"t": "EC50 / ED50", "correct": false, "why": "EC50 / ED50: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}], "teach": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy. Giving more drug past the ceiling does no more good. Curves with equal Emax differ by affinity; when EC50 is equal, greater efficacy makes the drug more potent (Relative Efficacy slide).", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-emax", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~11–~14, ~20–~21, ~27; transcript 9/24", "quote": "What are the two reasons why we have reached the Emacs and we can’t keep going up? All the receptors are occupied or I max out the physiological system, right?", "id": "T-emax-2", "stem": "What does the term \"Emax (maximal response, ceiling)\" mean?", "options": [{"t": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.", "correct": true, "why": "This is the definition of Emax (maximal response, ceiling)."}, {"t": "EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional).", "correct": false, "why": "That defines ec50 / ed50."}, {"t": "The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist.", "correct": false, "why": "That defines efficacy (intrinsic efficacy)."}, {"t": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50.", "correct": false, "why": "That defines threshold."}], "teach": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy. Giving more drug past the ceiling does no more good. Curves with equal Emax differ by affinity; when EC50 is equal, greater efficacy makes the drug more potent (Relative Efficacy slide).", "dupOf": "T-emax-1", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-slope", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~20–~21; transcript 9/24", "quote": "In that slope in that area of the curve, this is when I’m going to get the most bang for my buck. This is I’m going to get the greatest change in the response with the smallest change in the dose.", "id": "T-slope-1", "stem": "Which term is defined as: The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax?", "options": [{"t": "Slope", "correct": true, "why": "This is the definition of Slope."}, {"t": "Threshold", "correct": false, "why": "Threshold: The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50."}, {"t": "Emax (maximal response, ceiling)", "correct": false, "why": "Emax (maximal response, ceiling): The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}], "teach": "The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax. Which is better “depends”: the steep curve goes from no effect to max all at once; the shallow one gives a greater range of doses before a toxic effect."},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-slope", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~20–~21; transcript 9/24", "quote": "In that slope in that area of the curve, this is when I’m going to get the most bang for my buck. This is I’m going to get the greatest change in the response with the smallest change in the dose.", "id": "T-slope-2", "stem": "What does the term \"Slope\" mean?", "options": [{"t": "The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax.", "correct": true, "why": "This is the definition of Slope."}, {"t": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy.", "correct": false, "why": "That defines potency (pharmacological)."}, {"t": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50.", "correct": false, "why": "That defines threshold."}, {"t": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.", "correct": false, "why": "That defines emax (maximal response, ceiling)."}], "teach": "The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax. Which is better “depends”: the steep curve goes from no effect to max all at once; the shallow one gives a greater range of doses before a toxic effect.", "dupOf": "T-slope-1"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-ec50", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~57–~58; Pharmacodynamics-Day_3_2026s.pdf slides ~20–~22, ~29; transcript 9/24", "quote": "So, the take-home message that you can’t forget is that the smallest the ED50 is or the [EC]50, the greater the potency is gonna be. They’re inverse proportional.", "id": "T-ec50-1", "stem": "Which term is defined as: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)?", "options": [{"t": "EC50 / ED50", "correct": true, "why": "This is the definition of EC50 / ED50."}, {"t": "Kd (dissociation constant)", "correct": false, "why": "Kd (dissociation constant): The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional."}, {"t": "Emax (maximal response, ceiling)", "correct": false, "why": "Emax (maximal response, ceiling): The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}], "teach": "EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional). Kd is the concentration binding 50% of receptors (affinity, no effect); EC50 is 50% of the response (potency). Both are read on the x-axis. “Philosophically identical”: one is a dose, the other a concentration.", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-ec50", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~57–~58; Pharmacodynamics-Day_3_2026s.pdf slides ~20–~22, ~29; transcript 9/24", "quote": "So, the take-home message that you can’t forget is that the smallest the ED50 is or the [EC]50, the greater the potency is gonna be. They’re inverse proportional.", "id": "T-ec50-2", "stem": "What does the term \"EC50 / ED50\" mean?", "options": [{"t": "EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional).", "correct": true, "why": "This is the definition of EC50 / ED50."}, {"t": "The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional.", "correct": false, "why": "That defines kd (dissociation constant)."}, {"t": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.", "correct": false, "why": "That defines emax (maximal response, ceiling)."}, {"t": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy.", "correct": false, "why": "That defines potency (pharmacological)."}], "teach": "EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional). Kd is the concentration binding 50% of receptors (affinity, no effect); EC50 is 50% of the response (potency). Both are read on the x-axis. “Philosophically identical”: one is a dose, the other a concentration.", "dupOf": "T-ec50-1", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-potency", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~7, ~22, ~27–~29; Pharmacodynamics-Day_2_2026s copy.pdf slides ~52–~54; Pharmacodynamics-Day-1-2026s.pdf slides ~21–~22, ~27; transcript 9/22; transcript 9/23; transcript 9/24", "quote": "The take home message over here is that potency is not only going to be defined by the efficacy of the affinity, but also the tissue that is going to be bound to.", "id": "T-potency-1", "stem": "Which term is defined as: Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy?", "options": [{"t": "Potency (pharmacological)", "correct": true, "why": "This is the definition of Potency (pharmacological)."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}, {"t": "Affinity", "correct": false, "why": "Affinity: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity."}, {"t": "Apparent potency", "correct": false, "why": "Apparent potency: The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency."}], "teach": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy. Potency ≠ efficacy: the most potent drug (smallest EC50) can be a partial agonist; the most efficacious has the highest Emax. “Affinity is gonna be on the bottom, efficacy is gonna be on the Y axis, and potency is gonna be a combination of the two.”", "fg": "potency"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-potency", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~7, ~22, ~27–~29; Pharmacodynamics-Day_2_2026s copy.pdf slides ~52–~54; Pharmacodynamics-Day-1-2026s.pdf slides ~21–~22, ~27; transcript 9/22; transcript 9/23; transcript 9/24", "quote": "The take home message over here is that potency is not only going to be defined by the efficacy of the affinity, but also the tissue that is going to be bound to.", "id": "T-potency-2", "stem": "What does the term \"Potency (pharmacological)\" mean?", "options": [{"t": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy.", "correct": true, "why": "This is the definition of Potency (pharmacological)."}, {"t": "Symmetrical shifts: successive rightward shifts of equal size produced by increasing doses of an orthosteric competitor (competitive antagonist, inverse agonist, irreversible antagonist), because a tenfold increase in one drug needs a tenfold increase in the other. Asymmetrical shifts: shifts of unequal size produced by allosteric agonists and antagonists, whose binding at the other site does not depend on the agonist.", "correct": false, "why": "That defines symmetrical vs asymmetrical shifts."}, {"t": "The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist.", "correct": false, "why": "That defines efficacy (intrinsic efficacy)."}, {"t": "The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity.", "correct": false, "why": "That defines affinity."}], "teach": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy. Potency ≠ efficacy: the most potent drug (smallest EC50) can be a partial agonist; the most efficacious has the highest Emax. “Affinity is gonna be on the bottom, efficacy is gonna be on the Y axis, and potency is gonna be a combination of the two.”", "dupOf": "T-potency-1", "fg": "potency"},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-apparent-potency", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~23, ~27; Pharmacodynamics-Day_3_2026s.pdf slide ~8; transcript 9/22", "quote": "So this is going to give us our apparent potency. Why is apparent? ... It’s only appearing because it’s not the total concentration of the drug.", "id": "T-apparent-potency-1", "stem": "Which term is defined as: The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency?", "options": [{"t": "Apparent potency", "correct": true, "why": "This is the definition of Apparent potency."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}, {"t": "Pharmacokinetics (PK)", "correct": false, "why": "Pharmacokinetics (PK): The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions)."}, {"t": "Saturability (allosteric)", "correct": false, "why": "Saturability (allosteric): The limit to how far an allosteric drug can shift an agonist’s curve: once all the allosteric sites are occupied, higher doses produce no further shift. Orthosteric competitors, by contrast, keep shifting the curve toward infinity as long as more drug can be added."}], "teach": "The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency. Route of administration and first-pass metabolism change apparent potency (IV has 100% bioavailability); they do not change the drug’s affinity or efficacy, which set pharmacological potency."},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-apparent-potency", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~23, ~27; Pharmacodynamics-Day_3_2026s.pdf slide ~8; transcript 9/22", "quote": "So this is going to give us our apparent potency. Why is apparent? ... It’s only appearing because it’s not the total concentration of the drug.", "id": "T-apparent-potency-2", "stem": "What does the term \"Apparent potency\" mean?", "options": [{"t": "The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency.", "correct": true, "why": "This is the definition of Apparent potency."}, {"t": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy.", "correct": false, "why": "That defines potency (pharmacological)."}, {"t": "The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions).", "correct": false, "why": "That defines pharmacokinetics (pk)."}, {"t": "The limit to how far an allosteric drug can shift an agonist’s curve: once all the allosteric sites are occupied, higher doses produce no further shift. Orthosteric competitors, by contrast, keep shifting the curve toward infinity as long as more drug can be added.", "correct": false, "why": "That defines saturability (allosteric)."}], "teach": "The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency. Route of administration and first-pass metabolism change apparent potency (IV has 100% bioavailability); they do not change the drug’s affinity or efficacy, which set pharmacological potency.", "dupOf": "T-apparent-potency-1"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-relative-potency", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slide ~23; transcript 9/24", "quote": "We can say that a drug A is 1000 times more potent than drug B because it requires 1000 times less drug to produce equivalent responses.", "id": "T-relative-potency-1", "stem": "Which term is defined as: The ratio of two drugs’ ED50 (or EC50) values, ED50B / ED50A. A drug that needs 1000 times less drug to produce an equivalent response is 1000X more potent?", "options": [{"t": "Relative potency", "correct": true, "why": "This is the definition of Relative potency."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}, {"t": "EC50 / ED50", "correct": false, "why": "EC50 / ED50: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)."}, {"t": "Saturability (allosteric)", "correct": false, "why": "Saturability (allosteric): The limit to how far an allosteric drug can shift an agonist’s curve: once all the allosteric sites are occupied, higher doses produce no further shift. Orthosteric competitors, by contrast, keep shifting the curve toward infinity as long as more drug can be added."}], "teach": "The ratio of two drugs’ ED50 (or EC50) values, ED50B / ED50A. A drug that needs 1000 times less drug to produce an equivalent response is 1000X more potent. Compare potency at equivalent effects (e.g., 50%), not at 100%, because a partial agonist never reaches 100%. “Math is gonna be minimal.”"},

{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-signal-transduction", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~25–~28; transcript 9/23", "quote": "Signal Transduction: Signal ... Receptor ... Transducer ... Effector (Signal Amplifier) ... 2nd Messenger ... Physiological Response", "id": "T-signal-transduction-1", "stem": "Which term is defined as: The sequence signal (hormone, growth factor, neurotransmitter, agonist drug) → receptor → transducer → effector (signal amplifier) → second messenger → physiological response: the signaling that occurs prior to the response. Drugs can change the activity of these proteins, and many of them can be drug targets?", "options": [{"t": "Signal transduction", "correct": true, "why": "This is the definition of Signal transduction."}, {"t": "Effector (signal amplifier)", "correct": false, "why": "Effector (signal amplifier): An enzyme, ion channel or transport protein that creates, moves or degrades a small molecule or ions, e.g., adenylate cyclase (AC), phospholipase C (PLC). It amplifies the signal; frequently the proximal effector protein is not the ultimate physiological target."}, {"t": "Transducer", "correct": false, "why": "Transducer: The component that translates, integrates and coordinates the signal from the activated receptor, e.g., the G protein."}, {"t": "Second messenger", "correct": false, "why": "Second messenger: Small molecules created, degraded or moved by an enzyme, ion channel or transport protein (the effector); they diffuse near their site of synthesis and convey information to a variety of targets. Slide examples: cAMP, PKA, PKC, IP3, Ca++."}], "teach": "The sequence signal (hormone, growth factor, neurotransmitter, agonist drug) → receptor → transducer → effector (signal amplifier) → second messenger → physiological response: the signaling that occurs prior to the response. Drugs can change the activity of these proteins, and many of them can be drug targets. Exam ask: identify what is a signal, a receptor, a transducer, an effector (“factor system”) and a second messenger in a pathway like epinephrine → β1 → Gαs → AC → cAMP.", "fg": "gpcr"},

 neurotransmitter, agonist drug) → receptor → transducer → effector (signal amplifier) → second messenger → physiological response: the signaling that occurs prior to the response. Drugs can change the activity of these proteins, and many of them can be drug targets. Exam ask: identify what is a signal, a receptor, a transducer, an effector (“factor system”) and a second messenger in a pathway like epinephrine → β1 → Gαs → AC → cAMP.", "dupOf": "T-signal-transduction-1", "fg": "gpcr"},

or = the enzyme it activates (AC, PLC); second messenger = the small molecule the effector makes (cAMP, IP3).", "fg": "gpcr"},

{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-g-protein", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~49–~55; Pharmacodynamics-Day_2_2026s copy.pdf slide ~3; transcript 9/23", "quote": "The GDP, the diphosphate, has to come off, and the G[T]P, as in taxes, the triphosphate has to come in. The removal of the GDP and replacement with the G[T]P is what triggers them to separate from each other.", "id": "T-g-protein-1", "stem": "Which term is defined as: Heterotrimeric guanine nucleotide binding protein (α, β, γ subunits) coupled to 7-transmembrane receptors, defined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it?", "options": [{"t": "G protein (heterotrimeric)", "correct": true, "why": "This is the definition of G protein (heterotrimeric)."}, {"t": "G protein–coupled receptor (GPCR, 7-TM)", "correct": false, "why": "G protein–coupled receptor (GPCR, 7-TM): 7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors."}, {"t": "Transducer", "correct": false, "why": "Transducer: The component that translates, integrates and coordinates the signal from the activated receptor, e.g., the G protein."}, {"t": "Gαs, Gαi and Gαq", "correct": false, "why": "Gαs, Gαi and Gαq: The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ {"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-g-protein", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~49–~55; Pharmacodynamics-Day_2_2026s copy.pdf slide ~3; transcript 9/23", "quote": "The GDP, the diphosphate, has to come off, and the G[T]P, as in taxes, the triphosphate has to come in. The removal of the GDP and replacement with the G[T]P is what triggers them to separate from each other.", "id": "T-g-protein-2", "stem": "What does the term \"G protein (heterotrimeric)\" mean?", "options": [{"t": "Heterotrimeric guanine nucleotide binding protein (α, β, γ subunits) coupled to 7-transmembrane receptors, defined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it.", "correct": true, "why": "This is the definition of G protein (heterotrimeric)."}, {"t": "Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3).", "correct": false, "why": "That defines ion channel (ligand-gated)."}, {"t": "7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors.", "correct": false, "why": "That defines g protein–coupled receptor (gpcr, 7-tm)."}, {"t": "The component that translates, integrates and coordinates the signal from the activated receptor, e.g., the G protein.", "correct": false, "why": "That defines transducer."}], "teach": "Heterotrimeric guanine nucleotide binding protein (α, β, γ subunits) coupled to 7-transmembrane receptors, defined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it. The G protein is the transducer. Poll trap: G proteins are defined by the α subunit, not the β subunit.", "dupOf": "T-g-protein-1", "fg": "gpcr"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-g-alpha", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~3, ~30; Pharmacodynamics-Day-1-2026s.pdf slides ~50–~55; transcript 9/23", "quote": "We know that the alpha S always is going to be associated with the AC and always is going to increase the camp. The alphai, which is the opposite, also is going to be associated with the AC, but in this case it’s going to suppress the camp. And then the alpha Q is going to increase IP3 and calcium.", "id": "T-g-alpha-1", "stem": "Which term is defined as: The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle)?", "options": [{"t": "Gαs, Gαi and Gαq", "correct": true, "why": "This is the definition of Gαs, Gαi and Gαq."}, {"t": "G protein (heterotrimeric)", "correct": false, "why": "G protein (heterotrimeric): Heterotrimeric guanine nucleotide binding protein (α, β, γ subunits) coupled to 7-transmembrane receptors, defined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it."}, {"t": "Effector (signal amplifier)", "correct": false, "why": "Effector (signal amplifier): An enzyme, ion channel or transport protein that creates, moves or degrades a small molecule or ions, e.g., adenylate cyclase (AC), phospholipase C (PLC). It amplifies the signal; frequently the proximal effector protein is not the ultimate physiological target."}, {"t": "Cross-talk", "correct": false, "why": "Cross-talk: Interaction between signal transduction pathways within the same cell that yields a net response. In the heart, M2 (Gαi, ↓cAMP, ↓HR) and β1 (Gαs, ↑cAMP, ↑HR) both act on adenylate cyclase."}], "teach": "The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle). His cue: adenylate cyclase goes with cyclic AMP; αq goes with phospholipase C and IP3. Gαi is the trap: same effector as Gαs, opposite direction.", "fg": "gpcr"},

, M2 (Gαi, ↓cAMP, ↓HR) and β1 (Gαs, ↑cAMP, ↑HR) both act on adenylate cyclase.", "correct": false, "why": "That defines cross-talk."}], "teach": "The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle). His cue: adenylate cyclase goes with cyclic AMP; αq goes with phospholipase C and IP3. Gαi is the trap: same effector as Gαs, opposite direction.", "dupOf": "T-g-alpha-1", "fg": "gpcr"},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-gpcr", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~35–~36, ~49; transcript 9/22", "quote": "About 60 or more% of all drugs in the market target one of kind of these receptors. So if you know how they work, you’ve got 60% of the drugs in your pocket.", "id": "T-gpcr-1", "stem": "Which term is defined as: 7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors?", "options": [{"t": "G protein–coupled receptor (GPCR, 7-TM)", "correct": true, "why": "This is the definition of G protein–coupled receptor (GPCR, 7-TM)."}, {"t": "Irreversible (non-competitive) antagonist", "correct": false, "why": "Irreversible (non-competitive) antagonist: An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2)."}, {"t": "Receptor tyrosine kinase (RTK, 1-TM)", "correct": false, "why": "Receptor tyrosine kinase (RTK, 1-TM): A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation)."}, {"t": "Ion channel (ligand-gated)", "correct": false, "why": "Ion channel (ligand-gated): Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3)."}], "teach": "7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors. Four receptor classes: ion channels (L-type Ca++, GABA), 7-TM GPCRs, 1-TM (tyrosine kinases), intracellular/nuclear (steroid hormones). “If you know how they work, you’ve got 60% of the drugs in your pocket.”", "fg": "gpcr"},

{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-ion-channel", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~35–~36, ~39–~48; transcript 9/23", "quote": "You have a drug, a neurotransmitter, a hormone that is binding to a specific receptor. Once it’s bound, you can open it and allow things to move through it.", "id": "T-ion-channel-1", "stem": "Which term is defined as: Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3)?", "options": [{"t": "Ion channel (ligand-gated)", "correct": true, "why": "This is the definition of Ion channel (ligand-gated)."}, {"t": "G protein–coupled receptor (GPCR, 7-TM)", "correct": false, "why": "G protein–coupled receptor (GPCR, 7-TM): 7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors."}, {"t": "Receptor tyrosine kinase (RTK, 1-TM)", "correct": false, "why": "Receptor tyrosine kinase (RTK, 1-TM): A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation)."}, {"t": "G protein (heterotrimeric)", "correct": false, "why": "G protein (heterotrimeric): Heterotrimeric guanine nucleotide binding protein (α, β, γ subunits) coupled to 7-transmembrane receptors, defined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it."}], "teach": "Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3). Passive: always open (resting potential, funny channel). Voltage-gated: open only at certain membrane potentials (Ca++ channels open as the membrane becomes more positive). Stretch: pressure sensitive (baroreceptors). Pumps: move ions against the gradient (Na+/K+ ATPase)."},

{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-rtk", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~4–~11; Pharmacodynamics-Day-1-2026s.pdf slides ~35–~36; transcript 9/23", "quote": "They have this binding pocket on the outside, and they have this enzymatic activity inside of the cell. Typically those are transcription factors like insulin growth factors.", "id": "T-rtk-1", "stem": "Which term is defined as: A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation)?", "options": [{"t": "Receptor tyrosine kinase (RTK, 1-TM)", "correct": true, "why": "This is the definition of Receptor tyrosine kinase (RTK, 1-TM)."}, {"t": "G protein–coupled receptor (GPCR, 7-TM)", "correct": false, "why": "G protein–coupled receptor (GPCR, 7-TM): 7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors."}, {"t": "Nuclear (intracellular) receptor", "correct": false, "why": "Nuclear (intracellular) receptor: Intracellular receptors and transcriptional regulators: a superfamily of 48 receptor proteins that are transcription factor regulators. Ligands (androgens, estrogens, glucocorticoids, thyroid hormone, vitamin D) bind in the cytosol or nucleus and regulate gene expression (protein synthesis or mRNA turnover); co-repressor bound = inactive, co-activator bound = active."}, {"t": "Ion channel (ligand-gated)", "correct": false, "why": "Ion channel (ligand-gated): Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3)."}], "teach": "A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation). Downstream: Grb2 → GEF → RAS → RAF → MEK → ERK → gene transcription; 20–25% of cancers contain a RAS mutation, so a RAS blocker is an indirect antagonist that stops cell growth."},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-nuclear-receptor", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~12–~14; Pharmacodynamics-Day-1-2026s.pdf slides ~35–~36; transcript 9/23", "quote": "Those are glucocor[tico]steroids. They are nuclear receptors. They affect DNA. They affect messenger RNA production.", "id": "T-nuclear-receptor-1", "stem": "Which term is defined as: Intracellular receptors and transcriptional regulators: a superfamily of 48 receptor proteins that are transcription factor regulators. Ligands (androgens, estrogens, glucocorticoids, thyroid hormone, vitamin D) bind in the cytosol or nucleus and regulate gene expression (protein synthesis or mRNA turnover); co-repressor bound = inactive, co-activator bound = active?", "options": [{"t": "Nuclear (intracellular) receptor", "correct": true, "why": "This is the definition of Nuclear (intracellular) receptor."}, {"t": "Receptor tyrosine kinase (RTK, 1-TM)", "correct": false, "why": "Receptor tyrosine kinase (RTK, 1-TM): A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation)."}, {"t": "G protein–coupled receptor (GPCR, 7-TM)", "correct": false, "why": "G protein–coupled receptor (GPCR, 7-TM): 7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors."}, {"t": "Constitutive activity", "correct": false, "why": "Constitutive activity: Receptor activity that is present by itself, without any drug, hormone or neurotransmitter. Receptors that have constitutive activity are more sensitive to inverse agonists; it is what an inverse agonist shuts down."}], "teach": "Intracellular receptors and transcriptional regulators: a superfamily of 48 receptor proteins that are transcription factor regulators. Ligands (androgens, estrogens, glucocorticoids, thyroid hormone, vitamin D) bind in the cytosol or nucleus and regulate gene expression (protein synthesis or mRNA turnover); co-repressor bound = inactive, co-activator bound = active. Aldosterone at the mineralocorticoid receptor codes mRNA for more pumps and channels in the principal cell: sodium saving, potassium wasting. Exam ask: “what is the function of a nuclear receptor? How do they work”."},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-nuclear-receptor", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~12–~14; Pharmacodynamics-Day-1-2026s.pdf slides ~35–~36; transcript 9/23", "quote": "Those are glucocor[tico]steroids. They are nuclear receptors. They affect DNA. They affect messenger RNA production.", "id": "T-nuclear-receptor-2", "stem": "What does the term \"Nuclear (intracellular) receptor\" mean?", "options": [{"t": "Intracellular receptors and transcriptional regulators: a superfamily of 48 receptor proteins that are transcription factor regulators. Ligands (androgens, estrogens, glucocorticoids, thyroid hormone, vitamin D) bind in the cytosol or nucleus and regulate gene expression (protein synthesis or mRNA turnover); co-repressor bound = inactive, co-activator bound = active.", "correct": true, "why": "This is the definition of Nuclear (intracellular) receptor."}, {"t": "A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation).", "correct": false, "why": "That defines receptor tyrosine kinase (rtk, 1-tm)."}, {"t": "7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors.", "correct": false, "why": "That defines g protein–coupled receptor (gpcr, 7-tm)."}, {"t": "Receptor activity that is present by itself, without any drug, hormone or neurotransmitter. Receptors that have constitutive activity are more sensitive to inverse agonists; it is what an inverse agonist shuts down.", "correct": false, "why": "That defines constitutive activity."}], "teach": "Intracellular receptors and transcriptional regulators: a superfamily of 48 receptor proteins that are transcription factor regulators. Ligands (androgens, estrogens, glucocorticoids, thyroid hormone, vitamin D) bind in the cytosol or nucleus and regulate gene expression (protein synthesis or mRNA turnover); co-repressor bound = inactive, co-activator bound = active. Aldosterone at the mineralocorticoid receptor codes mRNA for more pumps and channels in the principal cell: sodium saving, potassium wasting. Exam ask: “what is the function of a nuclear receptor? How do they work”.", "dupOf": "T-nuclear-receptor-1"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-cross-talk", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~30; transcript 9/23", "quote": "So we have multiple receptors that can be activated at the same time as we talked a little bit about that earlier in our heart, we have two major receptors, the beta 1s, which are sympathetic, and the M2s, muscarinics, which are parasympathetic, right?", "id": "T-cross-talk-1", "stem": "Which term is defined as: Interaction between signal transduction pathways within the same cell that yields a net response. In the heart, M2 (Gαi, ↓cAMP, ↓HR) and β1 (Gαs, ↑cAMP, ↑HR) both act on adenylate cyclase?", "options": [{"t": "Cross-talk", "correct": true, "why": "This is the definition of Cross-talk."}, {"t": "Gαs, Gαi and Gαq", "correct": false, "why": "Gαs, Gαi and Gαq: The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle)."}, {"t": "Second messenger", "correct": false, "why": "Second messenger: Small molecules created, degraded or moved by an enzyme, ion channel or transport protein (the effector); they diffuse near their site of synthesis and convey information to a variety of targets. Slide examples: cAMP, PKA, PKC, IP3, Ca++."}, {"t": "Signal transduction", "correct": false, "why": "Signal transduction: The sequence signal (hormone, growth factor, neurotransmitter, agonist drug) → receptor → transducer → effector (signal amplifier) → second messenger → physiological response: the signaling that occurs prior to the response. Drugs can change the activity of these proteins, and many of them can be drug targets."}], "teach": "Interaction between signal transduction pathways within the same cell that yields a net response. In the heart, M2 (Gαi, ↓cAMP, ↓HR) and β1 (Gαs, ↑cAMP, ↑HR) both act on adenylate cyclase. Two receptors, two G proteins, one effector (AC): the heart rate is the net of the two."},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-cross-talk", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~30; transcript 9/23", "quote": "So we have multiple receptors that can be activated at the same time as we talked a little bit about that earlier in our heart, we have two major receptors, the beta 1s, which are sympathetic, and the M2s, muscarinics, which are parasympathetic, right?", "id": "T-cross-talk-2", "stem": "What does the term \"Cross-talk\" mean?", "options": [{"t": "Interaction between signal transduction pathways within the same cell that yields a net response. In the heart, M2 (Gαi, ↓cAMP, ↓HR) and β1 (Gαs, ↑cAMP, ↑HR) both act on adenylate cyclase.", "correct": true, "why": "This is the definition of Cross-talk."}, {"t": "The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle).", "correct": false, "why": "That defines gαs, gαi and gαq."}, {"t": "Small molecules created, degraded or moved by an enzyme, ion channel or transport protein (the effector); they diffuse near their site of synthesis and convey information to a variety of targets. Slide examples: cAMP, PKA, PKC, IP3, Ca++.", "correct": false, "why": "That defines second messenger."}, {"t": "The sequence signal (hormone, growth factor, neurotransmitter, agonist drug) → receptor → transducer → effector (signal amplifier) → second messenger → physiological response: the signaling that occurs prior to the response. Drugs can change the activity of these proteins, and many of them can be drug targets.", "correct": false, "why": "That defines signal transduction."}], "teach": "Interaction between signal transduction pathways within the same cell that yields a net response. In the heart, M2 (Gαi, ↓cAMP, ↓HR) and β1 (Gαs, ↑cAMP, ↑HR) both act on adenylate cyclase. Two receptors, two G proteins, one effector (AC): the heart rate is the net of the two.", "dupOf": "T-cross-talk-1"},
{"lecture": "L04", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-baseline", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~15, ~45–~46; transcript 9/28", "quote": "The baseline is just a reflection of the receptor activity that is happening.", "id": "T-baseline-1", "stem": "Which term is defined as: The starting point of a dose–response curve: a reflection of the receptor activity in the system before the drug is added. With most receptors inactive (R > R*) the baseline is 0%; with half active it is 50%. Every drug-drug question starts from the agonist’s own curve as the point of reference?", "options": [{"t": "Baseline (point of reference)", "correct": true, "why": "This is the definition of Baseline (point of reference)."}, {"t": "Emax (maximal response, ceiling)", "correct": false, "why": "Emax (maximal response, ceiling): The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy."}, {"t": "Two-state model", "correct": false, "why": "Two-state model: Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy."}, {"t": "EC50 / ED50", "correct": false, "why": "EC50 / ED50: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)."}], "teach": "The starting point of a dose–response curve: a reflection of the receptor activity in the system before the drug is added. With most receptors inactive (R > R*) the baseline is 0%; with half active it is 50%. Every drug-drug question starts from the agonist’s own curve as the point of reference. One \"greater than\" sign on the exam means about 99% of receptors are inactive and the baseline is zero. Full agonist raises it, inverse agonist lowers it to zero, neutral antagonists leave it alone.", "fg": "two-state"},
{"lecture": "L04", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-baseline", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~15, ~45–~46; transcript 9/28", "quote": "The baseline is just a reflection of the receptor activity that is happening.", "id": "T-baseline-2", "stem": "What does the term \"Baseline (point of reference)\" mean?", "options": [{"t": "The starting point of a dose–response curve: a reflection of the receptor activity in the system before the drug is added. With most receptors inactive (R > R*) the baseline is 0%; with half active it is 50%. Every drug-drug question starts from the agonist’s own curve as the point of reference.", "correct": true, "why": "This is the definition of Baseline (point of reference)."}, {"t": "Symmetrical shifts: successive rightward shifts of equal size produced by increasing doses of an orthosteric competitor (competitive antagonist, inverse agonist, irreversible antagonist), because a tenfold increase in one drug needs a tenfold increase in the other. Asymmetrical shifts: shifts of unequal size produced by allosteric agonists and antagonists, whose binding at the other site does not depend on the agonist.", "correct": false, "why": "That defines symmetrical vs asymmetrical shifts."}, {"t": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.", "correct": false, "why": "That defines emax (maximal response, ceiling)."}, {"t": "Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy.", "correct": false, "why": "That defines two-state model."}], "teach": "The starting point of a dose–response curve: a reflection of the receptor activity in the system before the drug is added. With most receptors inactive (R > R*) the baseline is 0%; with half active it is 50%. Every drug-drug question starts from the agonist’s own curve as the point of reference. One \"greater than\" sign on the exam means about 99% of receptors are inactive and the baseline is zero. Full agonist raises it, inverse agonist lowers it to zero, neutral antagonists leave it alone.", "dupOf": "T-baseline-1", "fg": "two-state"},
{"lecture": "L04", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-constitutive-activity", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slide ~23; transcript 9/28", "quote": "Receptors that have constitutive activity are more sensitive to inverse agonists", "id": "T-constitutive-activity-1", "stem": "Which term is defined as: Receptor activity that is present by itself, without any drug, hormone or neurotransmitter. Receptors that have constitutive activity are more sensitive to inverse agonists; it is what an inverse agonist shuts down?", "options": [{"t": "Constitutive activity", "correct": true, "why": "This is the definition of Constitutive activity."}, {"t": "Antagonist (neutral, reversible)", "correct": false, "why": "Antagonist (neutral, reversible): A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1)."}, {"t": "Inverse agonist", "correct": false, "why": "Inverse agonist: Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1."}, {"t": "G protein (heterotrimeric)", "correct": false, "why": "G protein (heterotrimeric): Heterotrimeric guanine nucleotide binding protein (α, β, γ subunits) coupled to 7-transmembrane receptors, defined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it."}], "teach": "Receptor activity that is present by itself, without any drug, hormone or neurotransmitter. Receptors that have constitutive activity are more sensitive to inverse agonists; it is what an inverse agonist shuts down. Antihistamines were called antagonists until cell lines with naturally active receptors showed that loratadine and cetirizine bring the activity to zero. Listed receptors: histamine, opioid, cannabinoid, dopamine, bradykinin, adenosine.", "fg": "inverse"},

what an inverse agonist shuts down. Antihistamines were called antagonists until cell lines with naturally active receptors showed that loratadine and cetirizine bring the activity to zero. Listed receptors: histamine, opioid, cannabinoid, dopamine, bradykinin, adenosine.", "dupOf": "T-constitutive-activity-1", "fg": "inverse"},
{"lecture": "L04", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-chemical-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slide ~35; transcript 9/28", "quote": "Chemical: Direct chemical interaction between the agonist and antagonist. E.g. Chelating agents, dimercaprol", "id": "T-chemical-antagonist-1", "stem": "Which term is defined as: A drug that antagonizes by a direct chemical interaction with the agonist (or a toxin), binding the chemical so the body can get rid of it. Example: chelating agents such as dimercaprol for gold, mercury or arsenic poisoning?", "options": [{"t": "Chemical antagonist", "correct": true, "why": "This is the definition of Chemical antagonist."}, {"t": "Physiological antagonist", "correct": false, "why": "Physiological antagonist: Two agonists acting independently of each other at different receptors in the same organ and producing opposing effects. Example of the year: acetylcholine at muscarinic receptors lowers heart rate while epinephrine at β1 raises it."}, {"t": "Competitive (reversible) antagonist", "correct": false, "why": "Competitive (reversible) antagonist: An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1."}, {"t": "Irreversible (non-competitive) antagonist", "correct": false, "why": "Irreversible (non-competitive) antagonist: An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2)."}], "teach": "A drug that antagonizes by a direct chemical interaction with the agonist (or a toxin), binding the chemical so the body can get rid of it. Example: chelating agents such as dimercaprol for gold, mercury or arsenic poisoning. No receptor is involved; the antagonist binds the chemical itself. Contrast physiological antagonism (two receptors, opposite effects)."},
