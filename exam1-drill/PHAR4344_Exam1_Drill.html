{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-signal-transduction", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~25–~28; transcript 9/23", "quote": "Signal Transduction: Signal ... Receptor ... Transducer ... Effector (Signal Amplifier) ... 2nd Messenger ... Physiological Response", "id": "T-signal-transduction-1", "stem": "Which term is defined as: The sequence signal (hormone, growth factor, neurotransmitter, agonist drug) → receptor → transducer → effector (signal amplifier) → second messenger → physiological response: the signaling that occurs prior to the response. Drugs can change the activity of these proteins, and many of them can be drug targets?", "options": [{"t": "Signal transduction", "correct": true, "why": "This is the definition of Signal transduction."}, {"t": "Effector (signal amplifier)", "correct": false, "why": "Effector (signal amplifier): An enzyme, ion channel or transport protein that creates, moves or degrades a small molecule or ions, e.g., adenylate cyclase (AC), phospholipase C (PLC). It amplifies the signal; frequently the proximal effector protein is not the ultimate physiological target."}, {"t": "Transducer", "correct": false, "why": "Transducer: The component that translates, integrates and coordinates the signal from the activated receptor, e.g., the G protein."}, {"t": "Second messenger", "correct": false, "why": "Second messenger: Small molecules created, degraded or moved by an enzyme, ion channel or transport protein (the effector); they diffuse near their site of synthesis and convey information to a variety of targets. Slide examples: cAMP, PKA, PKC, IP3, Ca++."}], "teach": "The sequence signal (hormone, growth factor, neurotransmitter, agonist drug) → receptor → transducer → effector (signal amplifier) → second messenger → physiological response: the signaling that occurs prior to the response. Drugs can change the activity of these proteins, and many of them can be drug targets. Exam ask: identify what is a signal, a receptor, a transducer, an effector (“factor system”) and a second messenger in a pathway like epinephrine → β1 → Gαs → AC → cAMP.", "fg": "gpcr"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-signal-transduction", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~25–~28; transcript 9/23", "quote": "Signal Transduction: Signal ... Receptor ... Transducer ... Effector (Signal Amplifier) ... 2nd Messenger ... Physiological Response", "id": "T-signal-transduction-2", "stem": "What does the term \"Signal transduction\" mean?", "options": [{"t": "The sequence signal (hormone, growth factor, neurotransmitter, agonist drug) → receptor → transducer → effector (signal amplifier) → second messenger → physiological response: the signaling that occurs prior to the response. Drugs can change the activity of these proteins, and many of them can be drug targets.", "correct": true, "why": "This is the definition of Signal transduction."}, {"t": "Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3).", "correct": false, "why": "That defines ion channel (ligand-gated)."}, {"t": "The component that translates, integrates and coordinates the signal from the activated receptor, e.g., the G protein.", "correct": false, "why": "That defines transducer."}, {"t": "An enzyme, ion channel or transport protein that creates, moves or degrades a small molecule or ions, e.g., adenylate cyclase (AC), phospholipase C (PLC). It amplifies the signal; frequently the proximal effector protein is not the ultimate physiological target.", "correct": false, "why": "That defines effector (signal amplifier)."}], "teach": "The sequence signal (hormone, growth factor, neurotransmitter, agonist drug) → receptor → transducer → effector (signal amplifier) → second messenger → physiological response: the signaling that occurs prior to the response. Drugs can change the activity of these proteins, and many of them can be drug targets. Exam ask: identify what is a signal, a receptor, a transducer, an effector (“factor system”) and a second messenger in a pathway like epinephrine → β1 → Gαs → AC → cAMP.", "dupOf": "T-signal-transduction-1", "fg": "gpcr"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-transducer", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~26–~28; transcript 9/23", "quote": "Our G protein, for example, can understand that change in the receptor. And by understanding and translating that change, it’s going to be called the transducer.", "id": "T-transducer-1", "stem": "Which term is defined as: The component that translates, integrates and coordinates the signal from the activated receptor, e.g., the G protein?", "options": [{"t": "Transducer", "correct": true, "why": "This is the definition of Transducer."}, {"t": "Effector (signal amplifier)", "correct": false, "why": "Effector (signal amplifier): An enzyme, ion channel or transport protein that creates, moves or degrades a small molecule or ions, e.g., adenylate cyclase (AC), phospholipase C (PLC). It amplifies the signal; frequently the proximal effector protein is not the ultimate physiological target."}, {"t": "Second messenger", "correct": false, "why": "Second messenger: Small molecules created, degraded or moved by an enzyme, ion channel or transport protein (the effector); they diffuse near their site of synthesis and convey information to a variety of targets. Slide examples: cAMP, PKA, PKC, IP3, Ca++."}, {"t": "G protein (heterotrimeric)", "correct": false, "why": "G protein (heterotrimeric): Heterotrimeric guanine nucleotide binding protein (α, β, γ subunits) coupled to 7-transmembrane receptors, defined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it."}], "teach": "The component that translates, integrates and coordinates the signal from the activated receptor, e.g., the G protein. “Fancy name for translation.” Transducer = G protein; effector = the enzyme it activates (AC, PLC); second messenger = the small molecule the effector makes (cAMP, IP3).", "fg": "gpcr"},

 protein.", "correct": false, "why": "That defines transducer."}], "teach": "Heterotrimeric guanine nucleotide binding protein (α, β, γ subunits) coupled to 7-transmembrane receptors, defined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it. The G protein is the transducer. Poll trap: G proteins are defined by the α subunit, not the β subunit.", "dupOf": "T-g-protein-1", "fg": "gpcr"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-g-alpha", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~3, ~30; Pharmacodynamics-Day-1-2026s.pdf slides ~50–~55; transcript 9/23", "quote": "We know that the alpha S always is going to be associated with the AC and always is going to increase the camp. The alphai, which is the opposite, also is going to be associated with the AC, but in this case it’s going to suppress the camp. And then the alpha Q is going to increase IP3 and calcium.", "id": "T-g-alpha-1", "stem": "Which term is defined as: The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle)?", "options": [{"t": "Gαs, Gαi and Gαq", "correct": true, "why": "This is the definition of Gαs, Gαi and Gαq."}, {"t": "G protein (heterotrimeric)", "correct": false, "why": "G protein (heterotrimeric): Heterotrimeric guanine nucleotide binding protein (α, β, γ subunits) coupled to 7-transmembrane receptors, defined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it."}, {"t": "Effector (signal amplifier)", "correct": false, "why": "Effector (signal amplifier): An enzyme, ion channel or transport protein that creates, moves or degrades a small molecule or ions, e.g., adenylate cyclase (AC), phospholipase C (PLC). It amplifies the signal; frequently the proximal effector protein is not the ultimate physiological target."}, {"t": "Cross-talk", "correct": false, "why": "Cross-talk: Interaction between signal transduction pathways within the same cell that yields a net response. In the heart, M2 (Gαi, ↓cAMP, ↓HR) and β1 (Gαs, ↑cAMP, ↑HR) both act on adenylate cyclase."}], "teach": "The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle). His cue: adenylate cyclase goes with cyclic AMP; αq goes with phospholipase C and IP3. Gαi is the trap: same effector as Gαs, opposite direction.", "fg": "gpcr"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-g-alpha", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~3, ~30; Pharmacodynamics-Day-1-2026s.pdf slides ~50–~55; transcript 9/23", "quote": "We know that the alpha S always is going to be associated with the AC and always is going to increase the camp. The alphai, which is the opposite, also is going to be associated with the AC, but in this case it’s going to suppress the camp. And then the alpha Q is going to increase IP3 and calcium.", "id": "T-g-alpha-2", "stem": "What does the term \"Gαs, Gαi and Gαq\" mean?", "options": [{"t": "The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle).", "correct": true, "why": "This is the definition of Gαs, Gαi and Gαq."}, {"t": "Heterotrimeric guanine nucleotide binding protein (α, β, γ subunits) coupled to 7-transmembrane receptors, defined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it.", "correct": false, "why": "That defines g protein (heterotrimeric)."}, {"t": "An enzyme, ion channel or transport protein that creates, moves or degrades a small molecule or ions, e.g., adenylate cyclase (AC), phospholipase C (PLC). It amplifies the signal; frequently the proximal effector protein is not the ultimate physiological target.", "correct": false, "why": "That defines effector (signal amplifier)."}, {"t": "Interaction between signal transduction pathways within the same cell that yields a net response. In the heart, M2 (Gαi, ↓cAMP, ↓HR) and β1 (Gαs, ↑cAMP, ↑HR) both act on adenylate cyclase.", "correct": false, "why": "That defines cross-talk."}], "teach": "The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle). His cue: adenylate cyclase goes with cyclic AMP; αq goes with phospholipase C and IP3. Gαi is the trap: same effector as Gαs, opposite direction.", "dupOf": "T-g-alpha-1", "fg": "gpcr"},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-gpcr", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~35–~36, ~49; transcript 9/22", "quote": "About 60 or more% of all drugs in the market target one of kind of these receptors. So if you know how they work, you’ve got 60% of the drugs in your pocket.", "id": "T-gpcr-1", "stem": "Which term is defined as: 7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors?", "options": [{"t": "G protein–coupled receptor (GPCR, 7-TM)", "correct": true, "why": "This is the definition of G protein–coupled receptor (GPCR, 7-TM)."}, {"t": "Irreversible (non-competitive) antagonist", "correct": false, "why": "Irreversible (non-competitive) antagonist: An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2)."}, {"t": "Receptor tyrosine kinase (RTK, 1-TM)", "correct": false, "why": "Receptor tyrosine kinase (RTK, 1-TM): A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation)."}, {"t": "Ion channel (ligand-gated)", "correct": false, "why": "Ion channel (ligand-gated): Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3)."}], "teach": "7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors. Four receptor classes: ion channels (L-type Ca++, GABA), 7-TM GPCRs, 1-TM (tyrosine kinases), intracellular/nuclear (steroid hormones). “If you know how they work, you’ve got 60% of the drugs in your pocket.”", "fg": "gpcr"},

fined and regulated by the α subunit. Cycle: agonist binds, the receptor activates, GDP comes off and GTP comes on, α dissociates and activates the effector (AC or PLC); intrinsic GTPase cleavage of GTP, accelerated by RGS, reverses it.", "correct": false, "why": "That defines g protein (heterotrimeric)."}], "teach": "7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors. Four receptor classes: ion channels (L-type Ca++, GABA), 7-TM GPCRs, 1-TM (tyrosine kinases), intracellular/nuclear (steroid hormones). “If you know how they work, you’ve got 60% of the drugs in your pocket.”", "dupOf": "T-gpcr-1", "fg": "gpcr"},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-ion-channel", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~35–~36, ~39–~48; transcript 9/23", "quote": "You have a drug, a neurotransmitter, a hormone that is binding to a specific receptor. Once it’s bound, you can open it and allow things to move through it.", "id": "T-ion-channel-1", "stem": "Which term is defined as: Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3)?", "options": [{"t": "Ion channel (ligand-gated)", "correct": true, "why": "This is the definition of Ion channel (ligand-gated)."}, {"t": "G protein–coupled receptor (GPCR, 7-TM)", "correct": false, "why": "G protein–coupled receptor (GPCR, 7-TM): 7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors."}, {"t": "Receptor tyrosine kinase (RTK, 1-TM)", "correct": false, "why": "Receptor tyrosine kinase (RTK, 1-TM): A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation)."}, {"t": "Second messenger", "correct": false, "why": "Second messenger: Small molecules created, degraded or moved by an enzyme, ion channel or transport protein (the effector); they diffuse near their site of synthesis and convey information to a variety of targets. Slide examples: cAMP, PKA, PKC, IP3, Ca++."}], "teach": "Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3). Passive: always open (resting potential, funny channel). Voltage-gated: open only at certain membrane potentials (Ca++ channels open as the membrane becomes more positive). Stretch: pressure sensitive (baroreceptors). Pumps: move ions against the gradient (Na+/K+ ATPase)."},

 they diffuse near their site of synthesis and convey information to a variety of targets. Slide examples: cAMP, PKA, PKC, IP3, Ca++.", "correct": false, "why": "That defines second messenger."}], "teach": "Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3). Passive: always open (resting potential, funny channel). Voltage-gated: open only at certain membrane potentials (Ca++ channels open as the membrane becomes more positive). Stretch: pressure sensitive (baroreceptors). Pumps: move ions against the gradient (Na+/K+ ATPase).", "dupOf": "T-ion-channel-1"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-rtk", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~4–~11; Pharmacodynamics-Day-1-2026s.pdf slides ~35–~36; transcript 9/23", "quote": "They have this binding pocket on the outside, and they have this enzymatic activity inside of the cell. Typically those are transcription factors like insulin growth factors.", "id": "T-rtk-1", "stem": "Which term is defined as: A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation)?", "options": [{"t": "Receptor tyrosine kinase (RTK, 1-TM)", "correct": true, "why": "This is the definition of Receptor tyrosine kinase (RTK, 1-TM)."}, {"t": "G protein–coupled receptor (GPCR, 7-TM)", "correct": false, "why": "G protein–coupled receptor (GPCR, 7-TM): 7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors."}, {"t": "Nuclear (intracellular) receptor", "correct": false, "why": "Nuclear (intracellular) receptor: Intracellular receptors and transcriptional regulators: a superfamily of 48 receptor proteins that are transcription factor regulators. Ligands (androgens, estrogens, glucocorticoids, thyroid hormone, vitamin D) bind in the cytosol or nucleus and regulate gene expression (protein synthesis or mRNA turnover); co-repressor bound = inactive, co-activator bound = active."}, {"t": "Ion channel (ligand-gated)", "correct": false, "why": "Ion channel (ligand-gated): Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3)."}], "teach": "A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation). Downstream: Grb2 → GEF → RAS → RAF → MEK → ERK → gene transcription; 20–25% of cancers contain a RAS mutation, so a RAS blocker is an indirect antagonist that stops cell growth."},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g5", "skill": "term", "concept": "term-nuclear-receptor", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~12–~14; Pharmacodynamics-Day-1-2026s.pdf slides ~35–~36; transcript 9/23", "quote": "Those are glucocor[tico]steroids. They are nuclear receptors. They affect DNA. They affect messenger RNA production.", "id": "T-nuclear-receptor-1", "stem": "Which term is defined as: Intracellular receptors and transcriptional regulators: a superfamily of 48 receptor proteins that are transcription factor regulators. Ligands (androgens, estrogens, glucocorticoids, thyroid hormone, vitamin D) bind in the cytosol or nucleus and regulate gene expression (protein synthesis or mRNA turnover); co-repressor bound = inactive, co-activator bound = active?", "options": [{"t": "Nuclear (intracellular) receptor", "correct": true, "why": "This is the definition of Nuclear (intracellular) receptor."}, {"t": "Receptor tyrosine kinase (RTK, 1-TM)", "correct": false, "why": "Receptor tyrosine kinase (RTK, 1-TM): A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation)."}, {"t": "G protein–coupled receptor (GPCR, 7-TM)", "correct": false, "why": "G protein–coupled receptor (GPCR, 7-TM): 7-transmembrane proteins that cross the membrane seven times and couple to a heterotrimeric G protein. The largest single class of pharmacological receptors, interacting with 60% plus of active therapeutic drugs. Examples: α and β adrenergic, 5HT, histamine, muscarinic receptors."}, {"t": "Gαs, Gαi and Gαq", "correct": false, "why": "Gαs, Gαi and Gαq: The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle)."}], "teach": "Intracellular receptors and transcriptional regulators: a superfamily of 48 receptor proteins that are transcription factor regulators. Ligands (androgens, estrogens, glucocorticoids, thyroid hormone, vitamin D) bind in the cytosol or nucleus and regulate gene expression (protein synthesis or mRNA turnover); co-repressor bound = inactive, co-activator bound = active. Aldosterone at the mineralocorticoid receptor codes mRNA for more pumps and channels in the principal cell: sodium saving, potassium wasting. Exam ask: “what is the function of a nuclear receptor? How do they work”."},

/* Figures drawn as inline SVG, keyed by name. Colors come from the page's CSS
   variables so they follow light and dark mode. A question or a glossary term
   names a figure with `fg:'key'`; FIG(key) returns the markup. */
const FIG = (() => {
  const W = 360, H = 230, L = 60, R = 14, T = 20, B = 40;   // plot box
  const px = x => L + (x + 3) / 6 * (W - L - R);            // log-dose −3..3
  const py = y => T + (1 - y / 100) * (H - T - B);          // 0..100 %
  const sig = (ec, emax, n = 1, base = 0) => {
    const pts = [];
    for (let x = -3; x <= 3.001; x += 0.1) {
      const y = base + (emax - base) * Math.pow(10, n * x) / (Math.pow(10, n * x) + Math.pow(10, n * ec));
      pts.push(`${px(x).toFixed(1)},${py(y).toFixed(1)}`);
    }
    return pts.join(' ');
  };
  const axes = (xl, yl) => `<line class="ax" x1="${L}" y1="${py(0)}" x2="${W - R}" y2="${py(0)}"/><line class="ax" x1="${L}" y1="${py(0)}" x2="${L}" y2="${T}"/>
    <text class="lbl" x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle">${xl}</text>
    <text class="lbl" transform="translate(11 ${(T + py(0)) / 2}) rotate(-90)" text-anchor="middle">${yl}</text>`;
  const curve = (pts, cls, label, at, below) => `<polyline class="cv ${cls}" points="${pts}"/>` +
    (label ? `<text class="cl ${cls}" x="${px(at[0])}" y="${py(at[1]) + (below ? 14 : -5)}" text-anchor="${at[0] > 1.5 ? 'end' : 'start'}">${label}</text>` : '');
  const dash = (x1, y1, x2, y2) => `<line class="dash" x1="${px(x1)}" y1="${py(y1)}" x2="${px(x2)}" y2="${py(y2)}"/>`;
  const tick = (x, t) => `<text class="lbl" x="${px(x)}" y="${py(0) + 14}" text-anchor="middle">${t}</text>`;
  const ytick = (y, t) => `<text class="lbl sm2" x="${L - 4}" y="${py(y) + 4}" text-anchor="end">${t}</text>`;
  const wrap = (inner, cap, h = H) => `<figure class="fig"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${cap}"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>${inner}</svg><figcaption>${cap}</figcaption></figure>`;
  const F = {};

  F['drc-basic'] = () => wrap(axes('log dose', '% of maximal response') +
    dash(-3, 100, 3, 100) + ytick(100, 'Emax') + dash(0, 0, 0, 50) + dash(-3, 50, 0, 50) + ytick(50, '50%') + tick(0, 'EC50') +
    curve(sig(0, 100), 'a', 'agonist', [3, 100]),
    'A graded dose–response curve. Emax is the plateau (the y-axis limit); EC50 is the dose giving half of Emax (read on the x-axis).');

  F['potency'] = () => wrap(axes('log dose', '% of maximal response') +
    dash(-3, 50, 1, 50) + dash(-1, 0, -1, 50) + dash(1, 0, 1, 50) + tick(-1, 'EC50 A') + tick(1, 'EC50 B') + ytick(50, '50%') +
    curve(sig(-1, 100), 'a', 'A (more potent)', [-0.9, 100]) + curve(sig(1, 100), 'b', 'B', [3, 100]),
    'Same Emax, different EC50: A reaches half-maximal response at a lower dose, so A is more potent. Potency is read on the x-axis.');

  F['efficacy'] = () => wrap(axes('log dose', '% of maximal response') +
    dash(-3, 100, 3, 100) + ytick(100, 'Emax A') + dash(-3, 60, 3, 60) + ytick(60, 'Emax B') +
    curve(sig(0, 100), 'a', 'A', [3, 100]) + curve(sig(0, 60), 'b', 'B', [3, 60], true),
    'Same EC50, different Emax: A produces a larger maximal response, so A has the greater efficacy. Efficacy is read on the y-axis.');

  F['partial'] = () => wrap(axes('log dose', '% of maximal response') +
    dash(-3, 100, 3, 100) + ytick(100, '100%') + dash(-3, 50, 3, 50) + ytick(50, '50%') +
    curve(sig(0, 100), 'a', 'full agonist', [3, 100]) + curve(sig(0, 50), 'b', 'partial agonist', [3, 50], true),
    'A partial agonist plateaus below the full agonist even with every receptor occupied; more dose does not raise it further.');

  F['inverse'] = () => wrap(axes('log dose', 'receptor activity') +
    dash(-3, 30, 3, 30) + ytick(30, 'basal') +
    curve(sig(0, 100, 1, 30), 'a', 'agonist', [3, 100]) +
    `<polyline class="cv c" points="${px(-3)},${py(30)} ${px(3)},${py(30)}"/><text class="cl c" x="${px(3)}" y="${py(30) - 5}" text-anchor="end">antagonist</text>` +
    curve(sig(0, 5, 1, 30), 'b', 'inverse agonist', [3, 5], true),
    'Against a receptor with basal (constitutive) activity: an agonist raises activity, a neutral antagonist leaves it at basal, an inverse agonist lowers it below basal.');

  F['competitive'] = () => wrap(axes('log agonist dose', '% of maximal response') +
    dash(-3, 100, 3, 100) + ytick(100, 'Emax') + dash(-1, 0, -1, 50) + dash(1, 0, 1, 50) + dash(-3, 50, 1, 50) +
    curve(sig(-1, 100), 'a', 'agonist alone', [-2.9, 80]) + curve(sig(1, 100), 'b', '+ competitive antagonist', [3, 22], true) +
    `<path class="arrow" d="M${px(-0.8)} ${py(55)} L${px(0.8)} ${py(55)}"/>`,
    'A competitive (reversible) antagonist shifts the agonist curve to the right in parallel; enough agonist still reaches the same Emax, so the block is surmountable.');

  F['irreversible'] = () => wrap(axes('log agonist dose', '% of maximal response') +
    dash(-3, 100, 3, 100) + ytick(100, 'Emax') + dash(-3, 45, 3, 45) + ytick(45, 'Emax′') +
    curve(sig(0, 100), 'a', 'agonist alone', [3, 100]) + curve(sig(0, 45), 'b', '+ irreversible antagonist', [3, 45], true),
    'An irreversible (non-competitive) antagonist removes receptors from use, so the maximal response falls; no agonist dose restores it.');

  F['binding-kd'] = () => wrap(axes('log [drug]', '% of receptors bound') +
    dash(-3, 100, 3, 100) + ytick(100, '100%') + dash(0, 0, 0, 50) + dash(-3, 50, 0, 50) + ytick(50, '50%') + tick(0, 'Kd') +
    curve(sig(0, 100), 'a', 'binding', [3, 100]),
    'A binding curve. Kd is the drug concentration at which half of the receptors are occupied; the smaller the Kd, the higher the affinity.');

  F['spare'] = () => wrap(axes('log dose', '% of maximum') +
    dash(-3, 100, 3, 100) + dash(-1, 0, -1, 50) + dash(0, 0, 0, 50) + tick(-1, 'EC50') + tick(0, 'Kd') +
    curve(sig(-1, 100), 'a', 'response', [-2.9, 80]) + curve(sig(0, 100), 'b', 'occupancy', [3, 40], true),
    'Spare receptors: the response is half-maximal (EC50) at a dose that occupies fewer than half the receptors (Kd), so the response curve lies left of the binding curve.');

  F['sites'] = () => wrap(`
    <path class="shape" d="M70 150 C60 90 120 60 180 70 C240 60 300 90 290 150 C295 200 240 215 180 210 C120 215 65 200 70 150 Z"/>
    <path class="pocket" d="M150 110 C150 90 210 90 210 110 L205 140 C200 160 160 160 155 140 Z"/>
    <circle class="lig a" cx="180" cy="122" r="14"/><text class="lbl" x="180" y="126" text-anchor="middle">A</text>
    <text class="lbl" x="255" y="190" text-anchor="middle">receptor</text>
    <text class="cl a" x="180" y="60" text-anchor="middle">orthosteric site: where the endogenous agonist binds</text>
    <path class="pocket" d="M78 130 C78 118 106 118 106 130 L104 146 C102 156 82 156 80 146 Z"/>
    <circle class="lig b" cx="92" cy="136" r="10"/>
    <text class="cl b" x="60" y="182" text-anchor="start">allosteric site</text>
    <text class="lbl" x="60" y="196" text-anchor="start">a separate site; a modulator here</text>
    <text class="lbl" x="60" y="210" text-anchor="start">changes the response to A</text>`,
    'Orthosteric drugs compete for the agonist pocket (one or the other). An allosteric drug binds elsewhere and changes what the orthosteric drug does (one and the other).');

  F['two-state'] = () => wrap(`
    <rect class="box" x="40" y="70" width="110" height="60" rx="8"/><text class="lbl big" x="95" y="96" text-anchor="middle">R</text><text class="lbl" x="95" y="116" text-anchor="middle">inactive</text>
    <rect class="box" x="210" y="70" width="110" height="60" rx="8"/><text class="lbl big" x="265" y="96" text-anchor="middle">R*</text><text class="lbl" x="265" y="116" text-anchor="middle">active</text>
    <path class="arrow" d="M155 92 L205 92"/><path class="arrow" d="M205 108 L155 108"/>
    <text class="lbl" x="180" y="60" text-anchor="middle">equilibrium (L)</text>
    <text class="cl a" x="265" y="160" text-anchor="middle">full agonist: pulls to R*</text>
    <text class="cl b" x="95" y="160" text-anchor="middle">inverse agonist: pulls to R</text>
    <text class="cl c" x="180" y="190" text-anchor="middle">antagonist: binds both, leaves the equilibrium where it is</text>
    <text class="lbl" x="180" y="212" text-anchor="middle">partial agonist: shifts toward R* less than a full agonist</text>`,
    'The two-state model. Receptors sit in equilibrium between an inactive (R) and an active (R*) state; each drug class is defined by which state it favours.');

  F['gpcr'] = () => {
    const steps = [['Drug', '', 'ligand'], ['Receptor', '', '7-TM'], ['G', 'protein', 'transducer'], ['Effector', '', 'e.g. AC'], ['Second', 'messenger', 'e.g. cAMP'], ['Response', '', 'in the cell']];
    const w = 54, gap = 6, x0 = 3;
    let s = '';
    steps.forEach(([a, b], i) => {
      const x = x0 + i * (w + gap);
      const [a1, a2, b2] = [a, b, steps[i][2]];
      s += `<rect class="box" x="${x}" y="16" width="${w}" height="64" rx="6"/><text class="lbl sm" x="${x + w / 2}" y="${a2 ? 36 : 42}" text-anchor="middle">${a1}</text>${a2 ? `<text class="lbl sm" x="${x + w / 2}" y="48" text-anchor="middle">${a2}</text>` : ''}<text class="lbl xs" x="${x + w / 2}" y="68" text-anchor="middle">${b2}</text>`;
      if (i < steps.length - 1) s += `<path class="arrow" d="M${x + w} 48 L${x + w + gap} 48"/>`;
    });
    s += `<text class="lbl" x="180" y="106" text-anchor="middle">Each step can amplify the one before it.</text>`;
    return wrap(s, 'Signal transduction through a G protein–coupled receptor: the G protein is the transducer, the enzyme it turns on is the effector, and the effector makes the second messenger.', 120);
  };


  /* Six drug classes side by side: what sits in the pocket, and the response
     bar (basal level marked) that results. */
  F['classes'] = () => {
    const panels = [
      ['Full agonist', 'binds, activates', 100, 'pocket', 'a', ''],
      ['Partial agonist', 'binds, activates less', 55, 'pocket', 'a', ''],
      ['Reversible antagonist', 'binds, no activation; comes off, more agonist overcomes it', 20, 'block', 'c', ''],
      ['Irreversible antagonist', 'binds for good (covalent); agonist cannot overcome it', 20, 'block', 'b', 'lock'],
      ['Inverse agonist', 'binds, turns activity below basal', 4, 'pocket', 'b', ''],
      ['Allosteric modulator', 'binds a second site; changes what the agonist does', 100, 'both', 'a', 'plus']
    ];
    const pw = 120, ph = 120, cols = 3;
    let out = '';
    panels.forEach(([name, what, level, mode, cls, extra], i) => {
      const x0 = (i % cols) * pw, y0 = Math.floor(i / cols) * ph;
      const cx = x0 + 40, cy = y0 + 58;
      out += `<g transform="translate(${x0} ${y0})">
        <text class="lbl sm" x="${pw / 2}" y="14" text-anchor="middle">${name}</text>
        <path class="shape" d="M14 44 C10 30 30 24 40 26 C50 24 70 30 66 44 C68 70 60 84 40 84 C20 84 12 70 14 44 Z"/>
        <path class="pocket" d="M30 40 C30 32 50 32 50 40 L48 52 C46 60 34 60 32 52 Z"/>`;
      if (mode === 'pocket' || mode === 'both') out += `<circle class="lig ${cls}" cx="40" cy="45" r="7"/>`;
      if (mode === 'block') out += `<rect class="lig ${cls}" x="33" y="38" width="14" height="14" rx="2"/>`;
      if (extra === 'lock') out += `<line class="ax" x1="40" y1="52" x2="40" y2="60"/><line class="ax" x1="36" y1="60" x2="44" y2="60"/><text class="lbl xs" x="40" y="70" text-anchor="middle">covalent</text>`;
      if (extra === 'plus') out += `<path class="pocket" d="M14 54 C14 48 26 48 26 54 L25 62 C24 66 16 66 15 62 Z"/><circle class="lig b" cx="20" cy="57" r="5"/>`;
      // response bar (the caption names it; the dashed line is basal activity)
      const bx = 88, bh = 44, by = 26;
      out += `<rect class="pocket" x="${bx}" y="${by}" width="14" height="${bh}" rx="2"/>
        <line class="dash" x1="${bx - 4}" y1="${by + bh * 0.8}" x2="${bx + 18}" y2="${by + bh * 0.8}"/>
        <rect class="lig ${cls}" x="${bx + 2}" y="${by + bh - bh * level / 100}" width="10" height="${bh * level / 100}"/>
        <text class="lbl xs" x="${bx + 7}" y="${by + bh + 10}" text-anchor="middle">response</text>`;
      // caption inside panel
      const words = what.split(' '); const lines = []; let cur = '';
      words.forEach(w => { if ((cur + ' ' + w).trim().length > 27) { lines.push(cur.trim()); cur = w; } else cur += ' ' + w; }); lines.push(cur.trim());
      lines.slice(0, 3).forEach((l, k) => { out += `<text class="lbl xs" x="${pw / 2}" y="${94 + k * 9}" text-anchor="middle">${l}</text>`; });
      out += '</g>';
    });
    return wrap(out, 'Drug classes at one receptor. Circle = drug in the agonist pocket; square = drug blocking the pocket; small circle at the side = a drug at a second (allosteric) site. The bar is the response; the dashed line is the receptor’s basal activity with nothing bound.', 240);
  };

  return key => (F[key] ? F[key]() : '');
})();

 confuse:['drug'],
 quote:'Dietary supplements regulated as food ... Not Drugs (Less FDA oversight) ... until they cause harm',
 cite:'Pharmacodynamics-Day-1-2026s.pdf slides ~15–~16, ~18, ~20; transcript 9/22',
 src:'both'},

{id:'selectivity', term:'Selectivity', lecture:'L01', group:'Drug basics',
 def:'How narrowly a drug binds one receptor type rather than others: loratadine is a selective H1 inverse agonist; diphenhydramine binds H1, H2 and muscarinic receptors and is very non-selective. The less selective a drug is, the more effects and side effects it produces.',
 hook:'The larger the dose gets, the less selective a drug becomes (metoprolol is β1-selective up to about 200 mg, then affects β2). Selectivity is about which receptors are bound; affinity is how tightly.',
 confuse:['affinity','potency'],
 quote:'the larger the dose gets, the less selective a drug becomes ... Metoprolol is a beta 1 selective up to about 200 mg. Once you go above 200, you start to affect the beta 2s, so you start to lose selectivity',
 cite:'Pharmacodynamics-Day-1-2026s.pdf slides ~21, ~29; transcript 9/22; transcript 9/24',
 src:'both'},

/* ---------------- Drug–receptor binding ---------------- */
{id:'affinity', term:'Affinity', lecture:'L02', group:'Drug–receptor binding',
 def:'The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity.',
 hook:'Affinity is read on the x-axis (further left = higher affinity); efficacy on the y-axis. Poll trap: “the ability of a drug to bind and stay bound to a receptor” is affinity, not efficacy.',
 confuse:['efficacy','potency','kd'],
 fig:'binding-kd',
 quote:'Remember, affinity is how likely a drug is to bind and stay bound to a receptor, and the binding of a drug to the receptor is going to be depending on what type of bonds they form covalent bonds, hydrogen bonds, ion bonds.',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~31, ~55; Pharmacodynamics-Day-1-2026s.pdf slides ~21, ~37; transcript 9/22; transcript 9/23',
 src:'both'},

{id:'efficacy', term:'Efficacy (intrinsic efficacy)', lecture:'L02', group:'Drug–receptor binding',
 def:'The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist.',
 hook:'Read on the y-axis as the height of the curve (Emax). Efficacy cannot be calculated directly; it is a relative measurement between ligands.',
 confuse:['affinity','intrinsic-activity','potency'],
 fig:'efficacy',
 quote:'Efficacy is the ability of that drug to change the receptor behavior. It’s activity, its state from active to inactive or inactive to active, right?',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slide ~31; Pharmacodynamics-Day_3_2026s.pdf slides ~19, ~26; Pharmacodynamics-Day-1-2026s.pdf slide ~38; transcript 9/22; transcript 9/23',
 src:'both'},

{id:'intrinsic-activity', term:'Intrinsic activity', lecture:'L03', group:'Drug–receptor binding',
 def:'Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0.',
 hook:'It does not account for the tissue (how many receptors are present), so it is incomplete; efficacy is the more comprehensive term. The names and the formula are not tested.',
 confuse:['efficacy','occupancy-theory'],
 quote:'What he did not count was for the tissue, how many receptors are present in that system. So this is an incomplete theory that we can’t really use much',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slides ~24–~26; Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22; transcript 9/24',
 src:'both'},

{id:'kd', term:'Kd (dissociation constant)', lecture:'L02', group:'Drug–receptor binding',
 def:'The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional.',
 hook:'Kd is read on the x-axis of a binding curve and says nothing about effect; EC50 is 50% of the response. Compare Kd values only after converting units (milli 10^-3, micro 10^-6, nano 10^-9): “the units ... about 10% of you are gonna miss it.”',
 confuse:['ec50','affinity','mass-action'],
 fig:'binding-kd',
 quote:'So the take-home message is that the smaller the coefficient of dissociation is, the more drugs receptors are going to find together, and thus the greater the affinity is going to be.',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~45–~50; Pharmacodynamics-Day_3_2026s.pdf slide ~31; transcript 9/24',
 src:'both'},

{id:'binding-curve', term:'Binding curve (Bmax)', lecture:'L02', group:'Drug–receptor binding',
 def:'Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity.',
 hook:'A binding curve shows binding only; a dose–response curve shows effect (Emax, EC50). Drug C “requires less dose to bind 50% of the receptors” so it has the highest affinity.',
 confuse:['drc','kd'],
 fig:'binding-kd',
 quote:'And the further the left you are, the smaller the dose is going to be required, and thus the more affinity a drug is gonna have for the receptor.',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slide ~50; Pharmacodynamics-Day_3_2026s.pdf slide ~3; transcript 9/24',
 src:'both'},

{id:'mass-action', term:'Law of mass action', lecture:'L02', group:'Drug–receptor binding',
 def:'The rate of a chemical reaction is proportional to the concentration (mass) of the reactants: the more drug or the more receptors present, the greater the chance of binding. It is the basis of Kd and of dose responsiveness.',
 hook:'More receptors in a tissue make the same dose of norepinephrine appear more potent (curve shifts left) while its Kd, affinity and efficacy are unchanged; what changed is the tissue.',
 confuse:['kd','occupancy-theory'],
 quote:'The more I have either of the receptors or the more I have either the drug, the greater the capacity of binding to something is going to be, right?',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slide ~45; transcript 9/24',
 src:'both'},

{id:'covalent-bond', term:'Covalent (irreversible) bond', lecture:'L02', group:'Drug–receptor binding',
 def:'Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive.',
 hook:'Aspirin, omeprazole and phenoxybenzamine form covalent bonds; a covalent binder has the highest affinity and the smallest Kd. Weak-bond drugs must fit the pocket like a hand in a glove, which is where selectivity comes from.',
 confuse:['irreversible-antagonist','affinity'],
 quote:'They can be classified as irreversible, insurmountable, and non-competitive, which means is They all mean the same thing ... What does that mean? Once they are bound, they’re not coming off, OK?',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~15–~16; transcript 9/23; transcript 9/24',
 src:'both'},

{id:'orthosteric', term:'Orthosteric site', lecture:'L02', group:'Drug–receptor binding',
 def:'The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both.',
 hook:'Orthosteric: one or the other. Allosteric: one and the other. Spoken as “orthostatic” in the transcripts; the slide term is orthosteric.',
 confuse:['allosteric'],
 fig:'sites',
 quote:'How we define orthostatic. So they compete for the same binding pocket, right? ... with orthostatic, we can have either one or the other, not both at the same time. As with allosteric, we can have one in the other',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~18–~19; transcript 9/23; transcript 9/24',
 src:'both'},

{id:'allosteric', term:'Allosteric site / modulator', lecture:'L02', group:'Drug–receptor binding',
 def:'A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once.',
 hook:'“Where the magic in pharmacology is”: they don’t always do things by themselves but make other drugs much better or much worse. Poll traps: allosteric agonists do not compete for the orthosteric pocket and do not have the highest affinity for it.',
 confuse:['orthosteric','indirect-antagonist','allosteric-agonist'],
 fig:'classes',
 quote:'These drugs do not bind or compete for the orthostatic binding pocket. They bind someplace else on the receptor.',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~19–~20, ~39, ~44; Pharmacodynamics-Day-1-2026s.pdf slide ~29; transcript 9/22; transcript 9/23',
 src:'both'},

{id:'occupancy-theory', term:'Receptor occupancy theory', lecture:'L01', group:'Drug–receptor binding',
 def:'Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction.',
 hook:'It could not explain antagonists or inverse agonists. Ariëns added intrinsic activity; Stephenson, Furchgott and Nickerson added efficacy and the two-state model. The names are FYI, not tested.',
 confuse:['intrinsic-activity','two-state','mass-action'],
 quote:'a full agonist will produce 100% of the response as a partial may produce a 70% of the response because it can only occupy 70% of the receptors, right? So it’s based on occupancy.',
 cite:'Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22',
 src:'both'},

{id:'two-state', term:'Two-state model', lecture:'L03', group:'Drug–receptor binding',
 def:'Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy.',
 hook:'“This is gonna be home for us.” It explains inverse agonists, which occupancy theory could not. Most receptors sit in the inactive state to save energy.',
 confuse:['occupancy-theory','intrinsic-activity'],
 fig:'two-state',
 quote:'So this two-state model shows that we have receptor two confirmations, active and inactive, and that drugs can shift them once bound to the receptor from one confirmation to the other.',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slide ~31; Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22; transcript 9/23',
 src:'both'},

/* ---------------- Drug classes ---------------- */
{id:'full-agonist', term:'Full agonist', lecture:'L03', group:'Drug classes',
 def:'Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine.',
 hook:'Same affinity preference as a partial agonist; the difference is efficacy (100% vs 1–99%). “I do not know of any agonist that is irreversible.”',
 confuse:['partial-agonist','inverse-agonist'],
 fig:'classes',
 quote:'Let’s think about that we can dim, so we have one that can kind of go full bright or just halfway bright, a full agonist or a partial.',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slides ~33–~41; Pharmacodynamics-Day_2_2026s copy.pdf slides ~32–~34; transcript 9/23; transcript 9/24',
 src:'both'},

{id:'partial-agonist', term:'Partial agonist', lecture:'L03', group:'Drug classes',
 def:'Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2).',
 hook:'Dual nature: it may act as an agonist or an antagonist depending on the physiological state (varenicline during smoking vs withdrawal). A partial agonist can still be the most potent drug on a graph.',
 confuse:['full-agonist','neutral-antagonist','inverse-agonist'],
 fig:'classes',
 quote:'So sometimes we may use a partial agonist over a full agonist because we don’t need to get the max effect. We just need to get enough of it.',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slides ~50–~65; Pharmacodynamics-Day_2_2026s copy.pdf slides ~32–~34; transcript 9/23; transcript 9/24',
 src:'both'},

{id:'inverse-agonist', term:'Inverse agonist', lecture:'L02', group:'Drug classes',
 def:'Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1.',
 hook:'Petri dish with 50% of receptors naturally active: an inverse agonist brings cAMP production to zero; a competitive (neutral) antagonist leaves it at 50%.',
 confuse:['neutral-antagonist','partial-agonist'],
 fig:'classes',
 quote:'These drugs love to bind to receptors that are inactive and keep them inactive. But they have what is called negative efficacy, which means is if they bind to a receptor that is already active, producing a signal, once they are bound, they’re going to shut them off.',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~35–~36; Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22; transcript 9/23',
 src:'both'},

{id:'neutral-antagonist', term:'Antagonist (neutral, reversible)', lecture:'L02', group:'Drug classes',
 def:'A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1).',
 hook:'“Just a straight line”: an antagonist does not change the balance of receptors; an inverse agonist wants to keep everybody inactive. Intrinsic activity of an antagonist is zero.',
 confuse:['inverse-agonist','competitive-antagonist','partial-agonist'],
 fig:'classes',
 quote:'Antagonists, they’re neutral. Like they don’t care if the receptor is active or inactive, they have equal affinity for both receptor states.',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~37–~38; transcript 9/23; transcript 9/24',
 src:'both'},

{id:'competitive-antagonist', term:'Competitive (reversible) antagonist', lecture:'L02', group:'Drug classes',
 def:'An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1.',
 hook:'Every drug on the Exam 1 drug list is reversible and competitive except phenoxybenzamine (drug-list PDF). The rightward-shift curve is Day 4 material (deck preview slide ~68).',
 confuse:['irreversible-antagonist','neutral-antagonist','indirect-antagonist'],
 fig:'classes',
 quote:'when we think about uh ionic bonds, hydrogen bonds, [van der Waals] bonds, those are going to be reversible, surmountable, competitive. Different words ... they’re gonna bind and they’re gonna come off.',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~15–~16, ~18, ~37; transcript 9/23',
 src:'both'},

{id:'irreversible-antagonist', term:'Irreversible (non-competitive) antagonist', lecture:'L02', group:'Drug classes',
 def:'An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2).',
 hook:'Once phenoxybenzamine is bound the receptor has to be internalized and recycled and the body must make new ones. Poll: phenoxybenzamine has higher affinity than prazosin. The reduced-Emax curve is Day 4 material (deck preview slide ~68).',
 confuse:['competitive-antagonist','covalent-bond','inverse-agonist'],
 fig:'classes',
 quote:'This is an irreversible antagonist, non-competitive, insurmountable. So what kind of bo[n]ds does it form? Covalent.',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~15, ~18, ~37–~38; transcript 9/23; transcript 9/24',
 src:'both'},

{id:'indirect-antagonist', fig:'classes', term:'Indirect antagonist', lecture:'L02', group:'Drug classes',
 def:'A drug that inhibits the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS.',
 hook:'It can raise the response (caffeine on PDE raises cAMP; a norepinephrine transporter blocker makes norepinephrine appear more potent) or lower it (RAS blocker stops cell growth). It is not allosteric: it never touches the receptor.',
 confuse:['allosteric','competitive-antagonist'],
 quote:'So, remember that indirect antagonists can work downstream from the receptor, but also upstream from the receptor, OK?',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~40–~41; transcript 9/23; transcript 9/24',
 src:'both'},

{id:'allosteric-agonist', fig:'classes', term:'Allosteric agonist (PAM)', lecture:'L02', group:'Drug classes',
 def:'Binds at a different site on the receptor and increases the affinity and/or efficacy of another drug for the receptor (positive allosteric modulator, PAM). Diazepam and other benzodiazepines increase the affinity and/or efficacy of GABA at the GABA-A chloride channel.',
 hook:'Diazepam is the allosteric agonist on the drug list “that you have to know for your exam.” A benzodiazepine plus alcohol puts two allosteric agonists on one receptor.',
 confuse:['allosteric-antagonist','full-agonist','allosteric'],
 quote:'Benzos increase the affinity And/or efficacy of GABA For its receptor',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~21–~24, ~42; transcript 9/23',
 src:'both'},

{id:'allosteric-antagonist', fig:'classes', term:'Allosteric antagonist', lecture:'L02', group:'Drug classes',
 def:'Binds at a different site on the receptor and decreases the affinity and/or efficacy of another drug for the receptor.',
 hook:'It does not compete for the orthosteric pocket; a competitive antagonist does. “As far as I know, all allosteric agonists and antagonists are reversible.”',
 confuse:['allosteric-agonist','competitive-antagonist','indirect-antagonist'],
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slide ~43; transcript 9/23',
 src:'both'},

/* ---------------- Dose–response curves ---------------- */
{id:'drc', term:'Dose–response curve (DRC / CRC)', lecture:'L03', group:'Dose–response curves',
 def:'A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency.',
 hook:'DRC: increasing individual doses in vivo (ADME, apparent potency). CRC: increasing concentration in vitro (molar, pharmacological potency). Affinity is on the x-axis, efficacy on the y-axis, potency a combination of the two.',
 confuse:['binding-curve','graded-response'],
 fig:'drc-basic',
 quote:'So my dose is going to be on the bottom, on the X axis. My response is gonna be on the Y axis, which is on the up or down, OK?',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slides ~8–~10, ~16–~18; Pharmacodynamics-Day_2_2026s copy.pdf slide ~56; transcript 9/24',
 src:'both'},

{id:'graded-response', term:'Graded response', lecture:'L03', group:'Dose–response curves',
 def:'A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect.',
 hook:'The y-axis is normalized (% of maximum response or response per tissue weight) to eliminate biological variability between individuals: “now I can compare apples with apples.”',
 confuse:['drc','threshold'],
 quote:'Graded response by multiple increases of drug doses over a specific range',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slides ~10, ~16, ~18; transcript 9/24',
 src:'slide'},

{id:'threshold', term:'Threshold', lecture:'L03', group:'Dose–response curves',
 def:'The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50.',
 hook:'Threshold is where the curve starts; EC50 is the halfway point; Emax is the ceiling.',
 confuse:['ec50','emax','slope'],
 fig:'drc-basic',
 quote:'Remember that the threshold is the dose right before something happens, right? So I know that at any dose below this, no effect.',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slides ~20–~21; transcript 9/24',
 src:'both'},

{id:'emax', term:'Emax (maximal response, ceiling)', lecture:'L03', group:'Dose–response curves',
 def:'The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.',
 hook:'Giving more drug past the ceiling does no more good. Curves with equal Emax differ by affinity; when EC50 is equal, greater efficacy makes the drug more potent (Relative Efficacy slide).',
 confuse:['ec50','efficacy','threshold'],
 fig:'drc-basic',
 quote:'What are the two reasons why we have reached the Emacs and we can’t keep going up? All the receptors are occupied or I max out the physiological system, right?',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slides ~11–~14, ~20–~21, ~27; transcript 9/24',
 src:'both'},

{id:'slope', term:'Slope', lecture:'L03', group:'Dose–response curves',
 def:'The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax.',
 hook:'Which is better “depends”: the steep curve goes from no effect to max all at once; the shallow one gives a greater range of doses before a toxic effect.',
 confuse:['threshold','emax','potency'],
 quote:'In that slope in that area of the curve, this is when I’m going to get the most bang for my buck. This is I’m going to get the greatest change in the response with the smallest change in the dose.',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slides ~20–~21; transcript 9/24',
 src:'both'},

{id:'ec50', term:'EC50 / ED50', lecture:'L03', group:'Dose–response curves',
 def:'EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional).',
 hook:'Kd is the concentration binding 50% of receptors (affinity, no effect); EC50 is 50% of the response (potency). Both are read on the x-axis. “Philosophically identical”: one is a dose, the other a concentration.',
 confuse:['kd','emax','potency'],
 fig:'drc-basic',
 quote:'So, the take-home message that you can’t forget is that the smallest the ED50 is or the [EC]50, the greater the potency is gonna be. They’re inverse proportional.',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~57–~58; Pharmacodynamics-Day_3_2026s.pdf slides ~20–~22, ~29; transcript 9/24',
 src:'both'},

{id:'potency', term:'Potency (pharmacological)', lecture:'L03', group:'Dose–response curves',
 def:'Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy.',
 hook:'Potency ≠ efficacy: the most potent drug (smallest EC50) can be a partial agonist; the most efficacious has the highest Emax. “Affinity is gonna be on the bottom, efficacy is gonna be on the Y axis, and potency is gonna be a combination of the two.”',
 confuse:['efficacy','affinity','apparent-potency'],
 fig:'potency',
 quote:'The take home message over here is that potency is not only going to be defined by the efficacy of the affinity, but also the tissue that is going to be bound to.',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slides ~7, ~22, ~27–~29; Pharmacodynamics-Day_2_2026s copy.pdf slides ~52–~54; Pharmacodynamics-Day-1-2026s.pdf slides ~21–~22, ~27; transcript 9/22; transcript 9/23; transcript 9/24',
 src:'both'},

{id:'apparent-potency', term:'Apparent potency', lecture:'L01', group:'Dose–response curves',
 def:'The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency.',
 hook:'Route of administration and first-pass metabolism change apparent potency (IV has 100% bioavailability); they do not change the drug’s affinity or efficacy, which set pharmacological potency.',
 confuse:['potency','pharmacokinetics'],
 quote:'So this is going to give us our apparent potency. Why is apparent? ... It’s only appearing because it’s not the total concentration of the drug.',
 cite:'Pharmacodynamics-Day-1-2026s.pdf slides ~23, ~27; Pharmacodynamics-Day_3_2026s.pdf slide ~8; transcript 9/22',
 src:'both'},

{id:'relative-potency', term:'Relative potency', lecture:'L03', group:'Dose–response curves',
 def:'The ratio of two drugs’ ED50 (or EC50) values, ED50B / ED50A. A drug that needs 1000 times less drug to produce an equivalent response is 1000X more potent.',
 hook:'Compare potency at equivalent effects (e.g., 50%), not at 100%, because a partial agonist never reaches 100%. “Math is gonna be minimal.”',
 confuse:['potency','ec50'],
 quote:'We can say that a drug A is 1000 times more potent than drug B because it requires 1000 times less drug to produce equivalent responses.',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slide ~23; transcript 9/24',
 src:'both'},

/* ---------------- Receptors and signaling ---------------- */
{id:'signal-transduction', term:'Signal transduction', lecture:'L02', group:'Receptors and signaling',
 def:'The sequence signal (hormone, growth factor, neurotransmitter, agonist drug) → receptor → transducer → effector (signal amplifier) → second messenger → physiological response: the signaling that occurs prior to the response. Drugs can change the activity of these proteins, and many of them can be drug targets.',
 hook:'Exam ask: identify what is a signal, a receptor, a transducer, an effector (“factor system”) and a second messenger in a pathway like epinephrine → β1 → Gαs → AC → cAMP.',
 confuse:['transducer','effector','second-messenger'],
 fig:'gpcr',
 quote:'Signal Transduction: Signal ... Receptor ... Transducer ... Effector (Signal Amplifier) ... 2nd Messenger ... Physiological Response',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~25–~28; transcript 9/23',
 src:'both'},

{id:'transducer', term:'Transducer', lecture:'L02', group:'Receptors and signaling',
 def:'The component that translates, integrates and coordinates the signal from the activated receptor, e.g., the G protein.',
 hook:'“Fancy name for translation.” Transducer = G protein; effector = the enzyme it activates (AC, PLC); second messenger = the small molecule the effector makes (cAMP, IP3).',
 confuse:['effector','second-messenger','g-protein'],
 fig:'gpcr',
 quote:'Our G protein, for example, can understand that change in the receptor. And by understanding and translating that change, it’s going to be called the transducer.',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~26–~28; transcript 9/23',
 src:'both'},

{id:'effector', term:'Effector (signal amplifier)', lecture:'L02', group:'Receptors and signaling',
 def:'An enzyme, ion channel or transport protein that creates, moves or degrades a small molecule or ions, e.g., adenylate cyclase (AC), phospholipase C (PLC). It amplifies the signal; frequently the proximal effector protein is not the ultimate physiological target.',
 hook:'Poll trap: “phospholipase C is an example of a second messenger” — no, PLC is the effector (his “factor system”); IP3 is its second messenger.',
 confuse:['second-messenger','transducer'],
 fig:'gpcr',
 quote:'Frequently, the proximal cellular effector protein is not the ultimate physiological target but rather is an enzyme, ion channel, or transport protein that creates, moves, or degrades a small molecule or ions',
 cite:'Pharmacodynamics-Day_2_2026s copy.pdf slides ~26–~28; transcript 9/23',
 src:'both'},

{id:'second-messenger', term:'Second messenger', lecture:'L02', group:'Receptors and signaling',

  if (!Q.answered && (q.multi || q.type === 'match')) h += `<button class="btn" id="check">Check</button>`;
  if (Q.answered) {
    h += `<div class="verdict ${Q.ok ? 'ok' : 'bad'}">${Q.ok ? '✓ Correct' : '✗ Not correct'}</div>`;
    if (q.type === 'match' && q.pairs) h += q.pairs.filter(p => p.why).map(p => `<div class="why"><b>${esc(p.l)}</b>: ${esc(p.why)}</div>`).join('');
    if (q.teach) h += `<div class="teach">${teachHTML(q.teach)}</div>`;
    if (q.fg && typeof FIG === 'function') h += FIG(q.fg);
    if (q.note) h += `<div class="note">${esc(q.note)}</div>`;
    h += readingHTML(q.reading);
    if (q.quote) h += `<div class="quote">“${esc(q.quote)}”</div>`;
    h += `<div class="cite">${esc(fmtCite(q.cite))}</div>`;
    if (Q.ok) h += `<div class="row" style="margin-top:12px"><span class="meta" style="margin:0">How sure were you?</span>
      <button class="btn" data-c="sure">Knew it</button><button class="btn ghost" data-c="unsure">Not sure</button><button class="btn ghost" data-c="guess">I guessed</button></div>`;
    else h += `<div class="row" style="margin-top:12px"><button class="btn" data-c="wrong">Next</button></div>`;
  }
  h += `<div class="meta kbd">Keys: A–E or 1–5 pick an option · Enter checks or continues</div></div>`;
  $('#view').innerHTML = h;
  document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => pick(+b.dataset.o));
  document.querySelectorAll('select[data-l]').forEach(s => s.onchange = () => { Q.mpick = Q.mpick || {}; Q.mpick[+s.dataset.l] = s.value; });
  const ck = $('#check'); if (ck) ck.onclick = check;
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => finish(b.dataset.c));
}
const pairOf = (q, l) => (q.pairs.find(p => p.l === l) || {}).r;
function pick(oi) {
  const q = Q.cur; if (Q.answered) return;
  if (q.multi) { Q.picked.has(oi) ? Q.picked.delete(oi) : Q.picked.add(oi); renderQ(); return; }
  Q.picked = oi; check();
}
function gradeMulti(q, set) { return q.options.every((o, i) => !!o.correct === set.has(i)); }
function check() {
  const q = Q.cur;
  if (q.type === 'match') {
    Q.mpick = Q.mpick || {};
    Q.ok = q.left.every((l, i) => Q.mpick[i] === pairOf(q, l));
  } else if (q.multi) {
    if (!Q.picked.size) return;
    Q.ok = gradeMulti(q, Q.picked);

}
function finish(conf) {
  const q = Q.cur, st = qs(q.id);

  const picked = q.type === 'match' ? Q.mpick : q.multi ? [...Q.picked] : Q.picked;
  S.log.push({id: q.id, t: Date.now(), ok: Q.ok, conf, picked, ms: Date.now() - Q.t0});
  if (S.log.length > 5000) S.log = S.log.slice(-5000);
  schedule(q.id, Q.ok ? conf : 'wrong');
  if (!Q.ok || conf === 'guess') Q.retest.push({concept: q.concept, not: q.id});
  Q.done++; if (Q.ok) Q.right++;

}

/* ---------- Weak spots ---------- */
function vWeak() {
  const pool = examPool();
  if (!S.log.length) { $('#view').innerHTML = '<h2>Weak spots</h2><div class="empty">Answer some questions and this fills in by topic, by skill, and with the wrong options you keep choosing.</div>'; return; }
  const recent = {}; // last 3 answers per question
  S.log.forEach(e => { (recent[e.id] = recent[e.id] || []).push(e); });
  const score = q => { const r = (recent[q.id] || []).slice(-3); if (!r.length) return null; return r.filter(e => e.ok && e.conf !== 'guess').length / r.length; };
  const group = (keyFn, nameFn) => {
    const g = {};
    pool.forEach(q => { const k = keyFn(q); (g[k] = g[k] || []).push(q); });
    return Object.entries(g).map(([k, list]) => {
      const sc = list.map(score).filter(x => x != null);
      return {k, name: nameFn(k), n: list.length, seen: sc.length, pct: sc.length ? Math.round(100 * sc.reduce((a, b) => a + b, 0) / sc.length) : null,
        miss: list.filter(q => score(q) != null && score(q) < 1)};
    }).sort((a, b) => (a.pct == null ? 101 : a.pct) - (b.pct == null ? 101 : b.pct));
  };
  const table = (rows, title) => `<h3>${title}</h3><div class="card">${rows.map(r => `<div class="topicrow"><span>${esc(r.name)}<small>${r.seen}/${r.n} seen</small></span>
    <span class="row"><span class="bar-meter"><span style="width:${r.pct || 0}%"></span></span><small>${r.pct == null ? '—' : r.pct + '%'}</small>
    ${r.miss.length ? `<button class="btn ghost" data-miss="${esc(title)}|${esc(r.k)}">Drill ${r.miss.length} missed</button>` : ''}</span></div>`).join('')}</div>`;
  const byTopic = group(q => q.topic, k => (TOPIC[k] || {}).name || k);
  const bySkill = group(q => q.skill, k => (SKILL[k] || {}).label || k);
  const allMiss = pool.filter(q => score(q) != null && score(q) < 1);
  // confusions: wrong option picked vs right
  const conf = {};
  S.log.filter(e => !e.ok && byId[e.id] && typeof e.picked === 'number').forEach(e => {
    const q = byId[e.id], w = q.options[e.picked]; if (!w) return;
    const key = e.id + '|' + e.picked;
    conf[key] = conf[key] || {q, wrong: w.t, right: q.options.filter(o => o.correct).map(o => o.t).join(' · '), n: 0};
    conf[key].n++;
  });
  const confs = Object.values(conf).sort((a, b) => b.n - a.n).slice(0, 12);
  let h = `<h2>Weak spots</h2><p class="sub">Scored on the last three answers to each question; a correct answer marked "I guessed" counts as a miss.</p>
    <div class="card row" style="justify-content:space-between"><span><b>${allMiss.length}</b> questions not yet solid</span>
    <button class="btn" id="missall" ${allMiss.length ? '' : 'disabled'}>Drill all of them</button></div>`;
  h += table(byTopic, 'By topic') + table(bySkill, 'By skill');
  if (confs.length) h += `<h3>Wrong answers you chose</h3><div class="card tablewrap"><table><thead><tr><th>Question</th><th>You chose</th><th>Answer</th><th>×</th></tr></thead><tbody>
    ${confs.map(c => `<tr><td>${esc(c.q.stem.slice(0, 110))}${c.q.stem.length > 110 ? '…' : ''}</td><td>${esc(c.wrong)}</td><td>${esc(c.right)}</td><td>${c.n}</td></tr>`).join('')}</tbody></table></div>`;
  $('#view').innerHTML = h;
  $('#missall').onclick = () => startQuiz(allMiss, 'Weak spots', 'sr');
  document.querySelectorAll('[data-miss]').forEach(b => b.onclick = () => {
    const [t, k] = b.dataset.miss.split('|');
    const rows = t === 'By topic' ? byTopic : bySkill;
    const r = rows.find(x => x.k === k); if (r) startQuiz(r.miss, r.name, 'sr');
  });
}

/* ---------- Exam simulator ----------
   Draws to the pools in COURSE. When the paper length has not been announced
   the student picks a length; each pool then gets a share proportional to its
   marks, or to its size in the bank when marks are not set. lowYield items are
   left out, and dupOf keeps two wordings of one fact off one paper. */
let EX = null;
function drawExam(n) {
  const ex = active(), pools = ex.pools;
  // Definition questions are capped at 15% of the paper, whatever their share of the bank.
  const nTerm = Math.round(n * 0.15);
  const termPool = shuffle(QUESTIONS.filter(q => q.skill === 'term' && !q.lowYield && pools.some(p => inFilter(q, p.filter))));
  const termPick = []; const termSeen = new Set();
  for (const q of termPool) { if (termPick.length >= nTerm) break; if (termSeen.has(q.concept)) continue; termPick.push(q); termSeen.add(q.concept); }
  n -= termPick.length;
  const eligible = p => QUESTIONS.filter(q => inFilter(q, p.filter) && !q.lowYield && !q.type && q.skill !== 'term');
  const sizes = pools.map(p => p.marks || eligible(p).length);
  const tot = sizes.reduce((a, b) => a + b, 0);
  let want = sizes.map(s => Math.floor(n * s / tot));
  let short = n - want.reduce((a, b) => a + b, 0);
  for (let i = 0; short > 0; i = (i + 1) % pools.length) { want[i]++; short--; }
  const out = [], used = new Set(), concepts = new Set();
  pools.forEach((p, i) => {
    // spread across topics: shuffle, one per concept before repeats
    const list = shuffle(eligible(p)).sort((a, b) => (concepts.has(a.concept) ? 1 : 0) - (concepts.has(b.concept) ? 1 : 0));
    for (const q of list) {
      if (want[i] <= 0) break;
      if (used.has(q.id) || (q.dupOf && used.has(q.dupOf)) || [...used].some(u => byId[u].dupOf === q.id)) continue;
      if (concepts.has(q.concept) && list.some(o => !used.has(o.id) && !concepts.has(o.concept))) continue;
      out.push(q); used.add(q.id); concepts.add(q.concept); want[i]--;
    }
    for (const q of list) { if (want[i] <= 0) break; if (!used.has(q.id)) { out.push(q); used.add(q.id); want[i]--; } }
  });
  return shuffle(out.concat(termPick));
}
function vExam() {
  const ex = active(), max = examPool().filter(q => !q.lowYield && !q.type).length;
  if (EX && !EX.done) return renderExam();
  const lens = [...new Set([ex.questions, 25, 50, max].filter(x => x && x <= max))].sort((a, b) => a - b);
  let h = `<h2>Exam simulator</h2><p class="sub">${esc(ex.name)}: ${ex.questions ? ex.questions + ' questions' : 'question count not yet announced'}, ${ex.minutes} minutes allotted.
    Answers are not shown until you submit. Select-all items are scored all-or-nothing; definition questions make up at most 15% of the paper.</p>
    <div class="card"><div class="row"><span>Length:</span>${lens.map(n => `<span class="chip ${n === (ex.questions || lens[0]) ? 'on' : ''}" data-n="${n}">${n === max ? 'All ' + n : n}</span>`).join('')}</div>
    <div class="row" style="margin-top:10px"><label><input type="checkbox" id="scale" checked> Scale the clock to the length (${ex.minutes} min for the full paper)</label></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="startx">Start</button></div></div>`;
  if (S.exams && S.exams.length) h += `<h3>Past attempts</h3><div class="card">${S.exams.slice(-8).reverse().map(e => `<div class="topicrow"><span>${new Date(e.t).toLocaleString()}</span><span>${e.score}/${e.n} (${Math.round(100 * e.score / e.n)}%)</span></div>`).join('')}</div>`;
  $('#view').innerHTML = h;
  let n = ex.questions || lens[0];
  document.querySelectorAll('[data-n]').forEach(c => c.onclick = () => { n = +c.dataset.n; document.querySelectorAll('[data-n]').forEach(x => x.classList.toggle('on', x === c)); });
  $('#startx').onclick = () => {
    const paper = drawExam(n);
    const full = ex.questions || max;
    const mins = $('#scale').checked ? Math.max(5, Math.round(ex.minutes * paper.length / full)) : ex.minutes;
    EX = {qs: paper.map(q => q.id), i: 0, ans: {}, flag: {}, orders: paper.map(q => shuffle(q.options.map((o, k) => k))), ends: Date.now() + mins * MIN, done: false};
    renderExam();
  };
}
let TICK = null;
function renderExam() {
  clearInterval(TICK);
