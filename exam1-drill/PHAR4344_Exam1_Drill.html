 teach:'Phenoxybenzamine forms covalent bonds that cannot be reversed under normal metabolic function, so the receptors it occupies are gone. Norepinephrine needs a higher dose for the receptors that remain (shift right) and, once too few remain, cannot reach the maximal response (Emax falls). Anything that lowers the Emax has to be an irreversible antagonist or an allosteric antagonist affecting efficacy.',
 quote:'If you see something that it lowers the Emacs, you know that has to be either an irreversible antagonist or an allosteric antagonist that affects efficacy, right? Those are the only two that can affect the Emacs.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~3, ~51–~55; transcript 9/28',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Competitive & Irreversible Antagonists', t:'After an irreversible antagonist occupies some proportion of receptors, the number of unoccupied receptors may be too low for the agonist, even at high concentrations, to produce the previous maximal response.'}]},

{id:'L04-038', fg:'potency', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'allo', skill:'figure',
 concept:'allosteric-agonist-affinity-only', tags:['poll'], source:'both',
 stem:'If DRC C is the DRC of norepinephrine binding to the β1 receptor alone, which DRC best represents the DRC of norepinephrine in the presence of an allosteric agonist that affects only the affinity?',
 graph:{curves:[{label:'A', ec:1, emax:100}, {label:'B', ec:-1, emax:60}, {label:'C', ec:0, emax:100}, {label:'D', ec:-1, emax:100}], base:0, x:'log dose norepinephrine', y:'% of maximal response'},
 options:[
  {t:'A', correct:false, why:'A moved to the right, so norepinephrine was made less potent; that is an allosteric antagonist affecting affinity, not an agonist.'},
  {t:'B', correct:false, why:'B moved left but lost its maximum, so efficacy was affected; the stem says affinity only, and no drug raises affinity while lowering efficacy.'},
  {t:'C', correct:false, why:'C is the point of reference (norepinephrine alone); an allosteric agonist changes the curve.'},
  {t:'D', correct:true, why:'An allosteric agonist helps: it makes the pocket easier to bind, so norepinephrine appears more potent (shift left) and, affinity only, the Emax is untouched.'},
  {t:'None of the above', correct:false, why:'D shows the affinity-only allosteric agonist: shift to the left with the same maximum.'}],
 teach:'Same poll, different point of reference. An allosteric agonist binds someplace else on the receptor and helps the agonist, so only curves to the left are possible. Affinity only means the ability to produce the effect is untouched: the maximum does not move. A curve whose maximum changed (B) involves efficacy; a curve to the right (A) means the agonist was made less potent.',
 quote:'Help, which means you’re gonna make the drug more potent, right? And it because it only affects affinity, you’re not affecting the ability to produce its effect, is moving to the left.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~26, ~42; transcript 9/28'},

{id:'L04-039', fg:'classes', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'comp', skill:'figure',
 concept:'competitive-antagonist-neutral-alone', tags:['poll','metoprolol'], source:'both',
 stem:'The DRCs below represent the individual DRCs of five different drugs given on their own to a system in which half the receptors are active. DRC C most likely represents the DRC of:',
 graph:{curves:[{label:'A', ec:-1, emax:100}, {label:'B', ec:0, emax:0}, {label:'C', ec:0, emax:50}, {label:'D', ec:0.4, emax:100}, {label:'E', ec:0.6, emax:80}], base:50, x:'log dose', y:'% of maximal response'},
 options:[
  {t:'Loratadine', correct:false, why:'Loratadine is the inverse agonist; alone it brings a raised baseline down to 0%, which is curve B, not C.'},
  {t:'Metoprolol', correct:true, why:'A flat line at the baseline is a drug with affinity but no efficacy: the neutral competitive antagonist. Metoprolol is the competitive antagonist on the list.'},
  {t:'Epinephrine', correct:false, why:'Epinephrine is a full agonist; alone it rises from the baseline to 100%.'},
  {t:'Albuterol', correct:false, why:'Albuterol is a partial agonist; alone it rises from the 50% baseline toward its own plateau below 100%.'}],
 teach:'Two steps: classify curve C, then match the class to the drug list. A competitive antagonist has equal affinity for active and inactive receptors and does not evoke a change, so alone it leaves the balance where it found it: 50 stays 50. Full and partial agonists go up from the baseline; an inverse agonist goes down to 0%. Metoprolol is the competitive antagonist.',
 quote:'they don’t care what the receptor is, active or inactive, they hang out with both types. They don’t discriminate as such, they don’t change the balance of the receptor activity.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~24, ~43–~44; transcript 9/28',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Competitive & Irreversible Antagonists', t:'Receptor antagonists bind to receptors but do not activate them; their primary action is to reduce the effects of agonists that normally activate the receptor.'}]},

{id:'L04-040', fg:'partial', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'recap', skill:'figure',
 concept:'partial-agonist-table', tags:['poll','albuterol'], source:'both',
 stem:'The DRCs below represent the individual DRCs of five different drugs. DRC B most likely represents the DRC of:',
 graph:{curves:[{label:'A', ec:0, emax:100}, {label:'B', ec:0.3, emax:60}, {label:'C', ec:-1, emax:100}, {label:'D', ec:0, emax:0}, {label:'E', ec:1, emax:100}], base:0, x:'log dose', y:'% of maximal response'},
 options:[
  {t:'Norepinephrine', correct:false, why:'Norepinephrine is a full agonist and would reach 100%, like A, C or E.'},
  {t:'Loratadine', correct:false, why:'Loratadine is the inverse agonist; with the baseline already at 0% it gives a flat line at zero, like D.'},
  {t:'Albuterol', correct:true, why:'A curve that rises but plateaus between 1% and 99% is a partial agonist, and albuterol is the partial agonist on the drug list.'},
  {t:'Metoprolol', correct:false, why:'Metoprolol has no efficacy; alone it gives a flat line at the baseline, like D.'},
  {t:'Epinephrine', correct:false, why:'Epinephrine is a full agonist and would reach 100%.'}],
 teach:'Classify first, then match. Curve B produces a positive effect but plateaus at 60%, which makes it a partial agonist (any maximum from 1% to 99%). On the drug list the partial agonist is albuterol, which opens the airways just enough for an asthma patient without opening them 100%. Full agonists reach 100%; drugs with no positive efficacy stay flat at a 0% baseline.',
 quote:'If your patient has asthma, albuterol, which is a partial agonist, is going to open up your airways just enough for you to breathe better in and out. You don’t have to open your lungs 100%.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~3, ~24; transcript 9/28',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Partial Agonists', t:'Partial agonists produce a lower response at full receptor occupancy than full agonists do.'}]},

{id:'L04-041', fg:'irreversible', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'irrev', skill:'figure',
 concept:'irreversible-antagonist-curve', tags:['poll'], source:'both',
 stem:'The dotted line represents the DRC of the agonist alone and the solid lines represent the DRC of the agonist in the presence of increasing doses of drug "X." Drug X is most likely:',
 graph:{curves:[{label:'alone', ec:-1.5, emax:100, dashed:true}, {label:'X', ec:-0.5, emax:100}, {label:'10X', ec:0.4, emax:65}, {label:'100X', ec:1, emax:25}], base:0, x:'log dose agonist', y:'% of maximal response'},
 options:[
  {t:'A full agonist', correct:false, why:'A full agonist would help and move the curve to the left.'},
  {t:'A partial agonist', correct:false, why:'A partial agonist has efficacy and would raise the baseline; here the baseline never moves.'},
  {t:'A competitive (reversible) antagonist', correct:false, why:'A competitive antagonist shifts right but is reversible, so the Emax would be unchanged; here the maximum keeps falling.'},
  {t:'An irreversible antagonist', correct:true, why:'Shift to the right, no change to the baseline and an Emax that falls with each dose: fewer receptors remain, so the agonist cannot outcompete it.'},
  {t:'An allosteric agonist', correct:false, why:'An allosteric agonist would help the agonist and shift it to the left.'}],
 teach:'Process of elimination. Helpers (full agonist, allosteric agonist) move the curve left, so they are out. A partial agonist would change the baseline. That leaves the two antagonists that shift right; only one lowers the Emax. Anything that lowers the Emax has to be an irreversible antagonist or an allosteric antagonist affecting efficacy, and only the irreversible one can abolish the response completely.',
 quote:'What could this be, uh, irreversible? It’s not changing, right? The Emacs is staying the same, so the best answer here is what? ... If you see something that it lowers the Emacs, you know that has to be either an irreversible antagonist or an allosteric antagonist that affects efficacy.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~53–~55; transcript 9/28',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Competitive & Irreversible Antagonists', t:'An irreversible antagonist reduces the maximal effect the agonist can achieve, and high agonist concentrations cannot overcome it.'}]},

{id:'L04-042', fg:'irreversible', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'irrev', skill:'figure',
 concept:'drug-x-phenoxybenzamine', tags:['poll','phenoxybenzamine'], source:'both',
 stem:'The dotted line represents the DRC of norepinephrine alone and the solid lines represent the DRC of norepinephrine in the presence of increasing doses of drug "X." Drug X is most likely:',
 graph:{curves:[{label:'NE', ec:-1.5, emax:100, dashed:true}, {label:'X', ec:-0.5, emax:100}, {label:'10X', ec:0.4, emax:65}, {label:'100X', ec:1, emax:25}], base:0, x:'log dose norepinephrine', y:'% of maximal response'},
 options:[
  {t:'Epinephrine (adrenaline)', correct:false, why:'Epinephrine is a full agonist and would shift norepinephrine to the left.'},
  {t:'Albuterol', correct:false, why:'Albuterol is the partial agonist; it has efficacy and would change the baseline.'},
  {t:'Phenoxybenzamine', correct:true, why:'The figure shows an irreversible antagonist (shift right, falling Emax), and phenoxybenzamine is the only irreversible antagonist on the drug list.'},
  {t:'Metoprolol', correct:false, why:'Metoprolol is a competitive, reversible antagonist: it would shift the curve right without lowering the Emax.'},
  {t:'Diazepam', correct:false, why:'Diazepam is the allosteric agonist on the list and would help norepinephrine, shifting it left.'}],
 teach:'Same figure, now with drug names. First read the class: right shift with a falling Emax is an irreversible antagonist. Then match the list: epinephrine is a full agonist, albuterol the partial agonist, metoprolol the competitive reversible surmountable antagonist, diazepam the allosteric agonist, and phenoxybenzamine the only irreversible antagonist on the list.',
 quote:'Fenoxbenzammine is the only irreversible that is on your list, and diazepam is your allosteric agonist.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~53–~55; transcript 9/28'},

{id:'L04-043', fg:'drc-basic', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'recap', skill:'figure',
 concept:'fa-plus-fa', tags:['poll'], source:'both',
 stem:'The dotted line represents the DRC of norepinephrine alone and the solid lines represent the DRC of norepinephrine in the presence of increasing doses of drug "X." Drug X is most likely:',
 graph:{curves:[{label:'NE', ec:0, emax:100, dashed:true}, {label:'X', ec:-0.7, emax:100, base:20}, {label:'10X', ec:-1.4, emax:100, base:45}, {label:'100X', ec:-2.1, emax:100, base:70}], base:0, x:'log dose norepinephrine', y:'% of maximal response'},
 options:[
  {t:'Epinephrine', correct:true, why:'Two full agonists at the same receptor help each other: each dose of epinephrine activates receptors on norepinephrine’s behalf, raising the baseline and shifting the curve left with the same Emax.'},
  {t:'Albuterol', correct:false, why:'Albuterol is a partial agonist; a partial agonist can only bring the response to its own efficacy, so the curves would not all finish at 100% from wherever they start.'},
  {t:'Phenoxybenzamine', correct:false, why:'Phenoxybenzamine is the irreversible antagonist; it would shift the curve right and lower the Emax.'},
  {t:'Metoprolol', correct:false, why:'Metoprolol competes for the receptor and would shift the curve to the right with no change to the baseline.'},
  {t:'Loratadine', correct:false, why:'Loratadine is the inverse agonist; it would shift the curve right and bring the baseline down, not up.'}],
 teach:'A drug that shifts the agonist to the left is a helper. Because drug X has positive efficacy of its own, each pretreatment dose also raises the starting point, and because both drugs are full agonists at the same receptor every curve still reaches 100%. On the drug list the full agonist is epinephrine: norepinephrine makes epinephrine more potent and epinephrine makes norepinephrine more potent.',
 quote:'now norepinephrine still goes to 100%, but it’s further to the left and the baseline has going up, right? Because levofed has efficacy, positive efficacy.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~3, ~55; Pharmacodynamics-Day_3_2026s.pdf slides ~42–~49; transcript 9/28'},

{id:'L04-044', fg:'inverse', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'ia', skill:'figure',
 concept:'fa-plus-inverse-agonist', tags:['poll','histamine','loratadine'], source:'both',
 stem:'The dotted line represents the DRC of histamine alone in a system in which half the receptors are active, and the solid lines represent the DRC of histamine in the presence of increasing doses of drug "X." Drug X is most likely:',
 graph:{curves:[{label:'H', ec:-0.5, emax:100, dashed:true}, {label:'X', ec:0.3, emax:100, base:25}, {label:'10X', ec:1, emax:100, base:8}, {label:'100X', ec:1.7, emax:100, base:1}], base:50, x:'log dose histamine', y:'% of maximal response'},
 options:[
  {t:'Epinephrine', correct:false, why:'Epinephrine is a full agonist; a helper would raise the baseline and shift the curve left.'},
  {t:'Albuterol', correct:false, why:'Albuterol is a partial agonist with positive efficacy; it cannot bring a baseline down toward 0%.'},
  {t:'Loratadine', correct:true, why:'Baseline falling toward 0%, shift to the right and no change to the Emax: an inverse agonist that histamine can still outcompete. Loratadine is the inverse agonist on the list.'},
  {t:'Metoprolol', correct:false, why:'A competitive antagonist would shift the curve right but has no efficacy, so the baseline would not move.'},
  {t:'Phenoxybenzamine', correct:false, why:'The irreversible antagonist leaves the baseline alone and lowers the Emax; here the Emax is unchanged.'}],
 teach:'Read the three changes: baseline down (negative efficacy shuts off receptors that were active on their own), shift to the right (histamine must outcompete the drug, so it appears less potent) and no change to the Emax (the drug is reversible). Only an inverse agonist lowers the baseline, and the one inverse agonist to know is loratadine, an antihistamine.',
 quote:'So, take home message over here, it’s gonna bring the baseline down to 0, and it’s gonna shift to the right with no change to the Emax, right?',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~13–~24, ~55; transcript 9/28',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Competitive & Irreversible Antagonists', t:'Some antagonists show inverse agonist activity: they reduce receptor activity below the basal level observed in the absence of any agonist.'}]},

{id:'L04-045', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'allo', skill:'figure',
 concept:'allosteric-characteristics', tags:['poll'], source:'both',
 stem:'The dotted line represents the DRC of the agonist alone and the solid lines represent the DRC of the agonist in the presence of increasing doses of drug "X" (1×, 10× and 100×). Drug X is most likely:',
 graph:{curves:[{label:'alone', ec:0.6, emax:100, dashed:true}, {label:'1×', ec:-0.3, emax:100}, {label:'10×', ec:-1.1, emax:100}, {label:'100×', ec:-1.7, emax:100}], base:0, x:'log dose agonist', y:'% of maximal response'},
 options:[
  {t:'A full agonist', correct:false, why:'A second full agonist also shifts left, but it has efficacy of its own, so each pretreatment dose would raise the baseline; here the baseline never moves.'},
  {t:'A partial agonist', correct:false, why:'A partial agonist has efficacy and would change the baseline.'},
  {t:'A competitive antagonist', correct:false, why:'A competitive antagonist makes the agonist less potent: shift to the right, in equal (symmetrical) steps.'},
  {t:'An allosteric agonist', correct:true, why:'Shift to the left with the same Emax, shifts of unequal size that stop growing at high doses (saturable) and no change to the baseline: the drug binds someplace else and only raises the agonist’s affinity.'},
  {t:'An inverse agonist', correct:false, why:'An inverse agonist makes the agonist’s life harder: shift to the right and, with active receptors present, a lower baseline.'}],
 teach:'The curve moved left, so drug X helps. Then look at the shifts: they are asymmetrical (unequal sizes) and saturable (the 100× dose barely moves the curve beyond the 10× dose), which is how an allosteric drug is recognized on a figure; an orthosteric competitor keeps shifting in equal steps. Emax is unchanged because a full agonist is already at 100%, so only affinity can be seen.',
 quote:'I can keep giving more and more of my allosteric, and he can’t go more to the left. He has maxed out all that he can do to the system.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~30–~34, ~55; transcript 9/28',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Competitive & Irreversible Antagonists', t:'Allosteric modulators bind a site on the receptor separate from the orthosteric site bound by the agonist, so they modify receptor activity without blocking agonist binding.'}]},

{id:'L04-046', fg:'two-state', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'recap', skill:'recall',
 concept:'full-vs-partial-agonist-summary', tags:['poll'], source:'transcript',
 stem:'Which of the following is CORRECT about a full agonist?',
 options:[
  {t:'Its Emax is 100% of the system’s response', correct:false, why:'True, but not the only true statement; a full agonist gets all the way up to the maximal response.'},
  {t:'It has the highest affinity for receptors in the active state', correct:false, why:'True, but not the only true statement; full agonists love receptors that are active.'},
  {t:'If it binds a receptor that is inactive, it can activate it', correct:false, why:'True, but not the only true statement; that is its positive efficacy.'},
  {t:'It shifts the DRC of another full agonist to the left', correct:false, why:'True, but not the only true statement; two full agonists help each other.'},
  {t:'All of the above', correct:true, why:'Every statement is correct: Emax of 100%, highest affinity for active receptors, positive efficacy on inactive receptors, and a left shift of another full agonist’s curve.'}],
 teach:'Four facts that all hold for a full agonist: its Emax is 100% (it gets all the way up to the response); it has the highest affinity for receptors in the active state; if it binds a receptor that is inactive, it can activate it (positive efficacy); and it shifts the dose–response curve of another full agonist to the left because the two help each other. When every statement is right, the answer is all of the above.',
 quote:'I have all the above. Is that the correct answer? Yes, right. It’s Emacs is 100%. It gets all the way up to the response. It has the highest affinity for receptors on the active state. However, if you bind into receptors that are inactive, it can activate them, right? And a full agonist will shift the dose response curve on another full agonist to the left because they’re gonna be helping each other.',
 cite:'Pharmacodynamics-Day_3_2026s.pdf slides ~33–~49 (lectured 9/28); transcript 9/28',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Receptor-Effector Coupling & Spare Receptors', t:'Full agonists shift the conformational equilibrium of receptors more strongly than partial agonists do.'}]},

{id:'L04-047', fg:'competitive', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'comp', skill:'recall',
 concept:'competitive-antagonist-shift', tags:['poll'], source:'both',
 stem:'Which statement is INCORRECT about a competitive antagonist?',
 options:[
  {t:'It has equal affinity for receptors in the active and inactive states', correct:false, why:'This is correct: the competitive antagonist is neutral (R = affinity = R*).'},
  {t:'It has affinity but no pharmacological efficacy', correct:false, why:'This is correct: it binds but does not evoke a change in the receptor.'},
  {t:'It shifts a full agonist’s DRC to the right in symmetrical steps', correct:false, why:'This is correct: a tenfold increase in antagonist needs a tenfold increase in agonist.'},
  {t:'It lowers the Emax of a full agonist', correct:true, why:'This is the incorrect statement: a competitive antagonist is reversible, so enough agonist outcompetes it and the Emax is unchanged. Only an irreversible antagonist or an allosteric antagonist affecting efficacy lowers the Emax.'}],
 teach:'The competitive antagonist is neutral in the two-state model (equal affinity for both states, affinity but no efficacy) and reversible. In the presence of a full agonist it shifts the curve to the right in symmetrical steps with no change to the baseline and no change to the Emax, because the agonist can always outcompete it. A lower Emax points to an irreversible antagonist or an allosteric antagonist affecting efficacy.',
 quote:'Everybody else is competitive. Everybody else is reversible, no change to the Emacs.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~43–~50; transcript 9/28',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Competitive & Irreversible Antagonists', t:'Sufficiently high concentrations of agonist can surmount the effect of a given concentration of a competitive antagonist, whereas agonists cannot surmount a noncompetitive antagonist irrespective of their concentration.'}]},

{id:'L04-048', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'allo', skill:'recall',
 concept:'noncompetitive-two-reasons', tags:['poll'], source:'both',
 stem:'An allosteric antagonist binds irreversibly to the receptor. True / False',
 options:[
  {t:'True', correct:false, why:'The allosteric antagonist binds reversibly, at another site in the receptor; it is called non-competitive because it binds someplace else, not because it never comes off.'},
  {t:'False', correct:true, why:'An allosteric antagonist binds reversibly to the receptor at another site. Only the irreversible antagonist forms covalent bonds; all allosterics are reversible.'}],
 teach:'Two different reasons give the same non-competitive label. The irreversible antagonist forms covalent bonds in the orthosteric pocket and never comes off. The allosteric antagonist binds reversibly at another site in the receptor, so the agonist cannot overcome it by competition, the shifts are asymmetrical, and there is no irreversible binding: every allosteric drug is reversible.',
 quote:'For a purpose in this class, all allosterics are reversible. There is no that forms irreversible binding.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~36, ~38–~41; transcript 9/28',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Competitive & Irreversible Antagonists', t:'Once a receptor is bound by a noncompetitive antagonist, agonists cannot surmount the inhibition; some noncompetitive antagonists bind irreversibly, others bind reversibly at a separate allosteric site.'}]},

{id:'L04-049', fg:'spare', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'irrev', skill:'apply',
 concept:'spare-receptors-irreversible', tags:['poll'], source:'transcript',
 stem:'An agonist has to occupy 10% of a tissue’s receptors to produce its maximal response. A dose of an irreversible antagonist that blocks 75% of the receptors is given. What effect would that have on the Emax of the agonist?',
 options:[
  {t:'Would lower it', correct:false, why:'Emax only falls once fewer receptors remain than the agonist needs; 25% are still available and the agonist needs 10%.'},
  {t:'Would increase it', correct:false, why:'An irreversible antagonist has no efficacy and removes receptors; it can never raise the maximal response.'},
  {t:'No effect', correct:true, why:'25% of the receptors remain, more than the 10% required, so the maximal response is still reached; only a higher agonist dose is needed (shift to the right).'}],
 teach:'Agonists do not have to occupy 100% of the receptors to produce a response; the rest are spare receptors. If the agonist needs 10% and the irreversible antagonist leaves 25% available, the maximum is still reached with more agonist (the curve only shifts right). Once fewer than 10% remain the Emax falls, all the way to zero if every receptor is blocked.',
 quote:'if I give a dose of the irreversible that blocks 75% of the receptors, but I still have 25 available, can I still make the max response? Yes, because I want to require what? 10.',
 cite:'transcript 9/28; Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~54, ~56',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Receptor-Effector Coupling & Spare Receptors', t:'With spare receptors, a lower dose of irreversible antagonist can leave enough receptors for the maximal response, though a higher agonist concentration is required.'}]},

{id:'L04-050', fg:'efficacy', lecture:'L04', prof:'Gottlieb', tier:'new', topic:'L04', sub:'allo', skill:'figure',
 concept:'allosteric-antagonist-effects', tags:['poll'], source:'both',
 stem:'If DRC D is the DRC of an agonist alone, which curve would best represent agonist D in the presence of an allosteric antagonist that affects only the affinity of D?',
 graph:{curves:[{label:'A', ec:-1, emax:100}, {label:'B', ec:1.1, emax:55}, {label:'C', ec:1.2, emax:100}, {label:'D', ec:0, emax:100}, {label:'E', ec:0, emax:55}], base:0, x:'log dose', y:'% of maximal response'},
 options:[
  {t:'A', correct:false, why:'A moved to the left, which means the agonist was helped; an antagonist makes its life more difficult.'},
  {t:'B', correct:false, why:'B moved right and lost its maximum, so both affinity and efficacy were affected; the stem says affinity only.'},
  {t:'C', correct:true, why:'Affinity only: the agonist appears less potent (shift to the right) but can still reach the maximal response at higher doses.'},
  {t:'D', correct:false, why:'D is the point of reference; an allosteric antagonist changes the curve.'},
  {t:'E', correct:false, why:'E did not move but lost its maximum, which is an allosteric antagonist affecting efficacy only.'}],
 teach:'Whatever the allosteric agonist does, the allosteric antagonist does the opposite. Affinity only: shift to the right, Emax still reached at higher doses. Efficacy only: no shift, the maximum falls (a full agonist behaves like a partial agonist). Both: right and down. Since the stem says affinity only, any curve whose maximum changed is out, and a curve to the left was helped.',
 quote:'what would happen to the dose response curve of this agonist in the presence of an allosteric antagonist that only affects affinity? What would you predict to do? It’s gonna shift to the right. Without affecting the ability to get the max response.',
 cite:'Pharmacodynamics-Day_4_-_5_2026s_pptx.pdf slides ~38–~42; transcript 9/28',
 reading:[{src:'Katzung 16e, Ch. 2', sec:'Competitive & Irreversible Antagonists', t:'Negative allosteric modulators bind an allosteric site to reduce receptor activity; positive allosteric modulators bind an allosteric site to increase it.'}]}
);

{"id": "DL1-003", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "chol", "concept": "moa-acetylcholine", "tags": ["drug-list"], "stem": "Acetylcholine is an agonist at which receptors?", "options": [{"t": "M1, M2, M3, Nn and Nm", "correct": true, "why": "Acetylcholine activates both receptor families: muscarinic (M1, M2, M3) and nicotinic (Nn, Nm)."}, {"t": "M1, M2 and M3 only", "correct": false, "why": "Leaves out the nicotinic receptors; M1, M2 and M3 alone are the receptors tropicamide blocks."}, {"t": "Nn only", "correct": false, "why": "Nn alone is where varenicline is a partial agonist; acetylcholine acts at all five listed receptors."}, {"t": "Nn and Nm only", "correct": false, "why": "Leaves out the muscarinic receptors M1, M2 and M3."}, {"t": "M1, M2, M3, Nn, Nm, H1 and H2", "correct": false, "why": "H1 and H2 are histamine receptors, listed for histamine, not acetylcholine."}], "teach": "Acetylcholine activates both cholinergic receptor families: muscarinic (M1, M2, M3) and nicotinic (Nn, Nm). Tropicamide blocks the muscarinic ones; varenicline partially activates Nn.", "reading": [{"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "Muscarinic M1 and M3 signal through IP3, DAG and calcium and M2 opens potassium channels; nicotinic Nn and Nm are ligand-gated channels that open sodium and potassium channels and depolarize the cell."}]},
{"id": "DL1-004", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "chol", "concept": "moa-tropicamide", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of tropicamide?", "options": [{"t": "Muscarinic (M1, M2, M3) antagonist, reversible", "correct": true, "why": "Tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Muscarinic (M1, M2, M3) and nicotinic (Nn, Nm) agonist", "correct": false, "why": "That is acetylcholine; tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Nicotinic (Nn) partial agonist", "correct": false, "why": "That is varenicline; tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Non-selective histamine receptor antagonist", "correct": false, "why": "That is diphenhydramine; tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}], "teach": "Tropicamide binds M1, M2 and M3 without activating them and blocks acetylcholine there; the block is reversible.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "M1 and M3 receptors signal through IP3, DAG and calcium; M2 receptors open potassium channels and inhibit adenylyl cyclase (myocardium)."}]},
{"id": "DL1-005", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-prazosin", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of prazosin?", "options": [{"t": "α1 antagonist, reversible", "correct": true, "why": "Prazosin is listed as α1 antagonist, reversible."}, {"t": "α1 agonist", "correct": false, "why": "That is phenylephrine; prazosin is listed as α1 antagonist, reversible."}, {"t": "α1 and α2 antagonist, irreversible", "correct": false, "why": "That is phenoxybenzamine; prazosin is listed as α1 antagonist, reversible."}, {"t": "β1 antagonist, reversible", "correct": false, "why": "That is metoprolol; prazosin is listed as α1 antagonist, reversible."}], "teach": "Prazosin binds α1 without activating it and blocks agonists there reversibly. Phenoxybenzamine also blocks α1, but irreversibly and at α2 too.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "α1 receptors sit on effector cells, especially smooth muscle; ligand binding forms IP3 and DAG and raises intracellular calcium, which contracts the muscle."}]},
{"id": "DL1-006", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-phenylephrine", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of phenylephrine?", "options": [{"t": "α1 agonist", "correct": true, "why": "Phenylephrine is listed as α1 agonist."}, {"t": "α1 antagonist, reversible", "correct": false, "why": "That is prazosin; phenylephrine is listed as α1 agonist."}, {"t": "α1, α2, β1 and β2 agonist", "correct": false, "why": "That is norepinephrine and epinephrine; phenylephrine is listed as α1 agonist."}, {"t": "β2 partial agonist", "correct": false, "why": "That is albuterol; phenylephrine is listed as α1 agonist."}], "teach": "Phenylephrine binds α1 and activates it; it does not act at α2 or β receptors. Prazosin binds the same receptor and blocks it.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Receptors mediate the actions of agonists and antagonists", "t": "An agonist binds the receptor and activates it, so the receptor signals as a direct result of the binding."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "α1 receptors sit on effector cells, especially smooth muscle; ligand binding forms IP3 and DAG and raises intracellular calcium, which contracts the muscle."}]},
{"id": "DL1-007", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-phenoxybenzamine", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of phenoxybenzamine?", "options": [{"t": "α1 and α2 antagonist, irreversible", "correct": true, "why": "Phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}, {"t": "α1 antagonist, reversible", "correct": false, "why": "That is prazosin; phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}, {"t": "β1 and β2 partial agonist", "correct": false, "why": "That is pindolol; phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}, {"t": "Muscarinic (M1, M2, M3) antagonist, reversible", "correct": false, "why": "That is tropicamide; phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}], "teach": "Phenoxybenzamine binds α1 and α2 irreversibly, so the block cannot be overcome by more agonist. It is the only irreversible drug on the list; every other drug is reversible and competitive.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "An irreversible antagonist binds the receptor irreversibly (sometimes covalently), so no agonist concentration can surmount the block and the maximal agonist effect falls; the block lasts until new receptors are made."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "α1 binding forms IP3 and DAG and raises calcium, contracting smooth muscle; α2 binding inhibits adenylyl cyclase and lowers cAMP."}]},
{"id": "DL1-008", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-metoprolol", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of metoprolol?", "options": [{"t": "β1 antagonist, reversible", "correct": true, "why": "Metoprolol is listed as β1 antagonist, reversible."}, {"t": "β1 and β2 partial agonist", "correct": false, "why": "That is pindolol; metoprolol is listed as β1 antagonist, reversible."}, {"t": "α1 antagonist, reversible", "correct": false, "why": "That is prazosin; metoprolol is listed as β1 antagonist, reversible."}, {"t": "α1 and α2 antagonist, irreversible", "correct": false, "why": "That is phenoxybenzamine; metoprolol is listed as β1 antagonist, reversible."}], "teach": "Metoprolol binds β1 without activating it and blocks agonists there reversibly. Pindolol acts at β1 too, but as a partial agonist and at β2 as well.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "β1 receptors sit especially on the heart; ligand binding stimulates adenylyl cyclase and raises cAMP, which speeds the sinoatrial node and increases contractility."}]},
{"id": "DL1-009", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "gaba", "concept": "moa-diazepam", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of diazepam?", "options": [{"t": "GABA receptor allosteric agonist", "correct": true, "why": "Diazepam is listed as GABA receptor allosteric agonist."}, {"t": "Histamine H1 inverse agonist", "correct": false, "why": "That is loratadine; diazepam is listed as GABA receptor allosteric agonist."}, {"t": "Nicotinic (Nn) partial agonist", "correct": false, "why": "That is varenicline; diazepam is listed as GABA receptor allosteric agonist."}, {"t": "Non-selective histamine receptor antagonist", "correct": false, "why": "That is diphenhydramine; diazepam is listed as GABA receptor allosteric agonist."}], "teach": "Diazepam does not bind where GABA binds. It binds a second site on the same GABA receptor, and while it sits there the receptor responds more strongly to GABA. Alone it does little; with GABA present it makes GABA work better.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists — allosteric modulators", "t": "Diazepam binds the GABA receptor at a second site, not where GABA binds. On its own it does little; when GABA is also bound, it makes GABA open the channel more."}, {"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists — allosteric modulators", "t": "The GABA receptor is an ion channel that the neurotransmitter GABA opens."}], "note": "Two names for one mechanism. The Exam 1 drug list calls diazepam a GABA receptor allosteric agonist. Katzung Ch. 2 calls it a positive allosteric modulator: it binds a second site on the receptor, does little by itself, and makes the receptor respond more strongly to GABA. On the exam, use the drug list’s name."},
{"id": "DL1-010", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-albuterol", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of albuterol?", "options": [{"t": "β2 partial agonist", "correct": true, "why": "Albuterol is listed as β2 partial agonist."}, {"t": "β1 and β2 partial agonist", "correct": false, "why": "That is pindolol; albuterol is listed as β2 partial agonist."}, {"t": "β1 antagonist, reversible", "correct": false, "why": "That is metoprolol; albuterol is listed as β2 partial agonist."}, {"t": "α1, α2, β1 and β2 agonist", "correct": false, "why": "That is norepinephrine and epinephrine; albuterol is listed as β2 partial agonist."}], "teach": "Albuterol activates β2 but reaches a lower maximal response than a full agonist would. It does not act at β1; pindolol is the partial agonist that does.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Partial Agonists", "t": "A partial agonist activates the receptor but produces a lower maximal response at full receptor occupancy than a full agonist does, and it competes with a full agonist for the same sites."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "β2 receptors sit especially on smooth muscle; ligand binding stimulates adenylyl cyclase and raises cAMP, which relaxes bronchiolar smooth muscle."}]},

{"id": "DL1-015", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "hist", "concept": "moa-diphenhydramine", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of diphenhydramine?", "options": [{"t": "Non-selective histamine receptor antagonist", "correct": true, "why": "Diphenhydramine is listed as non-selective histamine receptor antagonist."}, {"t": "Histamine H1 inverse agonist", "correct": false, "why": "That is loratadine; diphenhydramine is listed as non-selective histamine receptor antagonist."}, {"t": "Histamine H1 and H2 agonist", "correct": false, "why": "That is histamine; diphenhydramine is listed as non-selective histamine receptor antagonist."}, {"t": "Muscarinic (M1, M2, M3) antagonist, reversible", "correct": false, "why": "That is tropicamide; diphenhydramine is listed as non-selective histamine receptor antagonist."}], "teach": "Diphenhydramine binds histamine receptors without activating them and without selecting one subtype. Loratadine is selective for H1 and is an inverse agonist.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 2", "sec": "Receptor Classes & Drug Development", "t": "Histamine activates more than one receptor subtype, and each subtype can couple to a different G protein, which is what lets a drug be selective for one subtype."}]},
{"id": "DL1-016", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "irreversible-drug", "tags": ["drug-list"], "stem": "Phenoxybenzamine differs from every other drug on the Exam 1 list in which way?", "options": [{"t": "It binds its receptors irreversibly", "correct": true, "why": "The list states all its drugs are reversible and competitive at their receptors, with one exception: phenoxybenzamine, which is irreversible."}, {"t": "It is a partial agonist at β receptors", "correct": false, "why": "That describes pindolol (β1 and β2) and albuterol (β2)."}, {"t": "It is selective for the α1 receptor", "correct": false, "why": "Phenoxybenzamine blocks α1 and α2. The α1-selective drugs on the list are prazosin (antagonist) and phenylephrine (agonist)."}, {"t": "It acts at an allosteric site on its receptor", "correct": false, "why": "The list gives an allosteric mechanism only for diazepam at the GABA receptor."}], "teach": "Phenoxybenzamine binds α1 and α2 irreversibly, so the block cannot be overcome by more agonist. It is the only irreversible drug on the list; every other drug is reversible and competitive.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "An irreversible antagonist binds the receptor irreversibly (sometimes covalently), so no agonist concentration can surmount the block and the maximal agonist effect falls; the block lasts until new receptors are made."}]},
{"id": "DL1-017", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "hist", "concept": "moa-loratadine", "tags": ["drug-list"], "stem": "Which drug is a histamine H1 receptor inverse agonist?", "options": [{"t": "Loratadine", "correct": true, "why": "Loratadine is listed as histamine H1 inverse agonist."}, {"t": "Diphenhydramine", "correct": false, "why": "Diphenhydramine is listed as non-selective histamine receptor antagonist."}, {"t": "Histamine", "correct": false, "why": "Histamine is listed as histamine H1 and H2 agonist."}, {"t": "Tropicamide", "correct": false, "why": "Tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Diazepam", "correct": false, "why": "Diazepam is listed as GABA receptor allosteric agonist."}], "teach": "Loratadine binds H1 and lowers its activity below baseline (inverse agonist). Diphenhydramine blocks histamine receptors without selectivity.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "An inverse agonist binds the receptor and lowers its activity below the basal level seen with no agonist present, rather than merely blocking the agonist."}, {"src": "Katzung 16e, Ch. 2", "sec": "Receptor Classes & Drug Development", "t": "Histamine activates more than one receptor subtype, and each subtype can couple to a different G protein, which is what lets a drug be selective for one subtype."}]},
{"id": "DL1-018", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "chol", "concept": "moa-varenicline", "tags": ["drug-list"], "stem": "Which drug is a partial agonist at the neuronal nicotinic (Nn) receptor?", "options": [{"t": "Varenicline", "correct": true, "why": "Varenicline is listed as nicotinic (Nn) partial agonist."}, {"t": "Acetylcholine", "correct": false, "why": "Acetylcholine is listed as muscarinic (M1, M2, M3) and nicotinic (Nn, Nm) agonist."}, {"t": "Tropicamide", "correct": false, "why": "Tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Albuterol", "correct": false, "why": "Albuterol is listed as β2 partial agonist."}, {"t": "Pindolol", "correct": false, "why": "Pindolol is listed as β1 and β2 partial agonist."}], "teach": "Varenicline activates the neuronal nicotinic receptor Nn, but only to a submaximal response. Acetylcholine is the full agonist at Nn and at the other cholinergic receptors.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Partial Agonists", "t": "A partial agonist activates the receptor but produces a lower maximal response at full receptor occupancy than a full agonist does, and it competes with a full agonist for the same sites."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "The Nn receptor on postganglionic neurons is a ligand-gated channel: binding opens sodium and potassium channels and depolarizes the neuron."}]},
{"id": "DL1-019", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-phenylephrine", "tags": ["drug-list"], "stem": "Which drug is a selective α1 agonist?", "options": [{"t": "Phenylephrine", "correct": true, "why": "Phenylephrine is listed as α1 agonist."}, {"t": "Prazosin", "correct": false, "why": "Prazosin is listed as α1 antagonist, reversible."}, {"t": "Norepinephrine", "correct": false, "why": "Norepinephrine is listed as α1, α2, β1 and β2 agonist."}, {"t": "Phenoxybenzamine", "correct": false, "why": "Phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}, {"t": "Albuterol", "correct": false, "why": "Albuterol is listed as β2 partial agonist."}], "teach": "Phenylephrine binds α1 and activates it; it does not act at α2 or β receptors. Prazosin binds the same receptor and blocks it.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Receptors mediate the actions of agonists and antagonists", "t": "An agonist binds the receptor and activates it, so the receptor signals as a direct result of the binding."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "α1 receptors sit on effector cells, especially smooth muscle; ligand binding forms IP3 and DAG and raises intracellular calcium, which contracts the muscle."}]},
{"id": "DL1-020", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "gaba", "concept": "moa-diazepam", "tags": ["drug-list"], "stem": "Which drug acts as an allosteric agonist at the GABA receptor?", "options": [{"t": "Diazepam", "correct": true, "why": "Diazepam is listed as GABA receptor allosteric agonist."}, {"t": "Loratadine", "correct": false, "why": "Loratadine is listed as histamine H1 inverse agonist."}, {"t": "Varenicline", "correct": false, "why": "Varenicline is listed as nicotinic (Nn) partial agonist."}, {"t": "Tropicamide", "correct": false, "why": "Tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Metoprolol", "correct": false, "why": "Metoprolol is listed as β1 antagonist, reversible."}], "teach": "Diazepam does not bind where GABA binds. It binds a second site on the same GABA receptor, and while it sits there the receptor responds more strongly to GABA. Alone it does little; with GABA present it makes GABA work better.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists — allosteric modulators", "t": "Diazepam binds the GABA receptor at a second site, not where GABA binds. On its own it does little; when GABA is also bound, it makes GABA open the channel more."}], "note": "Two names for one mechanism. The Exam 1 drug list calls diazepam a GABA receptor allosteric agonist. Katzung Ch. 2 calls it a positive allosteric modulator: it binds a second site on the receptor, does little by itself, and makes the receptor respond more strongly to GABA. On the exam, use the drug list’s name."},
{"id": "DL1-021", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-metoprolol", "tags": ["drug-list"], "stem": "Which drug is a reversible β1 antagonist?", "options": [{"t": "Metoprolol", "correct": true, "why": "Metoprolol is listed as β1 antagonist, reversible."}, {"t": "Pindolol", "correct": false, "why": "Pindolol is listed as β1 and β2 partial agonist."}, {"t": "Albuterol", "correct": false, "why": "Albuterol is listed as β2 partial agonist."}, {"t": "Prazosin", "correct": false, "why": "Prazosin is listed as α1 antagonist, reversible."}, {"t": "Phenoxybenzamine", "correct": false, "why": "Phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}], "teach": "Metoprolol binds β1 without activating it and blocks agonists there reversibly. Pindolol acts at β1 too, but as a partial agonist and at β2 as well.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "β1 receptors sit especially on the heart; ligand binding stimulates adenylyl cyclase and raises cAMP, which speeds the sinoatrial node and increases contractility."}]},
{"id": "DL1-022", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "chol", "concept": "moa-tropicamide", "tags": ["drug-list"], "stem": "Which drug is a reversible antagonist at muscarinic M1, M2 and M3 receptors?", "options": [{"t": "Tropicamide", "correct": true, "why": "Tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Acetylcholine", "correct": false, "why": "Acetylcholine is listed as muscarinic (M1, M2, M3) and nicotinic (Nn, Nm) agonist."}, {"t": "Varenicline", "correct": false, "why": "Varenicline is listed as nicotinic (Nn) partial agonist."}, {"t": "Diphenhydramine", "correct": false, "why": "Diphenhydramine is listed as non-selective histamine receptor antagonist."}, {"t": "Prazosin", "correct": false, "why": "Prazosin is listed as α1 antagonist, reversible."}], "teach": "Tropicamide binds M1, M2 and M3 without activating them and blocks acetylcholine there; the block is reversible.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "M1 and M3 receptors signal through IP3, DAG and calcium; M2 receptors open potassium channels and inhibit adenylyl cyclase (myocardium)."}]},
{"id": "DL1-023", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "gen", "concept": "partial-agonists", "tags": ["drug-list", "list"], "multi": true, "stem": "Which drugs on the Exam 1 list are partial agonists? Select all that apply.", "options": [{"t": "Albuterol", "correct": true, "why": "Albuterol is listed as β2 partial agonist."}, {"t": "Varenicline", "correct": true, "why": "Varenicline is listed as nicotinic (Nn) partial agonist."}, {"t": "Pindolol", "correct": true, "why": "Pindolol is listed as β1 and β2 partial agonist."}, {"t": "Metoprolol", "correct": false, "why": "Metoprolol is listed as β1 antagonist, reversible."}, {"t": "Loratadine", "correct": false, "why": "Loratadine is listed as histamine H1 inverse agonist."}, {"t": "Phenylephrine", "correct": false, "why": "Phenylephrine is listed as α1 agonist."}], "teach": "Three drugs on the list are partial agonists: albuterol (β2), varenicline (Nn) and pindolol (β1 and β2). Loratadine is an inverse agonist, metoprolol an antagonist, phenylephrine a full α1 agonist.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Partial Agonists", "t": "A partial agonist activates the receptor but produces a lower maximal response at full receptor occupancy than a full agonist does, and it competes with a full agonist for the same sites."}]},
{"id": "DL1-024", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "alpha1-drugs", "tags": ["drug-list", "list"], "multi": true, "stem": "Which drugs on the Exam 1 list act at the α1 receptor? Select all that apply.", "options": [{"t": "Norepinephrine", "correct": true, "why": "Norepinephrine is listed as α1, α2, β1 and β2 agonist."}, {"t": "Prazosin", "correct": true, "why": "Prazosin is listed as α1 antagonist, reversible."}, {"t": "Phenylephrine", "correct": true, "why": "Phenylephrine is listed as α1 agonist."}, {"t": "Phenoxybenzamine", "correct": true, "why": "Phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}, {"t": "Metoprolol", "correct": false, "why": "Metoprolol is listed as β1 antagonist, reversible."}, {"t": "Albuterol", "correct": false, "why": "Albuterol is listed as β2 partial agonist."}], "teach": "Five rows name α1: norepinephrine and epinephrine (agonists at α1, α2, β1, β2), phenylephrine (α1 agonist), prazosin (α1 antagonist) and phenoxybenzamine (α1 and α2 antagonist, irreversible). Metoprolol and albuterol act at β receptors only."},

QUESTIONS.push({"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-pharmacology", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~21–~22; transcript 9/22", "quote": "Pharmacology: “the study of the interaction of “Drugs” with biological systems” ... Which, What, & Where? How much? Smallest dose => Desired effect?", "id": "T-pharmacology-1", "stem": "Which term is defined as: The study of the interaction of drugs with biological systems: which drug, what it does and where, and how much (the smallest dose that gives the desired effect). It determines mechanisms of action, dose–response relationships, therapeutic dose, potency, minimal and maximal effect, and safety?", "options": [{"t": "Pharmacology", "correct": true, "why": "This is the definition of Pharmacology."}, {"t": "Pharmacodynamics (PD)", "correct": false, "why": "Pharmacodynamics (PD): The study of the biochemical and physiological effects of drugs and their mechanisms of action. General rules: the drug must reach the site of action, must bind to and interact with a receptor, and does not create anything but changes the ongoing physiological system."}, {"t": "Pharmacokinetics (PK)", "correct": false, "why": "Pharmacokinetics (PK): The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions)."}, {"t": "Withdrawal syndrome", "correct": false, "why": "Withdrawal syndrome: The opposite of what the drug produces, appearing when the drug is stopped: if nicotine relaxes, lowers appetite and raises blood pressure, withdrawal brings irritability, overeating and lower blood pressure. A partial agonist such as varenicline raises the inactive receptors enough to remove the cravings without full activation."}], "teach": "The study of the interaction of drugs with biological systems: which drug, what it does and where, and how much (the smallest dose that gives the desired effect). It determines mechanisms of action, dose–response relationships, therapeutic dose, potency, minimal and maximal effect, and safety. The pharmacology diagram splits it in two: pharmacokinetics (absorption, distribution, metabolism, excretion) and pharmacodynamics (drug–receptor signaling that gives the physiological response)."},

iological systems: which drug, what it does and where, and how much (the smallest dose that gives the desired effect). It determines mechanisms of action, dose–response relationships, therapeutic dose, potency, minimal and maximal effect, and safety. The pharmacology diagram splits it in two: pharmacokinetics (absorption, distribution, metabolism, excretion) and pharmacodynamics (drug–receptor signaling that gives the physiological response).", "dupOf": "T-pharmacology-1"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-pharmacodynamics", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~31; Pharmacodynamics-Day-1-2026s.pdf slide ~22; transcript 9/23", "quote": "General rules: 1) Drug must reach the site of action 2) Drug must bind to and interact with a receptor 3) Drug do not create anything, but change the ongoing phys. system", "id": "T-pharmacodynamics-1", "stem": "Which term is defined as: The study of the biochemical and physiological effects of drugs and their mechanisms of action. General rules: the drug must reach the site of action, must bind to and interact with a receptor, and does not create anything but changes the ongoing physiological system?", "options": [{"t": "Pharmacodynamics (PD)", "correct": true, "why": "This is the definition of Pharmacodynamics (PD)."}, {"t": "Mechanism of action (MOA)", "correct": false, "why": "Mechanism of action (MOA): What the drug does at its receptor: which receptor it binds and whether it activates, inhibits or just binds (e.g., metoprolol: reversible β1 receptor antagonist). The must-know for every drug on Exam 1."}, {"t": "Pharmacokinetics (PK)", "correct": false, "why": "Pharmacokinetics (PK): The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions)."}, {"t": "Pharmacology", "correct": false, "why": "Pharmacology: The study of the interaction of drugs with biological systems: which drug, what it does and where, and how much (the smallest dose that gives the desired effect). It determines mechanisms of action, dose–response relationships, therapeutic dose, potency, minimal and maximal effect, and safety."}], "teach": "The study of the biochemical and physiological effects of drugs and their mechanisms of action. General rules: the drug must reach the site of action, must bind to and interact with a receptor, and does not create anything but changes the ongoing physiological system. Spoken definition: “the study of how drugs interact with the biological system.” Its two basic concepts are affinity and efficacy."},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-pharmacodynamics", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~31; Pharmacodynamics-Day-1-2026s.pdf slide ~22; transcript 9/23", "quote": "General rules: 1) Drug must reach the site of action 2) Drug must bind to and interact with a receptor 3) Drug do not create anything, but change the ongoing phys. system", "id": "T-pharmacodynamics-2", "stem": "What does the term \"Pharmacodynamics (PD)\" mean?", "options": [{"t": "The study of the biochemical and physiological effects of drugs and their mechanisms of action. General rules: the drug must reach the site of action, must bind to and interact with a receptor, and does not create anything but changes the ongoing physiological system.", "correct": true, "why": "This is the definition of Pharmacodynamics (PD)."}, {"t": "The study of the interaction of drugs with biological systems: which drug, what it does and where, and how much (the smallest dose that gives the desired effect). It determines mechanisms of action, dose–response relationships, therapeutic dose, potency, minimal and maximal effect, and safety.", "correct": false, "why": "That defines pharmacology."}, {"t": "The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions).", "correct": false, "why": "That defines pharmacokinetics (pk)."}, {"t": "Where the receptor the drug acts on is located (metoprolol: heart, kidneys and brain; thiazides: distal convoluted tubule). Knowing MOA plus SOA lets you predict the effect, side effects and drug–drug interactions without memorizing them.", "correct": false, "why": "That defines site of action (soa)."}], "teach": "The study of the biochemical and physiological effects of drugs and their mechanisms of action. General rules: the drug must reach the site of action, must bind to and interact with a receptor, and does not create anything but changes the ongoing physiological system. Spoken definition: “the study of how drugs interact with the biological system.” Its two basic concepts are affinity and efficacy.", "dupOf": "T-pharmacodynamics-1"},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-pharmacokinetics", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~22–~23, ~27; transcript 9/22", "quote": "So pharmokinetics is going to be affecting how much of the drug gets to the site of action. Because that’s how it’s going to produce its effects.", "id": "T-pharmacokinetics-1", "stem": "Which term is defined as: The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions)?", "options": [{"t": "Pharmacokinetics (PK)", "correct": true, "why": "This is the definition of Pharmacokinetics (PK)."}, {"t": "Mechanism of action (MOA)", "correct": false, "why": "Mechanism of action (MOA): What the drug does at its receptor: which receptor it binds and whether it activates, inhibits or just binds (e.g., metoprolol: reversible β1 receptor antagonist). The must-know for every drug on Exam 1."}, {"t": "Pharmacodynamics (PD)", "correct": false, "why": "Pharmacodynamics (PD): The study of the biochemical and physiological effects of drugs and their mechanisms of action. General rules: the drug must reach the site of action, must bind to and interact with a receptor, and does not create anything but changes the ongoing physiological system."}, {"t": "Apparent potency", "correct": false, "why": "Apparent potency: The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency."}], "teach": "The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions). On the efficacy poll, “the ability of a drug to be absorbed at the level of the GI” is pharmacokinetics, not efficacy."},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-pharmacokinetics", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~22–~23, ~27; transcript 9/22", "quote": "So pharmokinetics is going to be affecting how much of the drug gets to the site of action. Because that’s how it’s going to produce its effects.", "id": "T-pharmacokinetics-2", "stem": "What does the term \"Pharmacokinetics (PK)\" mean?", "options": [{"t": "The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions).", "correct": true, "why": "This is the definition of Pharmacokinetics (PK)."}, {"t": "The study of the biochemical and physiological effects of drugs and their mechanisms of action. General rules: the drug must reach the site of action, must bind to and interact with a receptor, and does not create anything but changes the ongoing physiological system.", "correct": false, "why": "That defines pharmacodynamics (pd)."}, {"t": "The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency.", "correct": false, "why": "That defines apparent potency."}, {"t": "How narrowly a drug binds one receptor type rather than others: loratadine is a selective H1 inverse agonist; diphenhydramine binds H1, H2 and muscarinic receptors and is very non-selective. The less selective a drug is, the more effects and side effects it produces.", "correct": false, "why": "That defines selectivity."}], "teach": "The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions). On the efficacy poll, “the ability of a drug to be absorbed at the level of the GI” is pharmacokinetics, not efficacy.", "dupOf": "T-pharmacokinetics-1"},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-drug", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~29–~31; transcript 9/22", "quote": "drugs don’t create anything new, they just change whatever is happening in the body. Either they are going to enhance the signal or perhaps suppress the signal", "id": "T-drug-1", "stem": "Which term is defined as: A chemical substance that alters an ongoing physiological or pathological function by interacting with components of a biological system. Drugs initiate, inhibit or modulate a response; they do not create anything new?", "options": [{"t": "Drug", "correct": true, "why": "This is the definition of Drug."}, {"t": "Ligand", "correct": false, "why": "Ligand: A chemical that a receptor recognizes and binds by its shape, size and other properties: endogenous (a hormone or neurotransmitter) or exogenous (a drug, a supplement, something eaten or drunk). A ligand induces a conformational change in the receptor."}, {"t": "Natural dietary supplement (NDS)", "correct": false, "why": "Natural dietary supplement (NDS): A product regulated as food, not as a drug, so with less FDA oversight; it stays on the market until it causes harm. Its label cannot state that it treats, cures, diagnoses or prevents disease, and natural does not mean safe or free of drug interactions."}, {"t": "Selectivity", "correct": false, "why": "Selectivity: How narrowly a drug binds one receptor type rather than others: loratadine is a selective H1 inverse agonist; diphenhydramine binds H1, H2 and muscarinic receptors and is very non-selective. The less selective a drug is, the more effects and side effects it produces."}], "teach": "A chemical substance that alters an ongoing physiological or pathological function by interacting with components of a biological system. Drugs initiate, inhibit or modulate a response; they do not create anything new. Walter Straub: there is only a quantitative difference between a drug and a poison (vitamin A in carrots vs polar bear liver)."},

{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-receptor", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~11, ~34–~36; transcript 9/22", "quote": "Receptors are regulatory proteins involved in the transfer of chemical information carried by various endogenous/exogenous mediators", "id": "T-receptor-1", "stem": "Which term is defined as: Regulatory proteins involved in the transfer of chemical information carried by endogenous or exogenous mediators. Classified by the structure of the receptor protein and its transduction components: ion channels, 7-transmembrane (GPCR), 1-transmembrane (tyrosine kinases) and intracellular/nuclear receptors?", "options": [{"t": "Receptor", "correct": true, "why": "This is the definition of Receptor."}, {"t": "Effector (signal amplifier)", "correct": false, "why": "Effector (signal amplifier): An enzyme, ion channel or transport protein that creates, moves or degrades a small molecule or ions, e.g., adenylate cyclase (AC), phospholipase C (PLC). It amplifies the signal; frequently the proximal effector protein is not the ultimate physiological target."}, {"t": "Ligand", "correct": false, "why": "Ligand: A chemical that a receptor recognizes and binds by its shape, size and other properties: endogenous (a hormone or neurotransmitter) or exogenous (a drug, a supplement, something eaten or drunk). A ligand induces a conformational change in the receptor."}, {"t": "Transducer", "correct": false, "why": "Transducer: The component that translates, integrates and coordinates the signal from the activated receptor, e.g., the G protein."}], "teach": "Regulatory proteins involved in the transfer of chemical information carried by endogenous or exogenous mediators. Classified by the structure of the receptor protein and its transduction components: ion channels, 7-transmembrane (GPCR), 1-transmembrane (tyrosine kinases) and intracellular/nuclear receptors. His picture: the gatekeeper that senses hormones, neurotransmitters and drugs; the message the receptor creates is the physiological response. Receptors come in two flavors, active or inactive."},

ried by endogenous or exogenous mediators. Classified by the structure of the receptor protein and its transduction components: ion channels, 7-transmembrane (GPCR), 1-transmembrane (tyrosine kinases) and intracellular/nuclear receptors. His picture: the gatekeeper that senses hormones, neurotransmitters and drugs; the message the receptor creates is the physiological response. Receptors come in two flavors, active or inactive.", "dupOf": "T-receptor-1"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-ligand", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~26, ~30; transcript 9/23; transcript 9/24", "quote": "Cells have receptors that recognize specific chemicals ... Endogenous as well as exogenous", "id": "T-ligand-1", "stem": "Which term is defined as: A chemical that a receptor recognizes and binds by its shape, size and other properties: endogenous (a hormone or neurotransmitter) or exogenous (a drug, a supplement, something eaten or drunk). A ligand induces a conformational change in the receptor?", "options": [{"t": "Ligand", "correct": true, "why": "This is the definition of Ligand."}, {"t": "Receptor", "correct": false, "why": "Receptor: Regulatory proteins involved in the transfer of chemical information carried by endogenous or exogenous mediators. Classified by the structure of the receptor protein and its transduction components: ion channels, 7-transmembrane (GPCR), 1-transmembrane (tyrosine kinases) and intracellular/nuclear receptors."}, {"t": "Drug", "correct": false, "why": "Drug: A chemical substance that alters an ongoing physiological or pathological function by interacting with components of a biological system. Drugs initiate, inhibit or modulate a response; they do not create anything new."}, {"t": "Mechanism of action (MOA)", "correct": false, "why": "Mechanism of action (MOA): What the drug does at its receptor: which receptor it binds and whether it activates, inhibits or just binds (e.g., metoprolol: reversible β1 receptor antagonist). The must-know for every drug on Exam 1."}], "teach": "A chemical that a receptor recognizes and binds by its shape, size and other properties: endogenous (a hormone or neurotransmitter) or exogenous (a drug, a supplement, something eaten or drunk). A ligand induces a conformational change in the receptor. Multiple chemicals may bind the same receptor
