{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-occupancy-theory", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22", "quote": "a full agonist will produce 100% of the response as a partial may produce a 70% of the response because it can only occupy 70% of the receptors, right? So it’s based on occupancy.", "id": "T-occupancy-theory-1", "stem": "Which term is defined as: Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction?", "options": [{"t": "Receptor occupancy theory", "correct": true, "why": "This is the definition of Receptor occupancy theory."}, {"t": "Covalent (irreversible) bond", "correct": false, "why": "Covalent (irreversible) bond: Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive."}, {"t": "Intrinsic activity", "correct": false, "why": "Intrinsic activity: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0."}, {"t": "Two-state model", "correct": false, "why": "Two-state model: Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy."}], "teach": "Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction. It could not explain antagonists or inverse agonists. Ariëns added intrinsic activity; Stephenson, Furchgott and Nickerson added efficacy and the two-state model. The names are FYI, not tested."},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-occupancy-theory", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22", "quote": "a full agonist will produce 100% of the response as a partial may produce a 70% of the response because it can only occupy 70% of the receptors, right? So it’s based on occupancy.", "id": "T-occupancy-theory-2", "stem": "What does the term \"Receptor occupancy theory\" mean?", "options": [{"t": "Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction.", "correct": true, "why": "This is the definition of Receptor occupancy theory."}, {"t": "Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive.", "correct": false, "why": "That defines covalent (irreversible) bond."}, {"t": "Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0.", "correct": false, "why": "That defines intrinsic activity."}, {"t": "Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy.", "correct": false, "why": "That defines two-state model."}], "teach": "Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction. It could not explain antagonists or inverse agonists. Ariëns added intrinsic activity; Stephenson, Furchgott and Nickerson added efficacy and the two-state model. The names are FYI, not tested.", "dupOf": "T-occupancy-theory-1"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-two-state", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slide ~31; Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22; transcript 9/23", "quote": "So this two-state model shows that we have receptor two confirmations, active and inactive, and that drugs can shift them once bound to the receptor from one confirmation to the other.", "id": "T-two-state-1", "stem": "Which term is defined as: Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy?", "options": [{"t": "Two-state model", "correct": true, "why": "This is the definition of Two-state model."}, {"t": "Receptor occupancy theory", "correct": false, "why": "Receptor occupancy theory: Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction."}, {"t": "Intrinsic activity", "correct": false, "why": "Intrinsic activity: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0."}, {"t": "Orthosteric site", "correct": false, "why": "Orthosteric site: The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both."}], "teach": "Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy. “This is gonna be home for us.” It explains inverse agonists, which occupancy theory could not. Most receptors sit in the inactive state to save energy.", "fg": "two-state"},

L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy. “This is gonna be home for us.” It explains inverse agonists, which occupancy theory could not. Most receptors sit in the inactive state to save energy.", "dupOf": "T-two-state-1", "fg": "two-state"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-full-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~33–~41; Pharmacodynamics-Day_2_2026s copy.pdf slides ~32–~34; transcript 9/23; transcript 9/24", "quote": "Let’s think about that we can dim, so we have one that can kind of go full bright or just halfway bright, a full agonist or a partial.", "id": "T-full-agonist-1", "stem": "Which term is defined as: Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine?", "options": [{"t": "Full agonist", "correct": true, "why": "This is the definition of Full agonist."}, {"t": "Partial agonist", "correct": false, "why": "Partial agonist: Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2)."}, {"t": "Inverse agonist", "correct": false, "why": "Inverse agonist: Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1."}, {"t": "Antagonist (neutral, reversible)", "correct": false, "why": "Antagonist (neutral, reversible): A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1)."}], "teach": "Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine. Same affinity preference as a partial agonist; the difference is efficacy (100% vs 1–99%). “I do not know of any agonist that is irreversible.”", "fg": "classes"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-full-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~33–~41; Pharmacodynamics-Day_2_2026s copy.pdf slides ~32–~34; transcript 9/23; transcript 9/24", "quote": "Let’s think about that we can dim, so we have one that can kind of go full bright or just halfway bright, a full agonist or a partial.", "id": "T-full-agonist-2", "stem": "What does the term \"Full agonist\" mean?", "options": [{"t": "Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine.", "correct": true, "why": "This is the definition of Full agonist."}, {"t": "Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2).", "correct": false, "why": "That defines partial agonist."}, {"t": "Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1.", "correct": false, "why": "That defines inverse agonist."}, {"t": "A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1).", "correct": false, "why": "That defines antagonist (neutral, reversible)."}], "teach": "Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine. Same affinity preference as a partial agonist; the difference is efficacy (100% vs 1–99%). “I do not know of any agonist that is irreversible.”", "dupOf": "T-full-agonist-1", "fg": "classes"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-partial-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~50–~65; Pharmacodynamics-Day_2_2026s copy.pdf slides ~32–~34; transcript 9/23; transcript 9/24", "quote": "So sometimes we may use a partial agonist over a full agonist because we don’t need to get the max effect. We just need to get enough of it.", "id": "T-partial-agonist-1", "stem": "Which term is defined as: Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2)?", "options": [{"t": "Partial agonist", "correct": true, "why": "This is the definition of Partial agonist."}, {"t": "Antagonist (neutral, reversible)", "correct": false, "why": "Antagonist (neutral, reversible): A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1)."}, {"t": "Full agonist", "correct": false, "why": "Full agonist: Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine."}, {"t": "Inverse agonist", "correct": false, "why": "Inverse agonist: Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1."}], "teach": "Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2). Dual nature: it may act as an agonist or an antagonist depending on the physiological state (varenicline during smoking vs withdrawal). A partial agonist can still be the most potent drug on a graph.", "fg": "classes"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-partial-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~50–~65; Pharmacodynamics-Day_2_2026s copy.pdf slides ~32–~34; transcript 9/23; transcript 9/24", "quote": "So sometimes we may use a partial agonist over a full agonist because we don’t need to get the max effect. We just need to get enough of it.", "id": "T-partial-agonist-2", "stem": "What does the term \"Partial agonist\" mean?", "options": [{"t": "Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2).", "correct": true, "why": "This is the definition of Partial agonist."}, {"t": "The three α subunit types to know. Gαs (stimulation) activates adenylate cyclase and increases cAMP (β1 in the heart, ↑HR). Gαi (inhibition) inhibits adenylate cyclase and decreases cAMP (M2 in the heart, ↓HR; α2 in the CNS). Gαq activates phospholipase C, which converts PIP2 to IP3 and releases Ca++ from the ER (α1 in smooth muscle).", "correct": false, "why": "That defines gαs, gαi and gαq."}, {"t": "Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine.", "correct": false, "why": "That defines full agonist."}, {"t": "A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1).", "correct": false, "why": "That defines antagonist (neutral, reversible)."}], "teach": "Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2). Dual nature: it may act as an agonist or an antagonist depending on the physiological state (varenicline during smoking vs withdrawal). A partial agonist can still be the most potent drug on a graph.", "dupOf": "T-partial-agonist-1", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-inverse-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~35–~36; Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22; transcript 9/23", "quote": "These drugs love to bind to receptors that are inactive and keep them inactive. But they have what is called negative efficacy, which means is if they bind to a receptor that is already active, producing a signal, once they are bound, they’re going to shut them off.", "id": "T-inverse-agonist-1", "stem": "Which term is defined as: Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1?", "options": [{"t": "Inverse agonist", "correct": true, "why": "This is the definition of Inverse agonist."}, {"t": "Antagonist (neutral, reversible)", "correct": false, "why": "Antagonist (neutral, reversible): A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1)."}, {"t": "Partial agonist", "correct": false, "why": "Partial agonist: Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2)."}, {"t": "Allosteric antagonist", "correct": false, "why": "Allosteric antagonist: Binds at a different site on the receptor and decreases the affinity and/or efficacy of another drug for the receptor."}], "teach": "Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1. Petri dish with 50% of receptors naturally active: an inverse agonist brings cAMP production to zero; a competitive (neutral) antagonist leaves it at 50%.", "fg": "classes"},

eceptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1. Petri dish with 50% of receptors naturally active: an inverse agonist brings cAMP production to zero; a competitive (neutral) antagonist leaves it at 50%.", "dupOf": "T-inverse-agonist-1", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-neutral-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~37–~38; transcript 9/23; transcript 9/24", "quote": "Antagonists, they’re neutral. Like they don’t care if the receptor is active or inactive, they have equal affinity for both receptor states.", "id": "T-neutral-antagonist-1", "stem": "Which term is defined as: A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1)?", "options": [{"t": "Antagonist (neutral, reversible)", "correct": true, "why": "This is the definition of Antagonist (neutral, reversible)."}, {"t": "Competitive (reversible) antagonist", "correct": false, "why": "Competitive (reversible) antagonist: An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1."}, {"t": "Inverse agonist", "correct": false, "why": "Inverse agonist: Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1."}, {"t": "Partial agonist", "correct": false, "why": "Partial agonist: Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2)."}], "teach": "A drug with no efficacy (ε = {"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-competitive-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~15–~16, ~18, ~37; transcript 9/23", "quote": "when we think about uh ionic bonds, hydrogen bonds, [van der Waals] bonds, those are going to be reversible, surmountable, competitive. Different words ... they’re gonna bind and they’re gonna come off.", "id": "T-competitive-antagonist-1", "stem": "Which term is defined as: An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1?", "options": [{"t": "Competitive (reversible) antagonist", "correct": true, "why": "This is the definition of Competitive (reversible) antagonist."}, {"t": "Irreversible (non-competitive) antagonist", "correct": false, "why": "Irreversible (non-competitive) antagonist: An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2)."}, {"t": "Antagonist (neutral, reversible)", "correct": false, "why": "Antagonist (neutral, reversible): A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1)."}, {"t": "Indirect antagonist", "correct": false, "why": "Indirect antagonist: A drug that inhibits the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS."}], "teach": "An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1. Every drug on the Exam 1 drug list is reversible and competitive except phenoxybenzamine (drug-list PDF). The rightward-shift curve is Day 4 material (deck preview slide ~68).", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-competitive-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~15–~16, ~18, ~37; transcript 9/23", "quote": "when we think about uh ionic bonds, hydrogen bonds, [van der Waals] bonds, those are going to be reversible, surmountable, competitive. Different words ... they’re gonna bind and they’re gonna come off.", "id": "T-competitive-antagonist-2", "stem": "What does the term \"Competitive (reversible) antagonist\" mean?", "options": [{"t": "An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1.", "correct": true, "why": "This is the definition of Competitive (reversible) antagonist."}, {"t": "Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2).", "correct": false, "why": "That defines partial agonist."}, {"t": "An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2).", "correct": false, "why": "That defines irreversible (non-competitive) antagonist."}, {"t": "A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1).", "correct": false, "why": "That defines antagonist (neutral, reversible)."}], "teach": "An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1. Every drug on the Exam 1 drug list is reversible and competitive except phenoxybenzamine (drug-list PDF). The rightward-shift curve is Day 4 material (deck preview slide ~68).", "dupOf": "T-competitive-antagonist-1", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-irreversible-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~15, ~18, ~37–~38; transcript 9/23; transcript 9/24", "quote": "This is an irreversible antagonist, non-competitive, insurmountable. So what kind of bo[n]ds does it form? Covalent.", "id": "T-irreversible-antagonist-2", "stem": "What does the term \"Irreversible (non-competitive) antagonist\" mean?", "options": [{"t": "An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2).", "correct": true, "why": "This is the definition of Irreversible (non-competitive) antagonist."}, {"t": "An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1.", "correct": false, "why": "That defines competitive (reversible) antagonist."}, {"t": "Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive.", "correct": false, "why": "That defines covalent (irreversible) bond."}, {"t": "Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1.", "correct": false, "why": "That defines inverse agonist."}], "teach": "An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2). Once phenoxybenzamine is bound the receptor has to be internalized and recycled and the body must make new ones. Poll: phenoxybenzamine has higher affinity than prazosin. The reduced-Emax curve is Day 4 material (deck preview slide ~68).", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-indirect-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~40–~41; transcript 9/23; transcript 9/24", "quote": "So, remember that indirect antagonists can work downstream from the receptor, but also upstream from the receptor, OK?", "id": "T-indirect-antagonist-1", "stem": "Which term is defined as: A drug that inhibits the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS?", "options": [{"t": "Indirect antagonist", "correct": true, "why": "This is the definition of Indirect antagonist."}, {"t": "Allosteric site / modulator", "correct": false, "why": "Allosteric site / modulator: A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once."}, {"t": "Competitive (reversible) antagonist", "correct": false, "why": "Competitive (reversible) antagonist: An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1."}, {"t": "Partial agonist", "correct": false, "why": "Partial agonist: Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2)."}], "teach": "A drug that inhibits the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS. It can raise the response (caffeine on PDE raises cAMP; a norepinephrine transporter blocker makes norepinephrine appear more potent) or lower it (RAS blocker stops cell growth). It is not allosteric: it never touches the receptor.", "fg": "classes"},

ts the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS. It can raise the response (caffeine on PDE raises cAMP; a norepinephrine transporter blocker makes norepinephrine appear more potent) or lower it (RAS blocker stops cell growth). It is not allosteric: it never touches the receptor.", "dupOf": "T-indirect-antagonist-1", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-allosteric-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~21–~24, ~42; transcript 9/23", "quote": "Benzos increase the affinity And/or efficacy of GABA For its receptor", "id": "T-allosteric-agonist-1", "stem": "Which term is defined as: Binds at a different site on the receptor and increases the affinity and/or efficacy of another drug for the receptor (positive allosteric modulator, PAM). Diazepam and other benzodiazepines increase the affinity and/or efficacy of GABA at the GABA-A chloride channel?", "options": [{"t": "Allosteric agonist (PAM)", "correct": true, "why": "This is the definition of Allosteric agonist (PAM)."}, {"t": "Allosteric site / modulator", "correct": false, "why": "Allosteric site / modulator: A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once."}, {"t": "Allosteric antagonist", "correct": false, "why": "Allosteric antagonist: Binds at a different site on the receptor and decreases the affinity and/or efficacy of another drug for the receptor."}, {"t": "Full agonist", "correct": false, "why": "Full agonist: Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine."}], "teach": "Binds at a different site on the receptor and increases the affinity and/or efficacy of another drug for the receptor (positive allosteric modulator, PAM). Diazepam and other benzodiazepines increase the affinity and/or efficacy of GABA at the GABA-A chloride channel. Diazepam is the allosteric agonist on the drug list “that you have to know for your exam.” A benzodiazepine plus alcohol puts two allosteric agonists on one receptor.", "fg": "classes"},

{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-drc", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~8–~10, ~16–~18; Pharmacodynamics-Day_2_2026s copy.pdf slide ~56; transcript 9/24", "quote": "So my dose is going to be on the bottom, on the X axis. My response is gonna be on the Y axis, which is on the up or down, OK?", "id": "T-drc-1", "stem": "Which term is defined as: A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency?", "options": [{"t": "Dose–response curve (DRC / CRC)", "correct": true, "why": "This is the definition of Dose–response curve (DRC / CRC)."}, {"t": "Emax (maximal response, ceiling)", "correct": false, "why": "Emax (maximal response, ceiling): The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy."}, {"t": "Binding curve (Bmax)", "correct": false, "why": "Binding curve (Bmax): Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity."}, {"t": "Graded response", "correct": false, "why": "Graded response: A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect."}], "teach": "A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency. DRC: increasing individual doses in vivo (ADME, apparent potency). CRC: increasing concentration in vitro (molar, pharmacological potency). Affinity is on the x-axis, efficacy on the y-axis, potency a combination of the two.", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-drc", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~8–~10, ~16–~18; Pharmacodynamics-Day_2_2026s copy.pdf slide ~56; transcript 9/24", "quote": "So my dose is going to be on the bottom, on the X axis. My response is gonna be on the Y axis, which is on the up or down, OK?", "id": "T-drc-2", "stem": "What does the term \"Dose–response curve (DRC / CRC)\" mean?", "options": [{"t": "A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency.", "correct": true, "why": "This is the definition of Dose–response curve (DRC / CRC)."}, {"t": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy.", "correct": false, "why": "That defines potency (pharmacological)."}, {"t": "Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity.", "correct": false, "why": "That defines binding curve (bmax)."}, {"t": "A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect.", "correct": false, "why": "That defines graded response."}], "teach": "A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency. DRC: increasing individual doses in vivo (ADME, apparent potency). CRC: increasing concentration in vitro (molar, pharmacological potency). Affinity is on the x-axis, efficacy on the y-axis, potency a combination of the two.", "dupOf": "T-drc-1", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-graded-response", "tags": ["term"], "source": "slide", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~10, ~16, ~18; transcript 9/24", "quote": "Graded response by multiple increases of drug doses over a specific range", "id": "T-graded-response-1", "stem": "Which term is defined as: A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect?", "options": [{"t": "Graded response", "correct": true, "why": "This is the definition of Graded response."}, {"t": "Dose–response curve (DRC / CRC)", "correct": false, "why": "Dose–response curve (DRC / CRC): A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency."}, {"t": "Threshold", "correct": false, "why": "Threshold: The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50."}, {"t": "Emax (maximal response, ceiling)", "correct": false, "why": "Emax (maximal response, ceiling): The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy."}], "teach": "A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect. The y-axis is normalized (% of maximum response or response per tissue weight) to eliminate biological variability between individuals: “now I can compare apples with apples.”"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-graded-response", "tags": ["term"], "source": "slide", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~10, ~16, ~18; transcript 9/24", "quote": "Graded response by multiple increases of drug doses over a specific range", "id": "T-graded-response-2", "stem": "What does the term \"Graded response\" mean?", "options": [{"t": "A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect.", "correct": true, "why": "This is the definition of Graded response."}, {"t": "A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency.", "correct": false, "why": "That defines dose–response curve (drc / crc)."}, {"t": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50.", "correct": false, "why": "That defines threshold."}, {"t": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.", "correct": false, "why": "That defines emax (maximal response, ceiling)."}], "teach": "A response measured in a single biological unit on a continuous scale that increases by degrees as the dose is raised over a specific range (e.g., 10-fold steps); a graded DRC/CRC relates the dose to the intensity of the effect. The y-axis is normalized (% of maximum response or response per tissue weight) to eliminate biological variability between individuals: “now I can compare apples with apples.”", "dupOf": "T-graded-response-1"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-threshold", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~20–~21; transcript 9/24", "quote": "Remember that the threshold is the dose right before something happens, right? So I know that at any dose below this, no effect.", "id": "T-threshold-1", "stem": "Which term is defined as: The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50?", "options": [{"t": "Threshold", "correct": true, "why": "This is the definition of Threshold."}, {"t": "EC50 / ED50", "correct": false, "why": "EC50 / ED50: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)."}, {"t": "Emax (maximal response, ceiling)", "correct": false, "why": "Emax (maximal response, ceiling): The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy."}, {"t": "Slope", "correct": false, "why": "Slope: The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax."}], "teach": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50. Threshold is where the curve starts; EC50 is the halfway point; Emax is the ceiling.", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-threshold", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~20–~21; transcript 9/24", "quote": "Remember that the threshold is the dose right before something happens, right? So I know that at any dose below this, no effect.", "id": "T-threshold-2", "stem": "What does the term \"Threshold\" mean?", "options": [{"t": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50.", "correct": true, "why": "This is the definition of Threshold."}, {"t": "EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional).", "correct": false, "why": "That defines ec50 / ed50."}, {"t": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.", "correct": false, "why": "That defines emax (maximal response, ceiling)."}, {"t": "The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax.", "correct": false, "why": "That defines slope."}], "teach": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50. Threshold is where the curve starts; EC50 is the halfway point; Emax is the ceiling.", "dupOf": "T-threshold-1", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-emax", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~11–~14, ~20–~21, ~27; transcript 9/24", "quote": "What are the two reasons why we have reached the Emacs and we can’t keep going up? All the receptors are occupied or I max out the physiological system, right?", "id": "T-emax-1", "stem": "Which term is defined as: The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy?", "options": [{"t": "Emax (maximal response, ceiling)", "correct": true, "why": "This is the definition of Emax (maximal response, ceiling)."}, {"t": "Irreversible (non-competitive) antagonist", "correct": false, "why": "Irreversible (non-competitive) antagonist: An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2)."}, {"t": "EC50 / ED50", "correct": false, "why": "EC50 / ED50: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}], "teach": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy. Giving more drug past the ceiling does no more good. Curves with equal Emax differ by affinity; when EC50 is equal, greater efficacy makes the drug more potent (Relative Efficacy slide).", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-emax", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~11–~14, ~20–~21, ~27; transcript 9/24", "quote": "What are the two reasons why we have reached the Emacs and we can’t keep going up? All the receptors are occupied or I max out the physiological system, right?", "id": "T-emax-2", "stem": "What does the term \"Emax (maximal response, ceiling)\" mean?", "options": [{"t": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.", "correct": true, "why": "This is the definition of Emax (maximal response, ceiling)."}, {"t": "EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional).", "correct": false, "why": "That defines ec50 / ed50."}, {"t": "The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist.", "correct": false, "why": "That defines efficacy (intrinsic efficacy)."}, {"t": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50.", "correct": false, "why": "That defines threshold."}], "teach": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy. Giving more drug past the ceiling does no more good. Curves with equal Emax differ by affinity; when EC50 is equal, greater efficacy makes the drug more potent (Relative Efficacy slide).", "dupOf": "T-emax-1", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-slope", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~20–~21; transcript 9/24", "quote": "In that slope in that area of the curve, this is when I’m going to get the most bang for my buck. This is I’m going to get the greatest change in the response with the smallest change in the dose.", "id": "T-slope-1", "stem": "Which term is defined as: The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax?", "options": [{"t": "Slope", "correct": true, "why": "This is the definition of Slope."}, {"t": "Threshold", "correct": false, "why": "Threshold: The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50."}, {"t": "Emax (maximal response, ceiling)", "correct": false, "why": "Emax (maximal response, ceiling): The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}], "teach": "The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax. Which is better “depends”: the steep curve goes from no effect to max all at once; the shallow one gives a greater range of doses before a toxic effect."},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-slope", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~20–~21; transcript 9/24", "quote": "In that slope in that area of the curve, this is when I’m going to get the most bang for my buck. This is I’m going to get the greatest change in the response with the smallest change in the dose.", "id": "T-slope-2", "stem": "What does the term \"Slope\" mean?", "options": [{"t": "The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax.", "correct": true, "why": "This is the definition of Slope."}, {"t": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy.", "correct": false, "why": "That defines potency (pharmacological)."}, {"t": "The concentration of the drug below which there is no response: the dose right before something happens. It must be known, with Emax, to calculate the EC50/ED50.", "correct": false, "why": "That defines threshold."}, {"t": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.", "correct": false, "why": "That defines emax (maximal response, ceiling)."}], "teach": "The linear mid-section of the sigmoid curve, where the greatest change in effect comes from the smallest change in dose. A steep slope means a narrow dose range from no effect to maximum; a shallow slope means a wider range of doses before Emax. Which is better “depends”: the steep curve goes from no effect to max all at once; the shallow one gives a greater range of doses before a toxic effect.", "dupOf": "T-slope-1"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-ec50", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~57–~58; Pharmacodynamics-Day_3_2026s.pdf slides ~20–~22, ~29; transcript 9/24", "quote": "So, the take-home message that you can’t forget is that the smallest the ED50 is or the [EC]50, the greater the potency is gonna be. They’re inverse proportional.", "id": "T-ec50-1", "stem": "Which term is defined as: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)?", "options": [{"t": "EC50 / ED50", "correct": true, "why": "This is the definition of EC50 / ED50."}, {"t": "Kd (dissociation constant)", "correct": false, "why": "Kd (dissociation constant): The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional."}, {"t": "Emax (maximal response, ceiling)", "correct": false, "why": "Emax (maximal response, ceiling): The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}], "teach": "EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional). Kd is the concentration binding 50% of receptors (affinity, no effect); EC50 is 50% of the response (potency). Both are read on the x-axis. “Philosophically identical”: one is a dose, the other a concentration.", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-ec50", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~57–~58; Pharmacodynamics-Day_3_2026s.pdf slides ~20–~22, ~29; transcript 9/24", "quote": "So, the take-home message that you can’t forget is that the smallest the ED50 is or the [EC]50, the greater the potency is gonna be. They’re inverse proportional.", "id": "T-ec50-2", "stem": "What does the term \"EC50 / ED50\" mean?", "options": [{"t": "EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional).", "correct": true, "why": "This is the definition of EC50 / ED50."}, {"t": "The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional.", "correct": false, "why": "That defines kd (dissociation constant)."}, {"t": "The plateau of the dose–response curve (ceiling of effect), reached either because all receptors are occupied or because the physiological system has maxed out. The height of Emax reflects efficacy.", "correct": false, "why": "That defines emax (maximal response, ceiling)."}, {"t": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy.", "correct": false, "why": "That defines potency (pharmacological)."}], "teach": "EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional). Kd is the concentration binding 50% of receptors (affinity, no effect); EC50 is 50% of the response (potency). Both are read on the x-axis. “Philosophically identical”: one is a dose, the other a concentration.", "dupOf": "T-ec50-1", "fg": "drc-basic"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-potency", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~7, ~22, ~27–~29; Pharmacodynamics-Day_2_2026s copy.pdf slides ~52–~54; Pharmacodynamics-Day-1-2026s.pdf slides ~21–~22, ~27; transcript 9/22; transcript 9/23; transcript 9/24", "quote": "The take home message over here is that potency is not only going to be defined by the efficacy of the affinity, but also the tissue that is going to be bound to.", "id": "T-potency-1", "stem": "Which term is defined as: Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy?", "options": [{"t": "Potency (pharmacological)", "correct": true, "why": "This is the definition of Potency (pharmacological)."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}, {"t": "Affinity", "correct": false, "why": "Affinity: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity."}, {"t": "Apparent potency", "correct": false, "why": "Apparent potency: The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency."}], "teach": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy. Potency ≠ efficacy: the most potent drug (smallest EC50) can be a partial agonist; the most efficacious has the highest Emax. “Affinity is gonna be on the bottom, efficacy is gonna be on the Y axis, and potency is gonna be a combination of the two.”", "fg": "potency"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-potency", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~7, ~22, ~27–~29; Pharmacodynamics-Day_2_2026s copy.pdf slides ~52–~54; Pharmacodynamics-Day-1-2026s.pdf slides ~21–~22, ~27; transcript 9/22; transcript 9/23; transcript 9/24", "quote": "The take home message over here is that potency is not only going to be defined by the efficacy of the affinity, but also the tissue that is going to be bound to.", "id": "T-potency-2", "stem": "What does the term \"Potency (pharmacological)\" mean?", "options": [{"t": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy.", "correct": true, "why": "This is the definition of Potency (pharmacological)."}, {"t": "Transmembrane proteins (~232 types, expressed in all cells) that convey their signal by altering membrane potential or ionic composition (Na+, K+, Ca2+, Cl−); classified by the ions they conduct, their architecture and what opens them. Ligand-gated channels are usually closed with the binding pocket located in the channel (acetylcholine at the nicotinic receptor, GABA-A, 5HT3).", "correct": false, "why": "That defines ion channel (ligand-gated)."}, {"t": "The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist.", "correct": false, "why": "That defines efficacy (intrinsic efficacy)."}, {"t": "The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity.", "correct": false, "why": "That defines affinity."}], "teach": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy. Potency ≠ efficacy: the most potent drug (smallest EC50) can be a partial agonist; the most efficacious has the highest Emax. “Affinity is gonna be on the bottom, efficacy is gonna be on the Y axis, and potency is gonna be a combination of the two.”", "dupOf": "T-potency-1", "fg": "potency"},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-apparent-potency", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~23, ~27; Pharmacodynamics-Day_3_2026s.pdf slide ~8; transcript 9/22", "quote": "So this is going to give us our apparent potency. Why is apparent? ... It’s only appearing because it’s not the total concentration of the drug.", "id": "T-apparent-potency-1", "stem": "Which term is defined as: The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency?", "options": [{"t": "Apparent potency", "correct": true, "why": "This is the definition of Apparent potency."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}, {"t": "Pharmacokinetics (PK)", "correct": false, "why": "Pharmacokinetics (PK): The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions)."}, {"t": "Relative potency", "correct": false, "why": "Relative potency: The ratio of two drugs’ ED50 (or EC50) values, ED50B / ED50A. A drug that needs 1000 times less drug to produce an equivalent response is 1000X more potent."}], "teach": "The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency. Route of administration and first-pass metabolism change apparent potency (IV has 100% bioavailability); they do not change the drug’s affinity or efficacy, which set pharmacological potency."},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-apparent-potency", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~23, ~27; Pharmacodynamics-Day_3_2026s.pdf slide ~8; transcript 9/22", "quote": "So this is going to give us our apparent potency. Why is apparent? ... It’s only appearing because it’s not the total concentration of the drug.", "id": "T-apparent-potency-2", "stem": "What does the term \"Apparent potency\" mean?", "options": [{"t": "The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency.", "correct": true, "why": "This is the definition of Apparent potency."}, {"t": "Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy.", "correct": false, "why": "That defines potency (pharmacological)."}, {"t": "The absorption, distribution, metabolism and excretion (ADME) side of the pharmacology diagram: how much of the drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions).", "correct": false, "why": "That defines pharmacokinetics (pk)."}, {"t": "The ratio of two drugs’ ED50 (or EC50) values, ED50B / ED50A. A drug that needs 1000 times less drug to produce an equivalent response is 1000X more potent.", "correct": false, "why": "That defines relative potency."}], "teach": "The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency. Route of administration and first-pass metabolism change apparent potency (IV has 100% bioavailability); they do not change the drug’s affinity or efficacy, which set pharmacological potency.", "dupOf": "T-apparent-potency-1"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g4", "skill": "term", "concept": "term-relative-potency", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slide ~23; transcript 9/24", "quote": "We can say that a drug A is 1000 times more potent than drug B because it requires 1000 times less drug to produce equivalent responses.", "id": "T-relative-potency-1", "stem": "Which term is defined as: The ratio of two drugs’ ED50 (or EC50) values, ED50B / ED50A. A drug that needs 1000 times less drug to produce an equivalent response is 1000X more potent?", "options": [{"t": "Relative potency", "correct": true, "why": "This is the definition of Relative potency."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}, {"t": "EC50 / ED50", "correct": false, "why": "EC50 / ED50: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)."}, {"t": "Apparent potency", "correct": false, "why": "Apparent potency: The potency seen in vivo, where pharmacokinetics (age, absorption, distribution, elimination, drug–drug interactions) determines how much drug reaches the site of action. It is “apparent” because it is not the total concentration of the drug that acts; a DRC built in vivo (ED50) shows apparent potency."}], "teach": "The ratio of two drugs’ ED50 (or EC50) values, ED50B / ED50A. A drug that needs 1000 times less drug to produce an equivalent response is 1000X more potent. Compare potency at equivalent effects (e.g., 50%), not at 100%, because a partial agonist never reaches 100%. “Math is gonna be minimal.”"},
