{"id": "DL1-003", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "chol", "concept": "moa-acetylcholine", "tags": ["drug-list"], "stem": "Acetylcholine is an agonist at which receptors?", "options": [{"t": "M1, M2, M3, Nn and Nm", "correct": true, "why": "Acetylcholine activates both receptor families: muscarinic (M1, M2, M3) and nicotinic (Nn, Nm)."}, {"t": "M1, M2 and M3 only", "correct": false, "why": "Leaves out the nicotinic receptors; M1, M2 and M3 alone are the receptors tropicamide blocks."}, {"t": "Nn only", "correct": false, "why": "Nn alone is where varenicline is a partial agonist; acetylcholine acts at all five listed receptors."}, {"t": "Nn and Nm only", "correct": false, "why": "Leaves out the muscarinic receptors M1, M2 and M3."}, {"t": "M1, M2, M3, Nn, Nm, H1 and H2", "correct": false, "why": "H1 and H2 are histamine receptors, listed for histamine, not acetylcholine."}], "teach": "Acetylcholine activates both cholinergic receptor families: muscarinic (M1, M2, M3) and nicotinic (Nn, Nm). Tropicamide blocks the muscarinic ones; varenicline partially activates Nn.", "reading": [{"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "Muscarinic M1 and M3 signal through IP3, DAG and calcium and M2 opens potassium channels; nicotinic Nn and Nm are ligand-gated channels that open sodium and potassium channels and depolarize the cell."}]},
{"id": "DL1-004", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "chol", "concept": "moa-tropicamide", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of tropicamide?", "options": [{"t": "Muscarinic (M1, M2, M3) antagonist, reversible", "correct": true, "why": "Tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Muscarinic (M1, M2, M3) and nicotinic (Nn, Nm) agonist", "correct": false, "why": "That is acetylcholine; tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Nicotinic (Nn) partial agonist", "correct": false, "why": "That is varenicline; tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Non-selective histamine receptor antagonist", "correct": false, "why": "That is diphenhydramine; tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}], "teach": "Tropicamide binds M1, M2 and M3 without activating them and blocks acetylcholine there; the block is reversible.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "M1 and M3 receptors signal through IP3, DAG and calcium; M2 receptors open potassium channels and inhibit adenylyl cyclase (myocardium)."}]},
{"id": "DL1-005", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-prazosin", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of prazosin?", "options": [{"t": "α1 antagonist, reversible", "correct": true, "why": "Prazosin is listed as α1 antagonist, reversible."}, {"t": "α1 agonist", "correct": false, "why": "That is phenylephrine; prazosin is listed as α1 antagonist, reversible."}, {"t": "α1 and α2 antagonist, irreversible", "correct": false, "why": "That is phenoxybenzamine; prazosin is listed as α1 antagonist, reversible."}, {"t": "β1 antagonist, reversible", "correct": false, "why": "That is metoprolol; prazosin is listed as α1 antagonist, reversible."}], "teach": "Prazosin binds α1 without activating it and blocks agonists there reversibly. Phenoxybenzamine also blocks α1, but irreversibly and at α2 too.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "α1 receptors sit on effector cells, especially smooth muscle; ligand binding forms IP3 and DAG and raises intracellular calcium, which contracts the muscle."}]},
{"id": "DL1-006", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-phenylephrine", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of phenylephrine?", "options": [{"t": "α1 agonist", "correct": true, "why": "Phenylephrine is listed as α1 agonist."}, {"t": "α1 antagonist, reversible", "correct": false, "why": "That is prazosin; phenylephrine is listed as α1 agonist."}, {"t": "α1, α2, β1 and β2 agonist", "correct": false, "why": "That is norepinephrine and epinephrine; phenylephrine is listed as α1 agonist."}, {"t": "β2 partial agonist", "correct": false, "why": "That is albuterol; phenylephrine is listed as α1 agonist."}], "teach": "Phenylephrine binds α1 and activates it; it does not act at α2 or β receptors. Prazosin binds the same receptor and blocks it.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Receptors mediate the actions of agonists and antagonists", "t": "An agonist binds the receptor and activates it, so the receptor signals as a direct result of the binding."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "α1 receptors sit on effector cells, especially smooth muscle; ligand binding forms IP3 and DAG and raises intracellular calcium, which contracts the muscle."}]},
{"id": "DL1-007", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-phenoxybenzamine", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of phenoxybenzamine?", "options": [{"t": "α1 and α2 antagonist, irreversible", "correct": true, "why": "Phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}, {"t": "α1 antagonist, reversible", "correct": false, "why": "That is prazosin; phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}, {"t": "β1 and β2 partial agonist", "correct": false, "why": "That is pindolol; phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}, {"t": "Muscarinic (M1, M2, M3) antagonist, reversible", "correct": false, "why": "That is tropicamide; phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}], "teach": "Phenoxybenzamine binds α1 and α2 irreversibly, so the block cannot be overcome by more agonist. It is the only irreversible drug on the list; every other drug is reversible and competitive.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "An irreversible antagonist binds the receptor irreversibly (sometimes covalently), so no agonist concentration can surmount the block and the maximal agonist effect falls; the block lasts until new receptors are made."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "α1 binding forms IP3 and DAG and raises calcium, contracting smooth muscle; α2 binding inhibits adenylyl cyclase and lowers cAMP."}]},
{"id": "DL1-008", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-metoprolol", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of metoprolol?", "options": [{"t": "β1 antagonist, reversible", "correct": true, "why": "Metoprolol is listed as β1 antagonist, reversible."}, {"t": "β1 and β2 partial agonist", "correct": false, "why": "That is pindolol; metoprolol is listed as β1 antagonist, reversible."}, {"t": "α1 antagonist, reversible", "correct": false, "why": "That is prazosin; metoprolol is listed as β1 antagonist, reversible."}, {"t": "α1 and α2 antagonist, irreversible", "correct": false, "why": "That is phenoxybenzamine; metoprolol is listed as β1 antagonist, reversible."}], "teach": "Metoprolol binds β1 without activating it and blocks agonists there reversibly. Pindolol acts at β1 too, but as a partial agonist and at β2 as well.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "β1 receptors sit especially on the heart; ligand binding stimulates adenylyl cyclase and raises cAMP, which speeds the sinoatrial node and increases contractility."}]},
{"id": "DL1-009", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "gaba", "concept": "moa-diazepam", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of diazepam?", "options": [{"t": "GABA receptor allosteric agonist", "correct": true, "why": "Diazepam is listed as GABA receptor allosteric agonist."}, {"t": "Histamine H1 inverse agonist", "correct": false, "why": "That is loratadine; diazepam is listed as GABA receptor allosteric agonist."}, {"t": "Nicotinic (Nn) partial agonist", "correct": false, "why": "That is varenicline; diazepam is listed as GABA receptor allosteric agonist."}, {"t": "Non-selective histamine receptor antagonist", "correct": false, "why": "That is diphenhydramine; diazepam is listed as GABA receptor allosteric agonist."}], "teach": "Diazepam binds the GABA receptor at an allosteric site, not the site GABA binds, and increases the receptor’s response to GABA.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists — allosteric modulators", "t": "Diazepam binds the GABA receptor at a second site, not where GABA binds. On its own it does little; when GABA is also bound, it makes GABA open the channel more."}, {"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists — allosteric modulators", "t": "The GABA receptor is an ion channel that the neurotransmitter GABA opens."}], "note": "Two labels for the same drug. The drug list says: allosteric agonist. The textbook says: positive allosteric modulator, because diazepam does not open the channel by itself; it makes GABA better at opening it. Use the drug list label on the exam."},
{"id": "DL1-010", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-albuterol", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of albuterol?", "options": [{"t": "β2 partial agonist", "correct": true, "why": "Albuterol is listed as β2 partial agonist."}, {"t": "β1 and β2 partial agonist", "correct": false, "why": "That is pindolol; albuterol is listed as β2 partial agonist."}, {"t": "β1 antagonist, reversible", "correct": false, "why": "That is metoprolol; albuterol is listed as β2 partial agonist."}, {"t": "α1, α2, β1 and β2 agonist", "correct": false, "why": "That is norepinephrine and epinephrine; albuterol is listed as β2 partial agonist."}], "teach": "Albuterol activates β2 but reaches a lower maximal response than a full agonist would. It does not act at β1; pindolol is the partial agonist that does.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Partial Agonists", "t": "A partial agonist activates the receptor but produces a lower maximal response at full receptor occupancy than a full agonist does, and it competes with a full agonist for the same sites."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "β2 receptors sit especially on smooth muscle; ligand binding stimulates adenylyl cyclase and raises cAMP, which relaxes bronchiolar smooth muscle."}]},
{"id": "DL1-011", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "chol", "concept": "moa-varenicline", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of varenicline?", "options": [{"t": "Nicotinic (Nn) partial agonist", "correct": true, "why": "Varenicline is listed as nicotinic (Nn) partial agonist."}, {"t": "Muscarinic (M1, M2, M3) and nicotinic (Nn, Nm) agonist", "correct": false, "why": "That is acetylcholine; varenicline is listed as nicotinic (Nn) partial agonist."}, {"t": "Muscarinic (M1, M2, M3) antagonist, reversible", "correct": false, "why": "That is tropicamide; varenicline is listed as nicotinic (Nn) partial agonist."}, {"t": "β2 partial agonist", "correct": false, "why": "That is albuterol; varenicline is listed as nicotinic (Nn) partial agonist."}], "teach": "Varenicline activates the neuronal nicotinic receptor Nn, but only to a submaximal response. Acetylcholine is the full agonist at Nn and at the other cholinergic receptors.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Partial Agonists", "t": "A partial agonist activates the receptor but produces a lower maximal response at full receptor occupancy than a full agonist does, and it competes with a full agonist for the same sites."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "The Nn receptor on postganglionic neurons is a ligand-gated channel: binding opens sodium and potassium channels and depolarizes the neuron."}]},
{"id": "DL1-012", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "hist", "concept": "moa-histamine", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of histamine?", "options": [{"t": "Histamine H1 and H2 agonist", "correct": true, "why": "Histamine is listed as histamine H1 and H2 agonist."}, {"t": "Histamine H1 inverse agonist", "correct": false, "why": "That is loratadine; histamine is listed as histamine H1 and H2 agonist."}, {"t": "Non-selective histamine receptor antagonist", "correct": false, "why": "That is diphenhydramine; histamine is listed as histamine H1 and H2 agonist."}, {"t": "GABA receptor allosteric agonist", "correct": false, "why": "That is diazepam; histamine is listed as histamine H1 and H2 agonist."}], "teach": "Histamine activates both H1 and H2. Loratadine and diphenhydramine oppose it: loratadine as an H1 inverse agonist, diphenhydramine as a non-selective antagonist.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Receptors mediate the actions of agonists and antagonists", "t": "An agonist binds the receptor and activates it, so the receptor signals as a direct result of the binding."}, {"src": "Katzung 16e, Ch. 2", "sec": "Receptor Classes & Drug Development", "t": "Histamine activates more than one receptor subtype, and each subtype can couple to a different G protein, which is what lets a drug be selective for one subtype."}]},
{"id": "DL1-013", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "hist", "concept": "moa-loratadine", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of loratadine?", "options": [{"t": "Histamine H1 inverse agonist", "correct": true, "why": "Loratadine is listed as histamine H1 inverse agonist."}, {"t": "Non-selective histamine receptor antagonist", "correct": false, "why": "That is diphenhydramine; loratadine is listed as histamine H1 inverse agonist."}, {"t": "Histamine H1 and H2 agonist", "correct": false, "why": "That is histamine; loratadine is listed as histamine H1 inverse agonist."}, {"t": "Muscarinic (M1, M2, M3) antagonist, reversible", "correct": false, "why": "That is tropicamide; loratadine is listed as histamine H1 inverse agonist."}], "teach": "Loratadine binds H1 and lowers its activity below baseline (inverse agonist). Diphenhydramine blocks histamine receptors without selectivity.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "An inverse agonist binds the receptor and lowers its activity below the basal level seen with no agonist present, rather than merely blocking the agonist."}, {"src": "Katzung 16e, Ch. 2", "sec": "Receptor Classes & Drug Development", "t": "Histamine activates more than one receptor subtype, and each subtype can couple to a different G protein, which is what lets a drug be selective for one subtype."}]},
{"id": "DL1-014", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-pindolol", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of pindolol?", "options": [{"t": "β1 and β2 partial agonist", "correct": true, "why": "Pindolol is listed as β1 and β2 partial agonist."}, {"t": "β1 antagonist, reversible", "correct": false, "why": "That is metoprolol; pindolol is listed as β1 and β2 partial agonist."}, {"t": "β2 partial agonist", "correct": false, "why": "That is albuterol; pindolol is listed as β1 and β2 partial agonist."}, {"t": "α1 and α2 antagonist, irreversible", "correct": false, "why": "That is phenoxybenzamine; pindolol is listed as β1 and β2 partial agonist."}], "teach": "Pindolol activates β1 and β2, but only to a submaximal response, so it is a partial agonist. Metoprolol blocks β1 outright; albuterol is partial at β2 only.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Partial Agonists", "t": "A partial agonist activates the receptor but produces a lower maximal response at full receptor occupancy than a full agonist does, and it competes with a full agonist for the same sites."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "β1 (heart) and β2 (smooth muscle) both raise cAMP through adenylyl cyclase: β1 speeds the sinoatrial node and increases contractility, β2 relaxes bronchiolar smooth muscle."}]},
{"id": "DL1-015", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "hist", "concept": "moa-diphenhydramine", "tags": ["drug-list"], "stem": "Which of the following describes the mechanism of action of diphenhydramine?", "options": [{"t": "Non-selective histamine receptor antagonist", "correct": true, "why": "Diphenhydramine is listed as non-selective histamine receptor antagonist."}, {"t": "Histamine H1 inverse agonist", "correct": false, "why": "That is loratadine; diphenhydramine is listed as non-selective histamine receptor antagonist."}, {"t": "Histamine H1 and H2 agonist", "correct": false, "why": "That is histamine; diphenhydramine is listed as non-selective histamine receptor antagonist."}, {"t": "Muscarinic (M1, M2, M3) antagonist, reversible", "correct": false, "why": "That is tropicamide; diphenhydramine is listed as non-selective histamine receptor antagonist."}], "teach": "Diphenhydramine binds histamine receptors without activating them and without selecting one subtype. Loratadine is selective for H1 and is an inverse agonist.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 2", "sec": "Receptor Classes & Drug Development", "t": "Histamine activates more than one receptor subtype, and each subtype can couple to a different G protein, which is what lets a drug be selective for one subtype."}]},
{"id": "DL1-016", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "irreversible-drug", "tags": ["drug-list"], "stem": "Phenoxybenzamine differs from every other drug on the Exam 1 list in which way?", "options": [{"t": "It binds its receptors irreversibly", "correct": true, "why": "The list states all its drugs are reversible and competitive at their receptors, with one exception: phenoxybenzamine, which is irreversible."}, {"t": "It is a partial agonist at β receptors", "correct": false, "why": "That describes pindolol (β1 and β2) and albuterol (β2)."}, {"t": "It is selective for the α1 receptor", "correct": false, "why": "Phenoxybenzamine blocks α1 and α2. The α1-selective drugs on the list are prazosin (antagonist) and phenylephrine (agonist)."}, {"t": "It acts at an allosteric site on its receptor", "correct": false, "why": "The list gives an allosteric mechanism only for diazepam at the GABA receptor."}], "teach": "Phenoxybenzamine binds α1 and α2 irreversibly, so the block cannot be overcome by more agonist. It is the only irreversible drug on the list; every other drug is reversible and competitive.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "An irreversible antagonist binds the receptor irreversibly (sometimes covalently), so no agonist concentration can surmount the block and the maximal agonist effect falls; the block lasts until new receptors are made."}]},
{"id": "DL1-017", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "hist", "concept": "moa-loratadine", "tags": ["drug-list"], "stem": "Which drug is a histamine H1 receptor inverse agonist?", "options": [{"t": "Loratadine", "correct": true, "why": "Loratadine is listed as histamine H1 inverse agonist."}, {"t": "Diphenhydramine", "correct": false, "why": "Diphenhydramine is listed as non-selective histamine receptor antagonist."}, {"t": "Histamine", "correct": false, "why": "Histamine is listed as histamine H1 and H2 agonist."}, {"t": "Tropicamide", "correct": false, "why": "Tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Diazepam", "correct": false, "why": "Diazepam is listed as GABA receptor allosteric agonist."}], "teach": "Loratadine binds H1 and lowers its activity below baseline (inverse agonist). Diphenhydramine blocks histamine receptors without selectivity.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "An inverse agonist binds the receptor and lowers its activity below the basal level seen with no agonist present, rather than merely blocking the agonist."}, {"src": "Katzung 16e, Ch. 2", "sec": "Receptor Classes & Drug Development", "t": "Histamine activates more than one receptor subtype, and each subtype can couple to a different G protein, which is what lets a drug be selective for one subtype."}]},
{"id": "DL1-018", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "chol", "concept": "moa-varenicline", "tags": ["drug-list"], "stem": "Which drug is a partial agonist at the neuronal nicotinic (Nn) receptor?", "options": [{"t": "Varenicline", "correct": true, "why": "Varenicline is listed as nicotinic (Nn) partial agonist."}, {"t": "Acetylcholine", "correct": false, "why": "Acetylcholine is listed as muscarinic (M1, M2, M3) and nicotinic (Nn, Nm) agonist."}, {"t": "Tropicamide", "correct": false, "why": "Tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Albuterol", "correct": false, "why": "Albuterol is listed as β2 partial agonist."}, {"t": "Pindolol", "correct": false, "why": "Pindolol is listed as β1 and β2 partial agonist."}], "teach": "Varenicline activates the neuronal nicotinic receptor Nn, but only to a submaximal response. Acetylcholine is the full agonist at Nn and at the other cholinergic receptors.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Partial Agonists", "t": "A partial agonist activates the receptor but produces a lower maximal response at full receptor occupancy than a full agonist does, and it competes with a full agonist for the same sites."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "The Nn receptor on postganglionic neurons is a ligand-gated channel: binding opens sodium and potassium channels and depolarizes the neuron."}]},
{"id": "DL1-019", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-phenylephrine", "tags": ["drug-list"], "stem": "Which drug is a selective α1 agonist?", "options": [{"t": "Phenylephrine", "correct": true, "why": "Phenylephrine is listed as α1 agonist."}, {"t": "Prazosin", "correct": false, "why": "Prazosin is listed as α1 antagonist, reversible."}, {"t": "Norepinephrine", "correct": false, "why": "Norepinephrine is listed as α1, α2, β1 and β2 agonist."}, {"t": "Phenoxybenzamine", "correct": false, "why": "Phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}, {"t": "Albuterol", "correct": false, "why": "Albuterol is listed as β2 partial agonist."}], "teach": "Phenylephrine binds α1 and activates it; it does not act at α2 or β receptors. Prazosin binds the same receptor and blocks it.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Receptors mediate the actions of agonists and antagonists", "t": "An agonist binds the receptor and activates it, so the receptor signals as a direct result of the binding."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "α1 receptors sit on effector cells, especially smooth muscle; ligand binding forms IP3 and DAG and raises intracellular calcium, which contracts the muscle."}]},
{"id": "DL1-020", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "gaba", "concept": "moa-diazepam", "tags": ["drug-list"], "stem": "Which drug acts as an allosteric agonist at the GABA receptor?", "options": [{"t": "Diazepam", "correct": true, "why": "Diazepam is listed as GABA receptor allosteric agonist."}, {"t": "Loratadine", "correct": false, "why": "Loratadine is listed as histamine H1 inverse agonist."}, {"t": "Varenicline", "correct": false, "why": "Varenicline is listed as nicotinic (Nn) partial agonist."}, {"t": "Tropicamide", "correct": false, "why": "Tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Metoprolol", "correct": false, "why": "Metoprolol is listed as β1 antagonist, reversible."}], "teach": "Diazepam binds the GABA receptor at an allosteric site, not the site GABA binds, and increases the receptor’s response to GABA.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists — allosteric modulators", "t": "Diazepam binds the GABA receptor at a second site, not where GABA binds. On its own it does little; when GABA is also bound, it makes GABA open the channel more."}], "note": "Two labels for the same drug. The drug list says: allosteric agonist. The textbook says: positive allosteric modulator, because diazepam does not open the channel by itself; it makes GABA better at opening it. Use the drug list label on the exam."},
{"id": "DL1-021", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "adr", "concept": "moa-metoprolol", "tags": ["drug-list"], "stem": "Which drug is a reversible β1 antagonist?", "options": [{"t": "Metoprolol", "correct": true, "why": "Metoprolol is listed as β1 antagonist, reversible."}, {"t": "Pindolol", "correct": false, "why": "Pindolol is listed as β1 and β2 partial agonist."}, {"t": "Albuterol", "correct": false, "why": "Albuterol is listed as β2 partial agonist."}, {"t": "Prazosin", "correct": false, "why": "Prazosin is listed as α1 antagonist, reversible."}, {"t": "Phenoxybenzamine", "correct": false, "why": "Phenoxybenzamine is listed as α1 and α2 antagonist, irreversible."}], "teach": "Metoprolol binds β1 without activating it and blocks agonists there reversibly. Pindolol acts at β1 too, but as a partial agonist and at β2 as well.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "β1 receptors sit especially on the heart; ligand binding stimulates adenylyl cyclase and raises cAMP, which speeds the sinoatrial node and increases contractility."}]},
{"id": "DL1-022", "lecture": "DL1", "prof": "Gottlieb", "tier": "new", "topic": "DL1", "skill": "drug", "source": "slide", "cite": "Exam_1_Drug_List_2026.pdf, Table 1", "fg": "classes", "sub": "chol", "concept": "moa-tropicamide", "tags": ["drug-list"], "stem": "Which drug is a reversible antagonist at muscarinic M1, M2 and M3 receptors?", "options": [{"t": "Tropicamide", "correct": true, "why": "Tropicamide is listed as muscarinic (M1, M2, M3) antagonist, reversible."}, {"t": "Acetylcholine", "correct": false, "why": "Acetylcholine is listed as muscarinic (M1, M2, M3) and nicotinic (Nn, Nm) agonist."}, {"t": "Varenicline", "correct": false, "why": "Varenicline is listed as nicotinic (Nn) partial agonist."}, {"t": "Diphenhydramine", "correct": false, "why": "Diphenhydramine is listed as non-selective histamine receptor antagonist."}, {"t": "Prazosin", "correct": false, "why": "Prazosin is listed as α1 antagonist, reversible."}], "teach": "Tropicamide binds M1, M2 and M3 without activating them and blocks acetylcholine there; the block is reversible.", "reading": [{"src": "Katzung 16e, Ch. 2", "sec": "Competitive & Irreversible Antagonists", "t": "A reversible (competitive) antagonist binds the receptor without activating it and blocks the agonist; enough agonist can surmount the block, so the agonist curve shifts right with the same maximum."}, {"src": "Katzung 16e, Ch. 6", "sec": "Autonomic Receptors, Table 6-2", "t": "M1 and M3 receptors signal through IP3, DAG and calcium; M2 receptors open potassium channels and inhibit adenylyl cyclase (myocardium)."}]},

 drug gets to the site of action. It sets the apparent potency of a drug (age, absorption, distribution, elimination, drug–drug interactions). On the efficacy poll, “the ability of a drug to be absorbed at the level of the GI” is pharmacokinetics, not efficacy."},

{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-drug", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~29–~31; transcript 9/22", "quote": "drugs don’t create anything new, they just change whatever is happening in the body. Either they are going to enhance the signal or perhaps suppress the signal", "id": "T-drug-1", "stem": "Which term is defined as: A chemical substance that alters an ongoing physiological or pathological function by interacting with components of a biological system. Drugs initiate, inhibit or modulate a response; they do not create anything new?", "options": [{"t": "Drug", "correct": true, "why": "This is the definition of Drug."}, {"t": "Ligand", "correct": false, "why": "Ligand: A chemical that a receptor recognizes and binds by its shape, size and other properties: endogenous (a hormone or neurotransmitter) or exogenous (a drug, a supplement, something eaten or drunk). A ligand induces a conformational change in the receptor."}, {"t": "Natural dietary supplement (NDS)", "correct": false, "why": "Natural dietary supplement (NDS): A product regulated as food, not as a drug, so with less FDA oversight; it stays on the market until it causes harm. Its label cannot state that it treats, cures, diagnoses or prevents disease, and natural does not mean safe or free of drug interactions."}, {"t": "Site of action (SOA)", "correct": false, "why": "Site of action (SOA): Where the receptor the drug acts on is located (metoprolol: heart, kidneys and brain; thiazides: distal convoluted tubule). Knowing MOA plus SOA lets you predict the effect, side effects and drug–drug interactions without memorizing them."}], "teach": "A chemical substance that alters an ongoing physiological or pathological function by interacting with components of a biological system. Drugs initiate, inhibit or modulate a response; they do not create anything new. Walter Straub: there is only a quantitative difference between a drug and a poison (vitamin A in carrots vs polar bear liver)."},

{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-receptor", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~11, ~34–~36; transcript 9/22", "quote": "Receptors are regulatory proteins involved in the transfer of chemical information carried by various endogenous/exogenous mediators", "id": "T-receptor-1", "stem": "Which term is defined as: Regulatory proteins involved in the transfer of chemical information carried by endogenous or exogenous mediators. Classified by the structure of the receptor protein and its transduction components: ion channels, 7-transmembrane (GPCR), 1-transmembrane (tyrosine kinases) and intracellular/nuclear receptors?", "options": [{"t": "Receptor", "correct": true, "why": "This is the definition of Receptor."}, {"t": "Effector (signal amplifier)", "correct": false, "why": "Effector (signal amplifier): An enzyme, ion channel or transport protein that creates, moves or degrades a small molecule or ions, e.g., adenylate cyclase (AC), phospholipase C (PLC). It amplifies the signal; frequently the proximal effector protein is not the ultimate physiological target."}, {"t": "Ligand", "correct": false, "why": "Ligand: A chemical that a receptor recognizes and binds by its shape, size and other properties: endogenous (a hormone or neurotransmitter) or exogenous (a drug, a supplement, something eaten or drunk). A ligand induces a conformational change in the receptor."}, {"t": "Transducer", "correct": false, "why": "Transducer: The component that translates, integrates and coordinates the signal from the activated receptor, e.g., the G protein."}], "teach": "Regulatory proteins involved in the transfer of chemical information carried by endogenous or exogenous mediators. Classified by the structure of the receptor protein and its transduction components: ion channels, 7-transmembrane (GPCR), 1-transmembrane (tyrosine kinases) and intracellular/nuclear receptors. His picture: the gatekeeper that senses hormones, neurotransmitters and drugs; the message the receptor creates is the physiological response. Receptors come in two flavors, active or inactive."},

tion carried by endogenous or exogenous mediators. Classified by the structure of the receptor protein and its transduction components: ion channels, 7-transmembrane (GPCR), 1-transmembrane (tyrosine kinases) and intracellular/nuclear receptors. His picture: the gatekeeper that senses hormones, neurotransmitters and drugs; the message the receptor creates is the physiological response. Receptors come in two flavors, active or inactive.", "dupOf": "T-receptor-1"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-ligand", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~26, ~30; transcript 9/23; transcript 9/24", "quote": "Cells have receptors that recognize specific chemicals ... Endogenous as well as exogenous", "id": "T-ligand-1", "stem": "Which term is defined as: A chemical that a receptor recognizes and binds by its shape, size and other properties: endogenous (a hormone or neurotransmitter) or exogenous (a drug, a supplement, something eaten or drunk). A ligand induces a conformational change in the receptor?", "options": [{"t": "Ligand", "correct": true, "why": "This is the definition of Ligand."}, {"t": "Receptor", "correct": false, "why": "Receptor: Regulatory proteins involved in the transfer of chemical information carried by endogenous or exogenous mediators. Classified by the structure of the receptor protein and its transduction components: ion channels, 7-transmembrane (GPCR), 1-transmembrane (tyrosine kinases) and intracellular/nuclear receptors."}, {"t": "Drug", "correct": false, "why": "Drug: A chemical substance that alters an ongoing physiological or pathological function by interacting with components of a biological system. Drugs initiate, inhibit or modulate a response; they do not create anything new."}, {"t": "Mechanism of action (MOA)", "correct": false, "why": "Mechanism of action (MOA): What the drug does at its receptor: which receptor it binds and whether it activates, inhibits or just binds (e.g., metoprolol: reversible β1 receptor antagonist). The must-know for every drug on Exam 1."}], "teach": "A chemical that a receptor recognizes and binds by its shape, size and other properties: endogenous (a hormone or neurotransmitter) or exogenous (a drug, a supplement, something eaten or drunk). A ligand induces a conformational change in the receptor. Multiple chemicals may bind the same receptor actions. Every option on his NDS poll was incorrect: labels cannot claim cure, the FDA does not test them like prescription drugs, centuries of use does not prove safety and effectiveness, and herbals interact with prescription/OTC drugs.", "dupOf": "T-nds-1"},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-selectivity", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~21, ~29; transcript 9/22; transcript 9/24", "quote": "the larger the dose gets, the less selective a drug becomes ... Metoprolol is a beta 1 selective up to about 200 mg. Once you go above 200, you start to affect the beta 2s, so you start to lose selectivity", "id": "T-selectivity-1", "stem": "Which term is defined as: How narrowly a drug binds one receptor type rather than others: loratadine is a selective H1 inverse agonist; diphenhydramine binds H1, H2 and muscarinic receptors and is very non-selective. The less selective a drug is, the more effects and side effects it produces?", "options": [{"t": "Selectivity", "correct": true, "why": "This is the definition of Selectivity."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}, {"t": "Affinity", "correct": false, "why": "Affinity: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity."}, {"t": "Site of action (SOA)", "correct": false, "why": "Site of action (SOA): Where the receptor the drug acts on is located (metoprolol: heart, kidneys and brain; thiazides: distal convoluted tubule). Knowing MOA plus SOA lets you predict the effect, side effects and drug–drug interactions without memorizing them."}], "teach": "How narrowly a drug binds one receptor type rather than others: loratadine is a selective H1 inverse agonist; diphenhydramine binds H1, H2 and muscarinic receptors and is very non-selective. The less selective a drug is, the more effects and side effects it produces. The larger the dose gets, the less selective a drug becomes (metoprolol is β1-selective up to about 200 mg, then affects β2). Selectivity is about which receptors are bound; affinity is how tightly."},

 others: loratadine is a selective H1 inverse agonist; diphenhydramine binds H1, H2 and muscarinic receptors and is very non-selective. The less selective a drug is, the more effects and side effects it produces. The larger the dose gets, the less selective a drug becomes (metoprolol is β1-selective up to about 200 mg, then affects β2). Selectivity is about which receptors are bound; affinity is how tightly.", "dupOf": "T-selectivity-1"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-affinity", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~31, ~55; Pharmacodynamics-Day-1-2026s.pdf slides ~21, ~37; transcript 9/22; transcript 9/23", "quote": "Remember, affinity is how likely a drug is to bind and stay bound to a receptor, and the binding of a drug to the receptor is going to be depending on what type of bonds they form covalent bonds, hydrogen bonds, ion bonds.", "id": "T-affinity-1", "stem": "Which term is defined as: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity?", "options": [{"t": "Affinity", "correct": true, "why": "This is the definition of Affinity."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}, {"t": "Kd (dissociation constant)", "correct": false, "why": "Kd (dissociation constant): The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional."}], "teach": "The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity. Affinity is read on the x-axis (further left = higher affinity); efficacy on the y-axis. Poll trap: “the ability of a drug to bind and stay bound to a receptor” is affinity, not efficacy.", "fg": "binding-kd"},

ity: they are inversely proportional.", "correct": false, "why": "That defines kd (dissociation constant)."}], "teach": "The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity. Affinity is read on the x-axis (further left = higher affinity); efficacy on the y-axis. Poll trap: “the ability of a drug to bind and stay bound to a receptor” is affinity, not efficacy.", "dupOf": "T-affinity-1", "fg": "binding-kd"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-efficacy", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~31; Pharmacodynamics-Day_3_2026s.pdf slides ~19, ~26; Pharmacodynamics-Day-1-2026s.pdf slide ~38; transcript 9/22; transcript 9/23", "quote": "Efficacy is the ability of that drug to change the receptor behavior. It’s activity, its state from active to inactive or inactive to active, right?", "id": "T-efficacy-1", "stem": "Which term is defined as: The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist?", "options": [{"t": "Efficacy (intrinsic efficacy)", "correct": true, "why": "This is the definition of Efficacy (intrinsic efficacy)."}, {"t": "Dose–response curve (DRC / CRC)", "correct": false, "why": "Dose–response curve (DRC / CRC): A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency."}, {"t": "Affinity", "correct": false, "why": "Affinity: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity."}, {"t": "Intrinsic activity", "correct": false, "why": "Intrinsic activity: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0."}], "teach": "The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist. Read on the y-axis as the height of the curve (Emax). Efficacy cannot be calculated directly; it is a relative measurement between ligands.", "fg": "efficacy"},

e receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist. Read on the y-axis as the height of the curve (Emax). Efficacy cannot be calculated directly; it is a relative measurement between ligands.", "dupOf": "T-efficacy-1", "fg": "efficacy"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-intrinsic-activity", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~24–~26; Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22; transcript 9/24", "quote": "What he did not count was for the tissue, how many receptors are present in that system. So this is an incomplete theory that we can’t really use much", "id": "T-intrinsic-activity-1", "stem": "Which term is defined as: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0?", "options": [{"t": "Intrinsic activity", "correct": true, "why": "This is the definition of Intrinsic activity."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}, {"t": "Receptor occupancy theory", "correct": false, "why": "Receptor occupancy theory: Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction."}, {"t": "Law of mass action", "correct": false, "why": "Law of mass action: The rate of a chemical reaction is proportional to the concentration (mass) of the reactants: the more drug or the more receptors present, the greater the chance of binding. It is the basis of Kd and of dose responsiveness."}], "teach": "Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0. It does not account for the tissue (how many receptors are present), so it is incomplete; efficacy is the more comprehensive term. The names and the formula are not tested."},

 1, partial agonist between 0 and 1, antagonist = 0. It does not account for the tissue (how many receptors are present), so it is incomplete; efficacy is the more comprehensive term. The names and the formula are not tested.", "dupOf": "T-intrinsic-activity-1"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-kd", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~45–~50; Pharmacodynamics-Day_3_2026s.pdf slide ~31; transcript 9/24", "quote": "So the take-home message is that the smaller the coefficient of dissociation is, the more drugs receptors are going to find together, and thus the greater the affinity is going to be.", "id": "T-kd-1", "stem": "Which term is defined as: The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional?", "options": [{"t": "Kd (dissociation constant)", "correct": true, "why": "This is the definition of Kd (dissociation constant)."}, {"t": "Allosteric site / modulator", "correct": false, "why": "Allosteric site / modulator: A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once."}, {"t": "EC50 / ED50", "correct": false, "why": "EC50 / ED50: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)."}, {"t": "Affinity", "correct": false, "why": "Affinity: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity."}], "teach": "The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional. Kd is read on the x-axis of a binding curve and says nothing about effect; EC50 is 50% of the response. Compare Kd values only after converting units (milli 10^-3, micro 10^-6, nano 10^-9): “the units ... about 10% of you are gonna miss it.”", "fg": "binding-kd"},

ch": "The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional. Kd is read on the x-axis of a binding curve and says nothing about effect; EC50 is 50% of the response. Compare Kd values only after converting units (milli 10^-3, micro 10^-6, nano 10^-9): “the units ... about 10% of you are gonna miss it.”", "dupOf": "T-kd-1", "fg": "binding-kd"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-binding-curve", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~50; Pharmacodynamics-Day_3_2026s.pdf slide ~3; transcript 9/24", "quote": "And the further the left you are, the smaller the dose is going to be required, and thus the more affinity a drug is gonna have for the receptor.", "id": "T-binding-curve-1", "stem": "Which term is defined as: Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity?", "options": [{"t": "Binding curve (Bmax)", "correct": true, "why": "This is the definition of Binding curve (Bmax)."}, {"t": "Dose–response curve (DRC / CRC)", "correct": false, "why": "Dose–response curve (DRC / CRC): A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency."}, {"t": "Kd (dissociation constant)", "correct": false, "why": "Kd (dissociation constant): The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional."}, {"t": "Intrinsic activity", "correct": false, "why": "Intrinsic activity: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0."}], "teach": "Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity. A binding curve shows binding only; a dose–response curve shows effect (Emax, EC50). Drug C “requires less dose to bind 50% of the receptors” so it has the highest affinity.", "fg": "binding-kd"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-binding-curve", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~50; Pharmacodynamics-Day_3_2026s.pdf slide ~3; transcript 9/24", "quote": "And the further the left you are, the smaller the dose is going to be required, and thus the more affinity a drug is gonna have for the receptor.", "id": "T-binding-curve-2", "stem": "What does the term \"Binding curve (Bmax)\" mean?", "options": [{"t": "Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity.", "correct": true, "why": "This is the definition of Binding curve (Bmax)."}, {"t": "A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency.", "correct": false, "why": "That defines dose–response curve (drc / crc)."}, {"t": "The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional.", "correct": false, "why": "That defines kd (dissociation constant)."}, {"t": "Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0.", "correct": false, "why": "That defines intrinsic activity."}], "teach": "Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity. A binding curve shows binding only; a dose–response curve shows effect (Emax, EC50). Drug C “requires less dose to bind 50% of the receptors” so it has the highest affinity.", "dupOf": "T-binding-curve-1", "fg": "binding-kd"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-mass-action", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~45; transcript 9/24", "quote": "The more I have either of the receptors or the more I have either the drug, the greater the capacity of binding to something is going to be, right?", "id": "T-mass-action-1", "stem": "Which term is defined as: The rate of a chemical reaction is proportional to the concentration (mass) of the reactants: the more drug or the more receptors present, the greater the chance of binding. It is the basis of Kd and of dose responsiveness?", "options": [{"t": "Law of mass action", "correct": true, "why": "This is the definition of Law of mass action."}, {"t": "Kd (dissociation constant)", "correct": false, "why": "Kd (dissociation constant): The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional."}, {"t": "Receptor occupancy theory", "correct": false, "why": "Receptor occupancy theory: Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction."}, {"t": "Binding curve (Bmax)", "correct": false, "why": "Binding curve (Bmax): Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity."}], "teach": "The rate of a chemical reaction is proportional to the concentration (mass) of the reactants: the more drug or the more receptors present, the greater the chance of binding. It is the basis of Kd and of dose responsiveness. More receptors in a tissue make the same dose of norepinephrine appear more potent (curve shifts left) while its Kd, affinity and efficacy are unchanged; what changed is the tissue."},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-mass-action", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~45; transcript 9/24", "quote": "The more I have either of the receptors or the more I have either the drug, the greater the capacity of binding to something is going to be, right?", "id": "T-mass-action-2", "stem": "What does the term \"Law of mass action\" mean?", "options": [{"t": "The rate of a chemical reaction is proportional to the concentration (mass) of the reactants: the more drug or the more receptors present, the greater the chance of binding. It is the basis of Kd and of dose responsiveness.", "correct": true, "why": "This is the definition of Law of mass action."}, {"t": "The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional.", "correct": false, "why": "That defines kd (dissociation constant)."}, {"t": "Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction.", "correct": false, "why": "That defines receptor occupancy theory."}, {"t": "Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity.", "correct": false, "why": "That defines binding curve (bmax)."}], "teach": "The rate of a chemical reaction is proportional to the concentration (mass) of the reactants: the more drug or the more receptors present, the greater the chance of binding. It is the basis of Kd and of dose responsiveness. More receptors in a tissue make the same dose of norepinephrine appear more potent (curve shifts left) while its Kd, affinity and efficacy are unchanged; what changed is the tissue.", "dupOf": "T-mass-action-1"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-covalent-bond", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~15–~16; transcript 9/23; transcript 9/24", "quote": "They can be classified as irreversible, insurmountable, and non-competitive, which means is They all mean the same thing ... What does that mean? Once they are bound, they’re not coming off, OK?", "id": "T-covalent-bond-1", "stem": "Which term is defined as: Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive?", "options": [{"t": "Covalent (irreversible) bond", "correct": true, "why": "This is the definition of Covalent (irreversible) bond."}, {"t": "Irreversible (non-competitive) antagonist", "correct": false, "why": "Irreversible (non-competitive) antagonist: An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2)."}, {"t": "Affinity", "correct": false, "why": "Affinity: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity."}, {"t": "Intrinsic activity", "correct": false, "why": "Intrinsic activity: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0."}], "teach": "Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive. Aspirin, omeprazole and phenoxybenzamine form covalent bonds; a covalent binder has the highest affinity and the smallest Kd. Weak-bond drugs must fit the pocket like a hand in a glove, which is where selectivity comes from."},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-covalent-bond", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~15–~16; transcript 9/23; transcript 9/24", "quote": "They can be classified as irreversible, insurmountable, and non-competitive, which means is They all mean the same thing ... What does that mean? Once they are bound, they’re not coming off, OK?", "id": "T-covalent-bond-2", "stem": "What does the term \"Covalent (irreversible) bond\" mean?", "options": [{"t": "Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive.", "correct": true, "why": "This is the definition of Covalent (irreversible) bond."}, {"t": "A 1-transmembrane receptor linked to an intracellular enzyme: an extracellular binding domain outside and intrinsic enzymatic (catalytic) activity inside. Ligand binding to the inactive monomer induces dimerization, cross-phosphorylation of the kinase domains and docking sites for signaling complexes; a tyrosine phosphatase resets it. Receptors for insulin and growth factors (cell survival, proliferation, differentiation).", "correct": false, "why": "That defines receptor tyrosine kinase (rtk, 1-tm)."}, {"t": "An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2).", "correct": false, "why": "That defines irreversible (non-competitive) antagonist."}, {"t": "The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity.", "correct": false, "why": "That defines affinity."}], "teach": "Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive. Aspirin, omeprazole and phenoxybenzamine form covalent bonds; a covalent binder has the highest affinity and the smallest Kd. Weak-bond drugs must fit the pocket like a hand in a glove, which is where selectivity comes from.", "dupOf": "T-covalent-bond-1"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-orthosteric", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~18–~19; transcript 9/23; transcript 9/24", "quote": "How we define orthostatic. So they compete for the same binding pocket, right? ... with orthostatic, we can have either one or the other, not both at the same time. As with allosteric, we can have one in the other", "id": "T-orthosteric-1", "stem": "Which term is defined as: The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both?", "options": [{"t": "Orthosteric site", "correct": true, "why": "This is the definition of Orthosteric site."}, {"t": "Allosteric site / modulator", "correct": false, "why": "Allosteric site / modulator: A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once."}, {"t": "Two-state model", "correct": false, "why": "Two-state model: Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}], "teach": "The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both. Orthosteric: one or the other. Allosteric: one and the other. Spoken as “orthostatic” in the transcripts; the slide term is orthosteric.", "fg": "sites"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-orthosteric", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~18–~19; transcript 9/23; transcript 9/24", "quote": "How we define orthostatic. So they compete for the same binding pocket, right? ... with orthostatic, we can have either one or the other, not both at the same time. As with allosteric, we can have one in the other", "id": "T-orthosteric-2", "stem": "What does the term \"Orthosteric site\" mean?", "options": [{"t": "The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both.", "correct": true, "why": "This is the definition of Orthosteric site."}, {"t": "A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once.", "correct": false, "why": "That defines allosteric site / modulator."}, {"t": "Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy.", "correct": false, "why": "That defines two-state model."}, {"t": "The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist.", "correct": false, "why": "That defines efficacy (intrinsic efficacy)."}], "teach": "The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both. Orthosteric: one or the other. Allosteric: one and the other. Spoken as “orthostatic” in the transcripts; the slide term is orthosteric.", "dupOf": "T-orthosteric-1", "fg": "sites"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-allosteric", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~19–~20, ~39, ~44; Pharmacodynamics-Day-1-2026s.pdf slide ~29; transcript 9/22; transcript 9/23", "quote": "These drugs do not bind or compete for the orthostatic binding pocket. They bind someplace else on the receptor.", "id": "T-allosteric-1", "stem": "Which term is defined as: A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once?", "options": [{"t": "Allosteric site / modulator", "correct": true, "why": "This is the definition of Allosteric site / modulator."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}, {"t": "Orthosteric site", "correct": false, "why": "Orthosteric site: The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both."}, {"t": "Indirect antagonist", "correct": false, "why": "Indirect antagonist: A drug that inhibits the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS."}], "teach": "A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once. “Where the magic in pharmacology is”: they don’t always do things by themselves but make other drugs much better or much worse. Poll traps: allosteric agonists do not compete for the orthosteric pocket and do not have the highest affinity for it.", "fg": "classes"},
