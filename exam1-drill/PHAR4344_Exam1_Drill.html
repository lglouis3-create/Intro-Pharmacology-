ct, side effects and drug–drug interactions without memorizing them. Classifying a drug by chemical structure (benzothiadiazine ring) predicts little; MOA plus SOA (Na+/Cl− symporter antagonist at the distal tubule) predicts diuresis and hyponatremia.", "dupOf": "T-soa-1"},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-nds", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~15–~16, ~18, ~20; transcript 9/22", "quote": "Dietary supplements regulated as food ... Not Drugs (Less FDA oversight) ... until they cause harm", "id": "T-nds-1", "stem": "Which term is defined as: A product regulated as food, not as a drug, so with less FDA oversight; it stays on the market until it causes harm. Its label cannot state that it treats, cures, diagnoses or prevents disease, and natural does not mean safe or free of drug interactions?", "options": [{"t": "Natural dietary supplement (NDS)", "correct": true, "why": "This is the definition of Natural dietary supplement (NDS)."}, {"t": "Negative allosteric modulator (NAM)", "correct": false, "why": "Negative allosteric modulator (NAM): The literature name for an allosteric antagonist: binds reversibly at another site in the receptor and decreases the agonist’s affinity, efficacy or both. The positive allosteric modulator (PAM) is the allosteric agonist and does the opposite."}, {"t": "Drug", "correct": false, "why": "Drug: A chemical substance that alters an ongoing physiological or pathological function by interacting with components of a biological system. Drugs initiate, inhibit or modulate a response; they do not create anything new."}, {"t": "Pharmacodynamics (PD)", "correct": false, "why": "Pharmacodynamics (PD): The study of the biochemical and physiological effects of drugs and their mechanisms of action. General rules: the drug must reach the site of action, must bind to and interact with a receptor, and does not create anything but changes the ongoing physiological system."}], "teach": "A product regulated as food, not as a drug, so with less FDA oversight; it stays on the market until it causes harm. Its label cannot state that it treats, cures, diagnoses or prevents disease, and natural does not mean safe or free of drug interactions. Every option on his NDS poll was incorrect: labels cannot claim cure, the FDA does not test them like prescription drugs, centuries of use does not prove safety and effectiveness, and herbals interact with prescription/OTC drugs."},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-nds", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~15–~16, ~18, ~20; transcript 9/22", "quote": "Dietary supplements regulated as food ... Not Drugs (Less FDA oversight) ... until they cause harm", "id": "T-nds-2", "stem": "What does the term \"Natural dietary supplement (NDS)\" mean?", "options": [{"t": "A product regulated as food, not as a drug, so with less FDA oversight; it stays on the market until it causes harm. Its label cannot state that it treats, cures, diagnoses or prevents disease, and natural does not mean safe or free of drug interactions.", "correct": true, "why": "This is the definition of Natural dietary supplement (NDS)."}, {"t": "The study of the biochemical and physiological effects of drugs and their mechanisms of action. General rules: the drug must reach the site of action, must bind to and interact with a receptor, and does not create anything but changes the ongoing physiological system.", "correct": false, "why": "That defines pharmacodynamics (pd)."}, {"t": "A chemical substance that alters an ongoing physiological or pathological function by interacting with components of a biological system. Drugs initiate, inhibit or modulate a response; they do not create anything new.", "correct": false, "why": "That defines drug."}, {"t": "Where the receptor the drug acts on is located (metoprolol: heart, kidneys and brain; thiazides: distal convoluted tubule). Knowing MOA plus SOA lets you predict the effect, side effects and drug–drug interactions without memorizing them.", "correct": false, "why": "That defines site of action (soa)."}], "teach": "A product regulated as food, not as a drug, so with less FDA oversight; it stays on the market until it causes harm. Its label cannot state that it treats, cures, diagnoses or prevents disease, and natural does not mean safe or free of drug interactions. Every option on his NDS poll was incorrect: labels cannot claim cure, the FDA does not test them like prescription drugs, centuries of use does not prove safety and effectiveness, and herbals interact with prescription/OTC drugs.", "dupOf": "T-nds-1"},
{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g1", "skill": "term", "concept": "term-selectivity", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slides ~21, ~29; transcript 9/22; transcript 9/24", "quote": "the larger the dose gets, the less selective a drug becomes ... Metoprolol is a beta 1 selective up to about 200 mg. Once you go above 200, you start to affect the beta 2s, so you start to lose selectivity", "id": "T-selectivity-1", "stem": "Which term is defined as: How narrowly a drug binds one receptor type rather than others: loratadine is a selective H1 inverse agonist; diphenhydramine binds H1, H2 and muscarinic receptors and is very non-selective. The less selective a drug is, the more effects and side effects it produces?", "options": [{"t": "Selectivity", "correct": true, "why": "This is the definition of Selectivity."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}, {"t": "Affinity", "correct": false, "why": "Affinity: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity."}, {"t": "Natural dietary supplement (NDS)", "correct": false, "why": "Natural dietary supplement (NDS): A product regulated as food, not as a drug, so with less FDA oversight; it stays on the market until it causes harm. Its label cannot state that it treats, cures, diagnoses or prevents disease, and natural does not mean safe or free of drug interactions."}], "teach": "How narrowly a drug binds one receptor type rather than others: loratadine is a selective H1 inverse agonist; diphenhydramine binds H1, H2 and muscarinic receptors and is very non-selective. The less selective a drug is, the more effects and side effects it produces. The larger the dose gets, the less selective a drug becomes (metoprolol is β1-selective up to about 200 mg, then affects β2). Selectivity is about which receptors are bound; affinity is how tightly."},

ne receptor type rather than others: loratadine is a selective H1 inverse agonist; diphenhydramine binds H1, H2 and muscarinic receptors and is very non-selective. The less selective a drug is, the more effects and side effects it produces. The larger the dose gets, the less selective a drug becomes (metoprolol is β1-selective up to about 200 mg, then affects β2). Selectivity is about which receptors are bound; affinity is how tightly.", "dupOf": "T-selectivity-1"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-affinity", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~31, ~55; Pharmacodynamics-Day-1-2026s.pdf slides ~21, ~37; transcript 9/22; transcript 9/23", "quote": "Remember, affinity is how likely a drug is to bind and stay bound to a receptor, and the binding of a drug to the receptor is going to be depending on what type of bonds they form covalent bonds, hydrogen bonds, ion bonds.", "id": "T-affinity-1", "stem": "Which term is defined as: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity?", "options": [{"t": "Affinity", "correct": true, "why": "This is the definition of Affinity."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}, {"t": "Potency (pharmacological)", "correct": false, "why": "Potency (pharmacological): Potency = EC50 or ED50: how much drug is needed for a given response, read on the x-axis (further left = more potent). It is a combination of affinity, efficacy and the tissue (cell/tissue/organ/organism, e.g., number of receptors); the Day 1 slide lists tissue sensitivity, receptor number, receptor activity, affinity and efficacy."}, {"t": "Kd (dissociation constant)", "correct": false, "why": "Kd (dissociation constant): The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional."}], "teach": "The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity. Affinity is read on the x-axis (further left = higher affinity); efficacy on the y-axis. Poll trap: “the ability of a drug to bind and stay bound to a receptor” is affinity, not efficacy.", "fg": "binding-kd"},

{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-efficacy", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~31; Pharmacodynamics-Day_3_2026s.pdf slides ~19, ~26; Pharmacodynamics-Day-1-2026s.pdf slide ~38; transcript 9/22; transcript 9/23", "quote": "Efficacy is the ability of that drug to change the receptor behavior. It’s activity, its state from active to inactive or inactive to active, right?", "id": "T-efficacy-1", "stem": "Which term is defined as: The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist?", "options": [{"t": "Efficacy (intrinsic efficacy)", "correct": true, "why": "This is the definition of Efficacy (intrinsic efficacy)."}, {"t": "Competitive (reversible) antagonist", "correct": false, "why": "Competitive (reversible) antagonist: An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1."}, {"t": "Affinity", "correct": false, "why": "Affinity: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity."}, {"t": "Intrinsic activity", "correct": false, "why": "Intrinsic activity: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0."}], "teach": "The property of a molecule that causes the receptor {"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-intrinsic-activity", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~24–~26; Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22; transcript 9/24", "quote": "What he did not count was for the tissue, how many receptors are present in that system. So this is an incomplete theory that we can’t really use much", "id": "T-intrinsic-activity-1", "stem": "Which term is defined as: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0?", "options": [{"t": "Intrinsic activity", "correct": true, "why": "This is the definition of Intrinsic activity."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}, {"t": "Receptor occupancy theory", "correct": false, "why": "Receptor occupancy theory: Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction."}, {"t": "Law of mass action", "correct": false, "why": "Law of mass action: The rate of a chemical reaction is proportional to the concentration (mass) of the reactants: the more drug or the more receptors present, the greater the chance of binding. It is the basis of Kd and of dose responsiveness."}], "teach": "Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0. It does not account for the tissue (how many receptors are present), so it is incomplete; efficacy is the more comprehensive term. The names and the formula are not tested."},

 1, partial agonist between 0 and 1, antagonist = 0. It does not account for the tissue (how many receptors are present), so it is incomplete; efficacy is the more comprehensive term. The names and the formula are not tested.", "dupOf": "T-intrinsic-activity-1"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-kd", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~45–~50; Pharmacodynamics-Day_3_2026s.pdf slide ~31; transcript 9/24", "quote": "So the take-home message is that the smaller the coefficient of dissociation is, the more drugs receptors are going to find together, and thus the greater the affinity is going to be.", "id": "T-kd-1", "stem": "Which term is defined as: The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional?", "options": [{"t": "Kd (dissociation constant)", "correct": true, "why": "This is the definition of Kd (dissociation constant)."}, {"t": "Allosteric site / modulator", "correct": false, "why": "Allosteric site / modulator: A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once."}, {"t": "EC50 / ED50", "correct": false, "why": "EC50 / ED50: EC50: the effective concentration that produces 50% of a drug’s maximal response (in vitro). ED50: the effective dose that produces 50% of the response (in vivo). It is the indicator of potency: the smaller the EC50/ED50, the greater the potency (inversely proportional)."}, {"t": "Affinity", "correct": false, "why": "Affinity: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity."}], "teach": "The coefficient {"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-binding-curve", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~50; Pharmacodynamics-Day_3_2026s.pdf slide ~3; transcript 9/24", "quote": "And the further the left you are, the smaller the dose is going to be required, and thus the more affinity a drug is gonna have for the receptor.", "id": "T-binding-curve-1", "stem": "Which term is defined as: Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity?", "options": [{"t": "Binding curve (Bmax)", "correct": true, "why": "This is the definition of Binding curve (Bmax)."}, {"t": "Dose–response curve (DRC / CRC)", "correct": false, "why": "Dose–response curve (DRC / CRC): A graph relating drug dose (DRC) or concentration (CRC) on the x-axis (independent variable, log units, sigmoid curve) to the intensity of effect on the y-axis (dependent variable, normalized as % of maximum response). It is the model used to predict and compare drugs and determine potency."}, {"t": "Kd (dissociation constant)", "correct": false, "why": "Kd (dissociation constant): The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional."}, {"t": "Intrinsic activity", "correct": false, "why": "Intrinsic activity: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0."}], "teach": "Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity. A binding curve shows binding only; a dose–response curve shows effect (Emax, EC50). Drug C “requires less dose to bind 50% of the receptors” so it has the highest affinity.", "fg": "binding-kd"},

{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-mass-action", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~45; transcript 9/24", "quote": "The more I have either of the receptors or the more I have either the drug, the greater the capacity of binding to something is going to be, right?", "id": "T-mass-action-1", "stem": "Which term is defined as: The rate of a chemical reaction is proportional to the concentration (mass) of the reactants: the more drug or the more receptors present, the greater the chance of binding. It is the basis of Kd and of dose responsiveness?", "options": [{"t": "Law of mass action", "correct": true, "why": "This is the definition of Law of mass action."}, {"t": "Kd (dissociation constant)", "correct": false, "why": "Kd (dissociation constant): The coefficient of dissociation (also written Ki, Ka): the drug concentration that binds 50% of the available binding sites. From the law of mass action, Kd = [D][R]/[DR] = K2/K1 (rate of dissociation over rate of association). The smaller the Kd, the greater the affinity: they are inversely proportional."}, {"t": "Receptor occupancy theory", "correct": false, "why": "Receptor occupancy theory: Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction."}, {"t": "Binding curve (Bmax)", "correct": false, "why": "Binding curve (Bmax): Percent of receptors bound (0% up to Bmax, 100% of the receptors) plotted against log[concentration]. Kd is the concentration at 50% bound, read on the x-axis; the curve furthest left has the smallest Kd and the highest affinity."}], "teach": "The rate of a chemical reaction is proportional to the concentration (mass) of the reactants: the more drug or the more receptors present, the greater the chance of binding. It is the basis of Kd and of dose responsiveness. More receptors in a tissue make the same dose of norepinephrine appear more potent (curve shifts left) while its Kd, affinity and efficacy are unchanged; what changed is the tissue."},

{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-covalent-bond", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~15–~16; transcript 9/23; transcript 9/24", "quote": "They can be classified as irreversible, insurmountable, and non-competitive, which means is They all mean the same thing ... What does that mean? Once they are bound, they’re not coming off, OK?", "id": "T-covalent-bond-1", "stem": "Which term is defined as: Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive?", "options": [{"t": "Covalent (irreversible) bond", "correct": true, "why": "This is the definition of Covalent (irreversible) bond."}, {"t": "Irreversible (non-competitive) antagonist", "correct": false, "why": "Irreversible (non-competitive) antagonist: An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2)."}, {"t": "Affinity", "correct": false, "why": "Affinity: The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity."}, {"t": "Intrinsic activity", "correct": false, "why": "Intrinsic activity: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0."}], "teach": "Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive. Aspirin, omeprazole and phenoxybenzamine form covalent bonds; a covalent binder has the highest affinity and the smallest Kd. Weak-bond drugs must fit the pocket like a hand in a glove, which is where selectivity comes from."},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-covalent-bond", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~15–~16; transcript 9/23; transcript 9/24", "quote": "They can be classified as irreversible, insurmountable, and non-competitive, which means is They all mean the same thing ... What does that mean? Once they are bound, they’re not coming off, OK?", "id": "T-covalent-bond-2", "stem": "What does the term \"Covalent (irreversible) bond\" mean?", "options": [{"t": "Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive.", "correct": true, "why": "This is the definition of Covalent (irreversible) bond."}, {"t": "Surmountable: an antagonist that the agonist can overcome by increasing its concentration, because the antagonist binds and comes off (competitive = reversible = surmountable). Insurmountable: cannot be overcome by increasing the agonist concentration, because the antagonist binds irreversibly (irreversible = insurmountable = nonequilibrium-competitive = non-competitive).", "correct": false, "why": "That defines surmountable / insurmountable."}, {"t": "An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2).", "correct": false, "why": "That defines irreversible (non-competitive) antagonist."}, {"t": "The attraction of a ligand for the receptor: how likely a drug is to bind and stay bound. It depends on the molecular forces (bonds) the drug forms with the receptor and is measured by Kd: the smaller the Kd, the greater the affinity.", "correct": false, "why": "That defines affinity."}], "teach": "Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive. Aspirin, omeprazole and phenoxybenzamine form covalent bonds; a covalent binder has the highest affinity and the smallest Kd. Weak-bond drugs must fit the pocket like a hand in a glove, which is where selectivity comes from.", "dupOf": "T-covalent-bond-1"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-orthosteric", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~18–~19; transcript 9/23; transcript 9/24", "quote": "How we define orthostatic. So they compete for the same binding pocket, right? ... with orthostatic, we can have either one or the other, not both at the same time. As with allosteric, we can have one in the other", "id": "T-orthosteric-1", "stem": "Which term is defined as: The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both?", "options": [{"t": "Orthosteric site", "correct": true, "why": "This is the definition of Orthosteric site."}, {"t": "Allosteric site / modulator", "correct": false, "why": "Allosteric site / modulator: A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once."}, {"t": "Two-state model", "correct": false, "why": "Two-state model: Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}], "teach": "The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both. Orthosteric: one or the other. Allosteric: one and the other. Spoken as “orthostatic” in the transcripts; the slide term is orthosteric.", "fg": "sites"},

teach": "The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both. Orthosteric: one or the other. Allosteric: one and the other. Spoken as “orthostatic” in the transcripts; the slide term is orthosteric.", "dupOf": "T-orthosteric-1", "fg": "sites"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-allosteric", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~19–~20, ~39, ~44; Pharmacodynamics-Day-1-2026s.pdf slide ~29; transcript 9/22; transcript 9/23", "quote": "These drugs do not bind or compete for the orthostatic binding pocket. They bind someplace else on the receptor.", "id": "T-allosteric-1", "stem": "Which term is defined as: A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once?", "options": [{"t": "Allosteric site / modulator", "correct": true, "why": "This is the definition of Allosteric site / modulator."}, {"t": "Efficacy (intrinsic efficacy)", "correct": false, "why": "Efficacy (intrinsic efficacy): The property of a molecule that causes the receptor to change its behavior: the ability of the drug to change the receptor state, active to inactive or inactive to active. Positive efficacy activates receptors, negative efficacy shuts them down, and zero efficacy is a neutral antagonist."}, {"t": "Orthosteric site", "correct": false, "why": "Orthosteric site: The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both."}, {"t": "Indirect antagonist", "correct": false, "why": "Indirect antagonist: A drug that inhibits the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS."}], "teach": "A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once. “Where the magic in pharmacology is”: they don’t always do things by themselves but make other drugs much better or much worse. Poll traps: allosteric agonists do not compete for the orthosteric pocket and do not have the highest affinity for it.", "fg": "classes"},

{"lecture": "L01", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-occupancy-theory", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22", "quote": "a full agonist will produce 100% of the response as a partial may produce a 70% of the response because it can only occupy 70% of the receptors, right? So it’s based on occupancy.", "id": "T-occupancy-theory-1", "stem": "Which term is defined as: Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction?", "options": [{"t": "Receptor occupancy theory", "correct": true, "why": "This is the definition of Receptor occupancy theory."}, {"t": "Covalent (irreversible) bond", "correct": false, "why": "Covalent (irreversible) bond: Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive."}, {"t": "Intrinsic activity", "correct": false, "why": "Intrinsic activity: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0."}, {"t": "Two-state model", "correct": false, "why": "Two-state model: Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy."}], "teach": "Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction. It could not explain antagonists or inverse agonists. Ariëns added intrinsic activity; Stephenson, Furchgott and Nickerson added efficacy and the two-state model. The names are FYI, not tested."},

al to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction. It could not explain antagonists or inverse agonists. Ariëns added intrinsic activity; Stephenson, Furchgott and Nickerson added efficacy and the two-state model. The names are FYI, not tested.", "dupOf": "T-occupancy-theory-1"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g2", "skill": "term", "concept": "term-two-state", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slide ~31; Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22; transcript 9/23", "quote": "So this two-state model shows that we have receptor two confirmations, active and inactive, and that drugs can shift them once bound to the receptor from one confirmation to the other.", "id": "T-two-state-1", "stem": "Which term is defined as: Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy?", "options": [{"t": "Two-state model", "correct": true, "why": "This is the definition of Two-state model."}, {"t": "Receptor occupancy theory", "correct": false, "why": "Receptor occupancy theory: Clark’s first theory of how drugs work: the response is proportional to the number of receptors occupied, so it rests on affinity alone (D + R ⇄ DR → stimulus). A full agonist occupies all receptors for 100% of the response; a partial agonist occupies a fraction (e.g., 70%) and gives that fraction."}, {"t": "Intrinsic activity", "correct": false, "why": "Intrinsic activity: Ariëns’ number for the ability of a drug to produce a response, dependent on its chemical structure: full agonist = 1, partial agonist between 0 and 1, antagonist = 0."}, {"t": "Orthosteric site", "correct": false, "why": "Orthosteric site: The receptor’s own binding pocket, where the endogenous agonist binds. Orthosteric drugs (phenylephrine, prazosin, phenoxybenzamine at α1) compete for that one pocket, so only one can be bound at a time: either one or the other, not both."}], "teach": "Receptors exist in two states, inactive/resting (R) and active (R*), and move between them on their own; L is the equilibrium constant between [R] and [R*]. Drugs have affinity for R and/or R* (Kd and Kd*) and shift the balance: toward R* is positive efficacy, toward R is negative efficacy. “This is gonna be home for us.” It explains inverse agonists, which occupancy theory could not. Most receptors sit in the inactive state to save energy.", "fg": "two-state"},

{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-full-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~33–~41; Pharmacodynamics-Day_2_2026s copy.pdf slides ~32–~34; transcript 9/23; transcript 9/24", "quote": "Let’s think about that we can dim, so we have one that can kind of go full bright or just halfway bright, a full agonist or a partial.", "id": "T-full-agonist-1", "stem": "Which term is defined as: Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine?", "options": [{"t": "Full agonist", "correct": true, "why": "This is the definition of Full agonist."}, {"t": "Partial agonist", "correct": false, "why": "Partial agonist: Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2)."}, {"t": "Inverse agonist", "correct": false, "why": "Inverse agonist: Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1."}, {"t": "Competitive (reversible) antagonist", "correct": false, "why": "Competitive (reversible) antagonist: An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1."}], "teach": "Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine. Same affinity preference as a partial agonist; the difference is efficacy (100% vs 1–99%). “I do not know of any agonist that is irreversible.”", "fg": "classes"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-full-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~33–~41; Pharmacodynamics-Day_2_2026s copy.pdf slides ~32–~34; transcript 9/23; transcript 9/24", "quote": "Let’s think about that we can dim, so we have one that can kind of go full bright or just halfway bright, a full agonist or a partial.", "id": "T-full-agonist-2", "stem": "What does the term \"Full agonist\" mean?", "options": [{"t": "Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine.", "correct": true, "why": "This is the definition of Full agonist."}, {"t": "Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2).", "correct": false, "why": "That defines partial agonist."}, {"t": "Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1.", "correct": false, "why": "That defines inverse agonist."}, {"t": "An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1.", "correct": false, "why": "That defines competitive (reversible) antagonist."}], "teach": "Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine. Same affinity preference as a partial agonist; the difference is efficacy (100% vs 1–99%). “I do not know of any agonist that is irreversible.”", "dupOf": "T-full-agonist-1", "fg": "classes"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-partial-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~50–~65; Pharmacodynamics-Day_2_2026s copy.pdf slides ~32–~34; transcript 9/23; transcript 9/24", "quote": "So sometimes we may use a partial agonist over a full agonist because we don’t need to get the max effect. We just need to get enough of it.", "id": "T-partial-agonist-1", "stem": "Which term is defined as: Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2)?", "options": [{"t": "Partial agonist", "correct": true, "why": "This is the definition of Partial agonist."}, {"t": "Antagonist (neutral, reversible)", "correct": false, "why": "Antagonist (neutral, reversible): A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1)."}, {"t": "Full agonist", "correct": false, "why": "Full agonist: Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine."}, {"t": "Inverse agonist", "correct": false, "why": "Inverse agonist: Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1."}], "teach": "Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2). Dual nature: it may act as an agonist or an antagonist depending on the physiological state (varenicline during smoking vs withdrawal). A partial agonist can still be the most potent drug on a graph.", "fg": "classes"},
{"lecture": "L03", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-partial-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_3_2026s.pdf slides ~50–~65; Pharmacodynamics-Day_2_2026s copy.pdf slides ~32–~34; transcript 9/23; transcript 9/24", "quote": "So sometimes we may use a partial agonist over a full agonist because we don’t need to get the max effect. We just need to get enough of it.", "id": "T-partial-agonist-2", "stem": "What does the term \"Partial agonist\" mean?", "options": [{"t": "Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2).", "correct": true, "why": "This is the definition of Partial agonist."}, {"t": "Surmountable: an antagonist that the agonist can overcome by increasing its concentration, because the antagonist binds and comes off (competitive = reversible = surmountable). Insurmountable: cannot be overcome by increasing the agonist concentration, because the antagonist binds irreversibly (irreversible = insurmountable = nonequilibrium-competitive = non-competitive).", "correct": false, "why": "That defines surmountable / insurmountable."}, {"t": "Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine.", "correct": false, "why": "That defines full agonist."}, {"t": "A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1).", "correct": false, "why": "That defines antagonist (neutral, reversible)."}], "teach": "Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2). Dual nature: it may act as an agonist or an antagonist depending on the physiological state (varenicline during smoking vs withdrawal). A partial agonist can still be the most potent drug on a graph.", "dupOf": "T-partial-agonist-1", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-inverse-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~35–~36; Pharmacodynamics-Day-1-2026s.pdf slide ~28; transcript 9/22; transcript 9/23", "quote": "These drugs love to bind to receptors that are inactive and keep them inactive. But they have what is called negative efficacy, which means is if they bind to a receptor that is already active, producing a signal, once they are bound, they’re going to shut them off.", "id": "T-inverse-agonist-1", "stem": "Which term is defined as: Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1?", "options": [{"t": "Inverse agonist", "correct": true, "why": "This is the definition of Inverse agonist."}, {"t": "Antagonist (neutral, reversible)", "correct": false, "why": "Antagonist (neutral, reversible): A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1)."}, {"t": "Partial agonist", "correct": false, "why": "Partial agonist: Positive efficacy but lower than a full agonist (1–99%): it converts inactive receptors to active but cannot reach 100% of the system’s max response (Emax less than 100%) and cannot bring the response all the way to 100% or 0%. Examples: albuterol (β2), varenicline (Nn), pindolol (β1, β2), aripiprazole (D2)."}, {"t": "Full agonist", "correct": false, "why": "Full agonist: Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine."}], "teach": "Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1. Petri dish with 50% of receptors naturally active: an inverse agonist brings cAMP production to zero; a competitive (neutral) antagonist leaves it at 50%.", "fg": "classes"},

or receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1). “Just a straight line”: an antagonist does not change the balance of receptors; an inverse agonist wants to keep everybody inactive. Intrinsic activity of an antagonist is zero.", "dupOf": "T-neutral-antagonist-1", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-competitive-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~15–~16, ~18, ~37; transcript 9/23", "quote": "when we think about uh ionic bonds, hydrogen bonds, [van der Waals] bonds, those are going to be reversible, surmountable, competitive. Different words ... they’re gonna bind and they’re gonna come off.", "id": "T-competitive-antagonist-1", "stem": "Which term is defined as: An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1?", "options": [{"t": "Competitive (reversible) antagonist", "correct": true, "why": "This is the definition of Competitive (reversible) antagonist."}, {"t": "Irreversible (non-competitive) antagonist", "correct": false, "why": "Irreversible (non-competitive) antagonist: An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2)."}, {"t": "Antagonist (neutral, reversible)", "correct": false, "why": "Antagonist (neutral, reversible): A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1)."}, {"t": "Indirect antagonist", "correct": false, "why": "Indirect antagonist: A drug that inhibits the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS."}], "teach": "An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1. Every drug on the Exam 1 drug list is reversible and competitive except phenoxybenzamine (drug-list PDF). The rightward-shift curve is Day 4 material (deck preview slide ~68).", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-competitive-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~15–~16, ~18, ~37; transcript 9/23", "quote": "when we think about uh ionic bonds, hydrogen bonds, [van der Waals] bonds, those are going to be reversible, surmountable, competitive. Different words ... they’re gonna bind and they’re gonna come off.", "id": "T-competitive-antagonist-2", "stem": "What does the term \"Competitive (reversible) antagonist\" mean?", "options": [{"t": "An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1.", "correct": true, "why": "This is the definition of Competitive (reversible) antagonist."}, {"t": "Surmountable: an antagonist that the agonist can overcome by increasing its concentration, because the antagonist binds and comes off (competitive = reversible = surmountable). Insurmountable: cannot be overcome by increasing the agonist concentration, because the antagonist binds irreversibly (irreversible = insurmountable = nonequilibrium-competitive = non-competitive).", "correct": false, "why": "That defines surmountable / insurmountable."}, {"t": "An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2).", "correct": false, "why": "That defines irreversible (non-competitive) antagonist."}, {"t": "A drug with no efficacy (ε = zero) and equal affinity for receptors in the active and inactive state: it occupies the receptor and keeps agonists from binding but does not change the receptor’s state. All about affinity. Examples: prazosin (α1), metoprolol (β1).", "correct": false, "why": "That defines antagonist (neutral, reversible)."}], "teach": "An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1. Every drug on the Exam 1 drug list is reversible and competitive except phenoxybenzamine (drug-list PDF). The rightward-shift curve is Day 4 material (deck preview slide ~68).", "dupOf": "T-competitive-antagonist-1", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-irreversible-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~15, ~18, ~37–~38; transcript 9/23; transcript 9/24", "quote": "This is an irreversible antagonist, non-competitive, insurmountable. So what kind of bo[n]ds does it form? Covalent.", "id": "T-irreversible-antagonist-2", "stem": "What does the term \"Irreversible (non-competitive) antagonist\" mean?", "options": [{"t": "An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2).", "correct": true, "why": "This is the definition of Irreversible (non-competitive) antagonist."}, {"t": "An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1.", "correct": false, "why": "That defines competitive (reversible) antagonist."}, {"t": "Two atoms share a pair of electrons; the bond is irreversible at body temperature and gives a long duration of action. Covalent binding is called irreversible, insurmountable or non-competitive, three names for one property; ionic, hydrogen and van der Waals bonds are reversible, surmountable, competitive.", "correct": false, "why": "That defines covalent (irreversible) bond."}, {"t": "Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1.", "correct": false, "why": "That defines inverse agonist."}], "teach": "An antagonist that binds by a covalent bond, so once bound it does not come off at body temperature: irreversible, insurmountable, non-competitive. It has the highest affinity (smallest Kd) of the drug classes. Example: phenoxybenzamine (α1 and α2). Once phenoxybenzamine is bound the receptor has to be internalized and recycled and the body must make new ones. Poll: phenoxybenzamine has higher affinity than prazosin. The reduced-Emax curve is Day 4 material (deck preview slide ~68).", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-indirect-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~40–~41; transcript 9/23; transcript 9/24", "quote": "So, remember that indirect antagonists can work downstream from the receptor, but also upstream from the receptor, OK?", "id": "T-indirect-antagonist-1", "stem": "Which term is defined as: A drug that inhibits the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS?", "options": [{"t": "Indirect antagonist", "correct": true, "why": "This is the definition of Indirect antagonist."}, {"t": "Allosteric site / modulator", "correct": false, "why": "Allosteric site / modulator: A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once."}, {"t": "Competitive (reversible) antagonist", "correct": false, "why": "Competitive (reversible) antagonist: An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1."}, {"t": "Inverse agonist", "correct": false, "why": "Inverse agonist: Has the highest affinity for inactive receptors and negative efficacy: if it binds an active receptor it inhibits it, shifting receptors to the inactive state. Example: the antihistamine loratadine at H1."}], "teach": "A drug that inhibits the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS. It can raise the response (caffeine on PDE raises cAMP; a norepinephrine transporter blocker makes norepinephrine appear more potent) or lower it (RAS blocker stops cell growth). It is not allosteric: it never touches the receptor.", "fg": "classes"},

tor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS. It can raise the response (caffeine on PDE raises cAMP; a norepinephrine transporter blocker makes norepinephrine appear more potent) or lower it (RAS blocker stops cell growth). It is not allosteric: it never touches the receptor.", "dupOf": "T-indirect-antagonist-1", "fg": "classes"},
{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-allosteric-agonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slides ~21–~24, ~42; transcript 9/23", "quote": "Benzos increase the affinity And/or efficacy of GABA For its receptor", "id": "T-allosteric-agonist-1", "stem": "Which term is defined as: Binds at a different site on the receptor and increases the affinity and/or efficacy of another drug for the receptor (positive allosteric modulator, PAM). Diazepam and other benzodiazepines increase the affinity and/or efficacy of GABA at the GABA-A chloride channel?", "options": [{"t": "Allosteric agonist (PAM)", "correct": true, "why": "This is the definition of Allosteric agonist (PAM)."}, {"t": "Allosteric site / modulator", "correct": false, "why": "Allosteric site / modulator: A different (allotopic) binding site on the receptor. An allosteric drug binds there and can increase or decrease the affinity and/or efficacy of another drug for the receptor, or have no effect; it does not compete for the orthosteric pocket, so both drugs can be bound at once."}, {"t": "Allosteric antagonist", "correct": false, "why": "Allosteric antagonist: Binds at a different site on the receptor and decreases the affinity and/or efficacy of another drug for the receptor."}, {"t": "Full agonist", "correct": false, "why": "Full agonist: Binds and stabilizes the receptor in the active state (R*): highest affinity for active-state receptors, positive (high) efficacy, and can reach 100% of the system’s maximal response. Examples: norepinephrine, epinephrine, acetylcholine."}], "teach": "Binds at a different site on the receptor and increases the affinity and/or efficacy of another drug for the receptor (positive allosteric modulator, PAM). Diazepam and other benzodiazepines increase the affinity and/or efficacy of GABA at the GABA-A chloride channel. Diazepam is the allosteric agonist on the drug list “that you have to know for your exam.” A benzodiazepine plus alcohol puts two allosteric agonists on one receptor.", "fg": "classes"},

{"lecture": "L02", "prof": "Gottlieb", "tier": "new", "topic": "TERMS", "sub": "g3", "skill": "term", "concept": "term-allosteric-antagonist", "tags": ["term"], "source": "both", "cite": "Pharmacodynamics-Day_2_2026s copy.pdf slide ~43; transcript 9/23", "quote": "", "id": "T-allosteric-antagonist-1", "stem": "Which term is defined as: Binds at a different site on the receptor and decreases the affinity and/or efficacy of another drug for the receptor?", "options": [{"t": "Allosteric antagonist", "correct": true, "why": "This is the definition of Allosteric antagonist."}, {"t": "Allosteric agonist (PAM)", "correct": false, "why": "Allosteric agonist (PAM): Binds at a different site on the receptor and increases the affinity and/or efficacy of another drug for the receptor (positive allosteric modulator, PAM). Diazepam and other benzodiazepines increase the affinity and/or efficacy of GABA at the GABA-A chloride channel."}, {"t": "Competitive (reversible) antagonist", "correct": false, "why": "Competitive (reversible) antagonist: An antagonist held by reversible bonds (ionic, hydrogen, van der Waals): reversible, surmountable and competitive are three names for the same property. It competes with the agonist for the orthosteric pocket, binds and comes off, and can be outcompeted by agonist. Example: prazosin at α1."}, {"t": "Indirect antagonist", "correct": false, "why": "Indirect antagonist: A drug that inhibits the generation of a biological response by binding to components upstream or downstream from the receptor rather than the receptor itself; it can be reversible or irreversible. Examples: caffeine blocking PDE, a cancer drug blocking RAS."}], "teach": "Binds at a different site on the receptor and decreases the affinity and/or efficacy of another drug for the receptor. It does not compete for the orthosteric pocket; a competitive antagonist does. “As far as I know, all allosteric agonists and antagonists are reversible.”", "fg": "classes"},
