<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTK activation, step by step</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-accent:#185FA5;
  --border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.25);--surface-1:#f6f5f2;--surface-2:#ffffff;
  --radius:8px;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mem:#FAC775;
}
@media (prefers-color-scheme:dark){:root{
  --text-primary:#ecebe6;--text-secondary:#b4b2a9;--text-accent:#85B7EB;
  --border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.3);--surface-1:#2a2a28;--surface-2:#1f1e1d;
  --mem:#854F0B;
}}
body{margin:0;padding:24px 16px;font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-2)}
.rtk{max-width:680px;margin:0 auto}
.rtk .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rtk .t{font-size:14px;fill:var(--text-primary)}
.rtk .ts{font-size:12px;fill:var(--text-secondary)}
.rtk .th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.rtk .arr{stroke:var(--text-secondary);stroke-width:1.5;fill:none}
.rtk .c-blue>rect{fill:#E6F1FB;stroke:#185FA5}.rtk .c-blue>text{fill:#0C447C}
.rtk .c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.rtk .c-purple>text{fill:#3C3489}
.rtk .c-green>circle{fill:#EAF3DE;stroke:#3B6D11}.rtk .c-green>text{fill:#27500A}
.rtk .c-red>circle{fill:#FCEBEB;stroke:#A32D2D}.rtk .c-red>text{fill:#791F1F}
.rtk .c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.rtk .c-teal>text{fill:#085041}
.rtk .c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.rtk .c-amber>text{fill:#633806}
@media (prefers-color-scheme:dark){
  .rtk .c-blue>rect{fill:#0C447C;stroke:#85B7EB}.rtk .c-blue>text{fill:#E6F1FB}
  .rtk .c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.rtk .c-purple>text{fill:#EEEDFE}
  .rtk .c-green>circle{fill:#27500A;stroke:#97C459}.rtk .c-green>text{fill:#EAF3DE}
  .rtk .c-red>circle{fill:#791F1F;stroke:#F09595}.rtk .c-red>text{fill:#FCEBEB}
  .rtk .c-teal>rect{fill:#085041;stroke:#5DCAA5}.rtk .c-teal>text{fill:#E1F5EE}
  .rtk .c-amber>rect{fill:#633806;stroke:#EF9F27}.rtk .c-amber>text{fill:#FAEEDA}
}
.rtk .rcp{transition:transform .9s ease}
.rtk .fd{transition:opacity .5s ease}
@media (prefers-reduced-motion:reduce){.rtk .rcp,.rtk .fd{transition:none}}
.rtk button{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:.5px solid var(--border-strong);border-radius:var(--radius);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.rtk button:hover{background:var(--surface-1)}
.rtk button:active{transform:scale(.98)}
.rtk button:focus-visible,.rtk .dot:focus-visible{outline:2px solid var(--text-accent);outline-offset:2px}
.rtk .dot{width:12px;height:12px;border-radius:50%;background:var(--border-strong);border:none;padding:0;cursor:pointer}
.rtk .dot.on{background:var(--text-accent)}
.rtk .src{font-size:12px;color:var(--text-secondary);margin-top:14px}
</style>
</head>
<body>
<div class="rtk" id="rtk-root">
<h2 class="sr-only">Step-through diagram of receptor tyrosine kinase activation: monomers, ligand binding and dimerization, cross-phosphorylation, signaling, and tyrosine phosphatase reset.</h2>
<svg width="100%" viewBox="0 0 680 370" role="img">
<title>RTK activation</title><desc>Two receptor tyrosine kinases in a membrane, shown at each activation step.</desc>
<defs><marker id="rtk-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="170" width="680" height="32" fill="var(--mem)" opacity=".35"/>
<text class="ts" x="20" y="70">Outside cell</text>
<text class="ts" x="20" y="190">Membrane</text>
<text class="ts" x="20" y="250">Cytoplasm</text>

<g id="rtk-rL" class="rcp" style="transform:translate(200px,0)">
  <g id="rtk-ligL" class="fd c-green" style="opacity:0"><circle cx="0" cy="55" r="18" stroke-width="0.5"/><text class="th" x="0" y="55" text-anchor="middle" dominant-baseline="central">L</text></g>
  <g class="c-blue"><rect x="-35" y="80" width="70" height="88" rx="8" stroke-width="0.5"/><text class="ts" x="0" y="116" text-anchor="middle">Binding</text><text class="ts" x="0" y="132" text-anchor="middle">domain</text></g>
  <rect x="-6" y="168" width="12" height="34" fill="#378ADD"/>
  <g class="c-purple"><rect x="-35" y="202" width="70" height="88" rx="8" stroke-width="0.5"/><text class="ts" x="0" y="238" text-anchor="middle">Kinase</text><text class="ts" x="0" y="254" text-anchor="middle">tail</text></g>
  <g id="rtk-pL" class="fd" style="opacity:0">
    <g class="c-red"><circle cx="-50" cy="225" r="13" stroke-width="0.5"/><text class="th" x="-50" y="225" text-anchor="middle" dominant-baseline="central">P</text></g>
    <g class="c-red"><circle cx="-50" cy="265" r="13" stroke-width="0.5"/><text class="th" x="-50" y="265" text-anchor="middle" dominant-baseline="central">P</text></g>
  </g>
</g>

<g id="rtk-rR" class="rcp" style="transform:translate(480px,0)">
  <g id="rtk-ligR" class="fd c-green" style="opacity:0"><circle cx="0" cy="55" r="18" stroke-width="0.5"/><text class="th" x="0" y="55" text-anchor="middle" dominant-baseline="central">L</text></g>
  <g class="c-blue"><rect x="-35" y="80" width="70" height="88" rx="8" stroke-width="0.5"/><text class="ts" x="0" y="116" text-anchor="middle">Binding</text><text class="ts" x="0" y="132" text-anchor="middle">domain</text></g>
  <rect x="-6" y="168" width="12" height="34" fill="#378ADD"/>
  <g class="c-purple"><rect x="-35" y="202" width="70" height="88" rx="8" stroke-width="0.5"/><text class="ts" x="0" y="238" text-anchor="middle">Kinase</text><text class="ts" x="0" y="254" text-anchor="middle">tail</text></g>
  <g id="rtk-pR" class="fd" style="opacity:0">
    <g class="c-red"><circle cx="50" cy="225" r="13" stroke-width="0.5"/><text class="th" x="50" y="225" text-anchor="middle" dominant-baseline="central">P</text></g>
    <g class="c-red"><circle cx="50" cy="265" r="13" stroke-width="0.5"/><text class="th" x="50" y="265" text-anchor="middle" dominant-baseline="central">P</text></g>
  </g>
</g>

<g id="rtk-cas" class="fd" style="opacity:0">
  <line x1="340" y1="292" x2="340" y2="310" class="arr" marker-end="url(#rtk-arrow)"/>
  <g class="c-teal"><rect x="250" y="314" width="180" height="40" rx="8" stroke-width="0.5"/><text class="th" x="340" y="334" text-anchor="middle" dominant-baseline="central">Signaling cascade</text></g>
</g>
<g id="rtk-ptp" class="fd" style="opacity:0">
  <g class="c-amber"><rect x="480" y="314" width="170" height="40" rx="8" stroke-width="0.5"/><text class="th" x="565" y="334" text-anchor="middle" dominant-baseline="central">Tyrosine phosphatase</text></g>
</g>
</svg>

<div style="margin:12px 0 4px;min-height:84px" aria-live="polite">
  <p id="rtk-st" style="font-weight:500;margin:0 0 4px;font-size:15px"></p>
  <p id="rtk-sd" style="margin:0;font-size:14px;color:var(--text-secondary);line-height:1.6"></p>
</div>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
  <button id="rtk-bk"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back</button>
  <button id="rtk-nx">Next <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
  <button id="rtk-rp"><i class="ti ti-refresh" aria-hidden="true"></i> Replay step</button>
  <button id="rtk-pl"><i class="ti ti-player-play" aria-hidden="true"></i> Play all</button>
  <span id="rtk-dots" style="display:flex;gap:6px;margin-left:auto"></span>
</div>
<p class="src">Steps follow the "RTKs Activation" slide, Pharmacodynamics Day 2 (Gottlieb). Textbook: Chapter 2, Figure 2–7.</p>
</div>

<script>
(function(){
  var STEPS = [
    {title:"Inactive receptor is in a monomeric state",
     text:"Each RTK crosses the membrane once and sits alone. No ligand bound, kinase tail is off."},
    {title:"Ligand binding induces dimerization",
     text:"The agonist (L, e.g. insulin or a growth factor) binds the extracellular domain. That triggers two receptors to pair up: dimerization."},
    {title:"Cross-phosphorylation of the kinase domain",
     text:"Dimerization switches on the kinase activity. Each tail adds phosphates (P) to the other tail's tyrosines. Phosphorylation = activation."},
    {title:"Phosphorylation forms docking sites and signaling complexes",
     text:"The phosphorylated tyrosines act as docking sites. Signaling proteins bind there and launch the second messenger cascade."},
    {title:"Tyrosine phosphatase (TP)",
     text:"Tyrosine phosphatase removes the phosphates. Signaling stops, the dimer separates, and the receptors reset to monomers."}
  ];
  /* Each state is a frame: lig = ligand shown, dimer = receptors together, p = phosphates, cas = cascade, ptp = phosphatase.
     A step is a list of frames played in order; the last frame is the step's resting state. */
  var F = function(lig,dimer,p,cas,ptp,wait){return {lig:lig,dimer:dimer,p:p,cas:cas,ptp:ptp,wait:wait||0};};
  var FRAMES = [
    [F(0,0,0,0,0)],
    [F(0,0,0,0,0), F(1,0,0,0,0,300), F(1,1,0,0,0,1200)],
    [F(1,1,0,0,0), F(1,1,1,0,0,400)],
    [F(1,1,1,0,0), F(1,1,1,1,0,400)],
    [F(1,1,1,1,0), F(1,1,1,1,1,300), F(1,1,0,0,1,1200), F(0,0,0,0,1,2200)]
  ];
  var root = document.getElementById("rtk-root");
  function $(id){ return document.getElementById("rtk-" + id); }
  var cur = 0, timers = [], player = null;

  function draw(s){
    $("ligL").style.opacity = $("ligR").style.opacity = s.lig;
    $("rL").style.transform = "translate(" + (s.dimer ? 300 : 200) + "px,0)";
    $("rR").style.transform = "translate(" + (s.dimer ? 380 : 480) + "px,0)";
    $("pL").style.opacity = $("pR").style.opacity = s.p;
    $("cas").style.opacity = s.cas;
    $("ptp").style.opacity = s.ptp;
  }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
  function show(i, animate){
    clearTimers(); cur = i;
    $("st").textContent = "Step " + (i+1) + " of " + STEPS.length + ": " + STEPS[i].title;
    $("sd").textContent = STEPS[i].text;
    root.querySelectorAll(".dot").forEach(function(d,k){
      d.classList.toggle("on", k === i); d.setAttribute("aria-current", k === i ? "step" : "false");
    });
    var frames = FRAMES[i];
    if (!animate) { draw(frames[frames.length-1]); return; }
    frames.forEach(function(f){ timers.push(setTimeout(function(){ draw(f); }, f.wait)); });
  }
  function setPlayLabel(playing){
    $("pl").innerHTML = playing
      ? '<i class="ti ti-player-pause" aria-hidden="true"></i> Pause'
      : '<i class="ti ti-player-play" aria-hidden="true"></i> Play all';
  }
  function stop(){ if (player) { clearInterval(player); player = null; setPlayLabel(false); } }
  function go(d){ stop(); show((cur + d + STEPS.length) % STEPS.length, true); }

  $("bk").addEventListener("click", function(){ go(-1); });
  $("nx").addEventListener("click", function(){ go(1); });
  $("rp").addEventListener("click", function(){ stop(); show(cur, true); });
  $("pl").addEventListener("click", function(){
    if (player) { stop(); return; }
    show(0, true); setPlayLabel(true);
    player = setInterval(function(){
      if (cur === STEPS.length - 1) { stop(); return; }
      show(cur + 1, true);
    }, 3200);
  });
  var dots = $("dots");
  STEPS.forEach(function(s,k){
    var b = document.createElement("button");
    b.className = "dot"; b.setAttribute("aria-label", "Go to step " + (k+1) + ": " + s.title);
    b.addEventListener("click", function(){ stop(); show(k, true); });
    dots.appendChild(b);
  });
  show(0, false);
})();
</script>
</body>
</html>
