<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{

}

    --accent:#7fb0e0; --accent-ink:#0d1620; --ok:#6fd49a; --ok-bg:#16301f;
    --bad:#f08a82; --bad-bg:#3a1a18; --warn:#f0c060; --warn-bg:#352a10; --chip:#2a2e33;
    --figA:#3d95cc; --figB:#d9702e; --figC:#1fa27f; --figD:#bd8a26; --figE:#bf6e9e;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1e2125; --ink:#e7e9ec; --muted:#9aa1a9; --line:#33383e;
  --accent:#7fb0e0; --accent-ink:#0d1620; --ok:#6fd49a; --ok-bg:#16301f;
  --bad:#f08a82; --bad-bg:#3a1a18; --warn:#f0c060; --warn-bg:#352a10; --chip:#2a2e33;
  --figA:#3d95cc; --figB:#d9702e; --figC:#1fa27f; --figD:#bd8a26; --figE:#bf6e9e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar h1{font-size:15px;margin:0 10px 0 0;white-space:nowrap}
.bar h1 .stamp{margin-left:6px}

nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:880px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:6px 0 8px}
h3{font-size:16px;margin:18px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.chip{font:inherit;line-height:inherit} .chip{display:inline-block;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.stem{font-size:17px;margin:4px 0 12px;white-space:pre-line}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:10px 12px;margin:0 0 8px;font-size:15px;cursor:pointer}
.opt .k{font-weight:600;min-width:1.4em}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}

.opt:disabled{cursor:default}

.teach{background:var(--chip);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.teach h4{margin:6px 0 2px;font-size:14px}
.cite{font-size:12px;color:var(--muted);margin-top:8px}
.note{background:var(--warn-bg);color:var(--ink);border-left:3px solid var(--warn);padding:8px 10px;border-radius:6px;font-size:14px;margin:8px 0}
.quote{font-size:13px;color:var(--muted);font-style:italic;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{background:var(--chip)}
.tablewrap{overflow-x:auto}
.xpick{margin:10px 0} .xpick select{font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:var(--ink);max-width:100%}
.xout:empty{display:none} .xexp{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:14px} .xexp h4{margin:0 0 6px} .xexp dl{margin:6px 0} .xexp dt{font-weight:700;margin-top:6px} .xexp dd{margin:2px 0 0 0} .xexp .xtrap{border-left:3px solid var(--accent);padding-left:8px}
button.xwhy{font-size:11px;padding:1px 7px;margin-left:4px;vertical-align:middle}
.sdots10{display:inline-flex;gap:3px;vertical-align:middle;flex-wrap:wrap} .sdots10 i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid var(--ok);background:var(--ok)} .sdots10 i.n{background:transparent;border-color:var(--bad)} .sdots10.big i{width:14px;height:14px}
.plan .pconcept{border-top:1px solid var(--line);padding:8px 0 6px;margin-top:8px;font-size:14px} .plan .pq{font-weight:600;margin-bottom:4px} .plan .pw{color:var(--bad);margin:2px 0} .plan .pw .meta{color:var(--muted)} .plan .pr{color:var(--ok);margin:2px 0} .plan .pi{margin:2px 0}
.bar-meter{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:80px}
.bar-meter span{display:block;height:100%;background:var(--accent)}
.topicrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.topicrow:first-child{border-top:0}
.topicrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.topicrow>span:first-child{flex:1 1 auto;min-width:0}
.topicrow>span.row{flex:0 0 auto;flex-wrap:nowrap;white-space:nowrap;gap:10px}
.topicrow.subrow{padding-left:14px;font-size:14px}
@media (max-width:560px){.topicrow{flex-wrap:wrap} .topicrow>span.row{flex:1 1 100%;max-width:100%;white-space:normal;flex-wrap:wrap;justify-content:flex-start}}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;margin:10px 0}
.grid button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:4px 0;font-size:12px;cursor:pointer}
.grid button.ans{background:var(--chip)} .grid button.cur{border-color:var(--accent)} .grid button.flag{outline:2px solid var(--warn)}
select,input[type=text],input[type=number]{font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.empty{color:var(--muted);padding:12px 0}
.stamp{font-weight:400;font-size:12px;color:var(--muted)}
.stamp a{color:var(--accent)}
.bar-meter.seen{display:block;margin-top:5px;max-width:220px;height:5px}
.reading{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.reading h4{margin:0 0 4px;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.reading .cite{margin-top:4px;margin-bottom:6px}
.kbd{margin-top:10px;margin-bottom:0}
.fig{margin:10px 0;padding:8px 8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:520px}
.fig svg{width:100%;height:auto;display:block;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.fig img{display:block;width:100%;height:auto;border-radius:4px}
.fig figcaption{font-size:13px;color:var(--muted);margin:6px 2px 4px}
.fig .ax{stroke:var(--ink);stroke-width:1.2;fill:none}
.fig .dash{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;fill:none}
.fig .cv{fill:none;stroke-width:2.4;stroke-linejoin:round}
.fig .cv.a{stroke:var(--figA)} .fig .cv.b{stroke:var(--figB)} .fig .cv.c{stroke:var(--figC)} .fig .cv.d{stroke:var(--figD)} .fig .cv.e{stroke:var(--figE)} .fig .cv.dashed{stroke-dasharray:6 4}
.fig .cl.d{fill:var(--figD)} .fig .cl.e{fill:var(--figE)}
.stemfig{margin:0 0 12px}
.fig .cl{font-size:11px;font-weight:600} .fig .cl.a{fill:var(--figA)} .fig .cl.b{fill:var(--figB)} .fig .cl.c{fill:var(--figC)}
.fig .lbl{fill:var(--ink);font-size:11px} .fig .lbl.big{font-size:20px;font-weight:700} .fig .lbl.sm{font-size:10px;font-weight:600} .fig .lbl.xs{font-size:8.5px;fill:var(--muted)} .fig .lbl.sm2{font-size:10px}
.fig .shape{fill:var(--chip);stroke:var(--line);stroke-width:1.5}
.fig .pocket{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.fig .lig.a{fill:var(--figA)} .fig .lig.b{fill:var(--figB)} .fig .lig.c{fill:var(--figC)}
.fig .title{fill:var(--ink);font-size:11px;font-weight:700}
.fig figcaption ul{margin:4px 0 2px;padding-left:18px} .fig figcaption li{margin:2px 0}
.fig .box{fill:var(--chip);stroke:var(--line);stroke-width:1.2}
.fig .st{display:none} .fig .st.on{display:inline}
.fig .st-out{pointer-events:none;animation:stOut .5s ease forwards} .fig .st .fadein{animation:stIn .5s ease backwards}
.fig .st .glide{transition:transform .9s ease}
@keyframes stIn{from{opacity:0}} @keyframes stOut{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.fig .st-out{display:none} .fig .st .fadein{animation:none} .fig .st .glide{transition:none}}
.sdots{display:inline-flex;gap:6px;align-items:center;margin-left:auto} .sdot{width:12px;height:12px;border-radius:50%;background:var(--line);border:none;padding:0;cursor:pointer} .sdot.on{background:var(--accent)} .sdot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fig .arrow{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#arw)}
.shiftgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px;margin:8px 0 18px} .shiftgrid .fig{max-width:none;margin:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 18px} .pair .fig{max-width:none;margin:0} .pair h4{grid-column:1/-1;margin:0}
@media (max-width:760px){.pair{grid-template-columns:1fr}}
@media (max-width:560px){.shiftgrid{grid-template-columns:1fr}}
nav select{font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:var(--ink)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:4px 0 10px}
.mapsub{margin:10px 0 2px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px} .gcard{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start;margin:0} .gthumb img{width:120px;max-height:110px;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.gskip{border-left:3px solid var(--bad);padding:6px 10px;margin:10px 0;font-size:14px} .gread{margin:8px 0;font-size:14px} .gread summary{cursor:pointer;font-weight:600} .gread ul{margin:6px 0 0 18px}
@media (max-width:560px){.gcard{grid-template-columns:1fr}}
.flagb.on{color:var(--warn);border-color:var(--warn);font-weight:600} .qt.flagged{box-shadow:inset 0 0 0 2px var(--warn)} .layoutsel .chip{padding:2px 8px;font-size:12px} .allhead{padding:6px 0} .qcard{margin-bottom:14px}
.explain{margin-top:10px;gap:6px} .explain .chip{font-size:12px}
#backbtn{position:fixed;right:14px;bottom:14px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.tbar input[type=search]::-webkit-search-cancel-button{display:none}
.tbar input[type=search]{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px} .letters .lt{font:inherit;font-size:13px;font-weight:600;min-width:28px;height:28px;padding:0 4px;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:var(--ink);cursor:pointer} .letters .lt:disabled{opacity:.35;cursor:default} .letters .lt:not(:disabled):hover{border-color:var(--accent)} .letters .lt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#tback{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;white-space:nowrap;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#xback{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;white-space:nowrap;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.readstrip{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:13px} .readstrip th{background:var(--chip);font-weight:600;padding:4px 8px;text-align:left} .readstrip td{padding:4px 8px;border-top:1px solid var(--line)}
.decide{width:100%;border-collapse:collapse;font-size:14px} .decide th,.decide td{padding:5px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.qt{overflow-wrap:anywhere;min-width:0;position:relative;display:block;text-align:left;border:1.5px solid var(--line);border-radius:6px;padding:5px 7px 5px 22px;background:var(--panel);color:var(--ink);font-size:11px;line-height:1.3;cursor:pointer;min-height:44px}
.qt .qm{position:absolute;left:6px;top:4px;font-size:13px;font-weight:700}
.qt .qid{font-weight:700;font-size:10px;color:var(--muted)} .qt .qn{font-size:10px;color:var(--muted);margin-left:5px} .qt .qs{display:block;color:var(--ink)}
.qt.unseen{border-style:dashed;background:transparent} .qt.unseen .qs{color:var(--muted)}
.qt.right{border-color:var(--figC);background:var(--ok-bg);background:color-mix(in srgb,var(--figC) 14%,var(--panel))} .qt.right .qm{color:var(--figC)}
.qt.wrong{border-color:var(--figB);background:var(--bad-bg);background:color-mix(in srgb,var(--figB) 16%,var(--panel))} .qt.wrong .qm{color:var(--figB)}
.qt.lg{display:inline-block;min-height:0;padding:3px 8px 3px 20px;cursor:default;font-size:12px}
.chip.lg-right.on{background:var(--figC);border-color:var(--figC);color:var(--accent-ink)} .chip.lg-wrong.on{background:var(--figB);border-color:var(--figB);color:var(--accent-ink)}
.guidenav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.guidenav a{display:inline-block;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink);text-decoration:none}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.guide h3{margin:0 0 8px;font-size:18px} .guide h4{margin:12px 0 4px;font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.guide ul{margin:4px 0 8px;padding-left:20px} .guide li{margin:3px 0} .guide small{color:var(--muted)}
.guide .poll{border-left:3px solid var(--accent);padding:6px 10px;margin:6px 0;background:var(--chip);border-radius:6px}
.term{padding:10px 0;border-top:1px solid var(--line)} .term:first-child{border-top:0}
.term b{font-size:16px} .term .hook{color:var(--muted);font-size:14px;margin-top:2px} .gist{color:var(--accent);font-weight:600;font-size:14px;margin:2px 0 4px}
.flash{min-height:120px;text-align:center;padding:24px 12px} .flash .t{font-size:24px;font-weight:600}
@media (max-width:560px){
  .kbd{display:none}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:4px 0;background:var(--panel)}

@media (max-width:560px){ .why{margin-left:8px} .bar h1{width:100%} }
</style>
</head>

<main id="view"></main>
