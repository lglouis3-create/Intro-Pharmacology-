<h1>Cyanide antidote pathway: overview</h1>
<p class="sub">Toxicokinetic-Based Treatment: Cyanide example (static flowchart)</p>
<svg width="100%" viewBox="0 0 680 714" role="img"><title>Cyanide antidote pathway</title><desc>Cyanide binds cytochrome c oxidase. Amyl nitrite oxidizes hemoglobin to methemoglobin, which pulls cyanide off the enzyme to form cyanomethemoglobin. Rhodanese uses thiosulfate to convert that cyanide to thiocyanate, and methylene blue reduces methemoglobin back to hemoglobin.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-purple"><rect x="40" y="40" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="175" y="58" text-anchor="middle" dominant-baseline="central">Cytochrome c oxidase</text><text class="ts" x="175" y="78" text-anchor="middle" dominant-baseline="central">Working enzyme, O₂ bound</text></g>
<g class="node c-teal"><rect x="370" y="40" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="505" y="58" text-anchor="middle" dominant-baseline="central">Hemoglobin (Fe²⁺)</text><text class="ts" x="505" y="78" text-anchor="middle" dominant-baseline="central">Starting state</text></g>
<line x1="175" y1="96" x2="175" y2="148" class="arr" marker-end="url(#arrow)"/>
<line x1="505" y1="96" x2="505" y2="148" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="40" y="150" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="175" y="168" text-anchor="middle" dominant-baseline="central">Cyanocytochrome c oxidase</text><text class="ts" x="175" y="188" text-anchor="middle" dominant-baseline="central">CN⁻ blocks heme iron</text></g>
<g class="node c-teal"><rect x="370" y="150" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="505" y="168" text-anchor="middle" dominant-baseline="central">Methemoglobin (Fe³⁺)</text><text class="ts" x="505" y="188" text-anchor="middle" dominant-baseline="central">Step 1: amyl nitrite oxidizes</text></g>
<line x1="175" y1="206" x2="175" y2="288" class="arr" marker-end="url(#arrow)"/>
<line x1="505" y1="206" x2="505" y2="288" class="arr" marker-end="url(#arrow)"/>
<path d="M310 190 L368 300" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="40" y="290" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="175" y="308" text-anchor="middle" dominant-baseline="central">Cytochrome c oxidase</text><text class="ts" x="175" y="328" text-anchor="middle" dominant-baseline="central">Step 2: CN⁻ pulled off</text></g>
<g class="node c-teal"><rect x="370" y="290" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="505" y="308" text-anchor="middle" dominant-baseline="central">Cyanomethemoglobin</text><text class="ts" x="505" y="328" text-anchor="middle" dominant-baseline="central">CN⁻ now on Fe³⁺</text></g>
<line x1="505" y1="346" x2="505" y2="398" class="arr" marker-end="url(#arrow)"/>
<g class="node"><rect class="box" x="370" y="400" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="505" y="418" text-anchor="middle" dominant-baseline="central">Rhodanese + thiosulfate</text><text class="ts" x="505" y="438" text-anchor="middle" dominant-baseline="central">Step 3: CN⁻ becomes SCN⁻</text></g>
<line x1="370" y1="428" x2="312" y2="428" class="arr" marker-end="url(#arrow)"/>
<g class="node"><rect class="box" x="40" y="400" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="175" y="418" text-anchor="middle" dominant-baseline="central">Thiocyanate (SCN⁻)</text><text class="ts" x="175" y="438" text-anchor="middle" dominant-baseline="central">Product of step 3</text></g>
<line x1="505" y1="456" x2="505" y2="508" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="370" y="510" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="505" y="528" text-anchor="middle" dominant-baseline="central">Methemoglobin (Fe³⁺)</text><text class="ts" x="505" y="548" text-anchor="middle" dominant-baseline="central">Cyanide removed</text></g>
<line x1="505" y1="566" x2="505" y2="618" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="370" y="620" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="505" y="638" text-anchor="middle" dominant-baseline="central">Hemoglobin (Fe²⁺)</text><text class="ts" x="505" y="658" text-anchor="middle" dominant-baseline="central">Step 4: methylene blue reduces</text></g>
