<p id="phase" style="font-size:14px;font-weight:500;color:var(--text-secondary);margin:0 0 6px;"></p>
<div style="display:flex;gap:6px;margin:0 0 8px;" id="pills"></div>
<svg width="100%" viewBox="0 0 380 460" role="img" style="display:block;"><title>Warfarin and vitamin K cycle</title><desc>Glutamate converted to gamma-carboxyglutamate by vitamin K-dependent carboxylase; reduced vitamin K becomes epoxide; epoxide reductase recycles it; warfarin blocks the reductase; supplied vitamin K enters the reduced pool.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="190" y="14" text-anchor="middle" dominant-baseline="central">Residues in coagulation factors</text>
<g id="gGlu" style="transition:opacity .4s"><g class="c-gray"><rect x="10" y="30" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="85" y="48" text-anchor="middle" dominant-baseline="central">Glutamate (Glu)</text><text class="ts" x="85" y="66" text-anchor="middle" dominant-baseline="central">–CH₂–CH₂–COOH</text></g></g>
<g id="gGla" style="transition:opacity .4s"><g id="glaBox" class="c-gray"><rect x="205" y="30" width="165" height="52" rx="8" stroke-width="0.5"/><text class="th" x="287" y="48" text-anchor="middle" dominant-baseline="central">γ-Carboxyglutamate</text><text class="ts" x="287" y="66" text-anchor="middle" dominant-baseline="central">–CH₂–CH(COOH)₂</text></g></g>
<g id="aIn" style="transition:opacity .4s">
<path d="M85 82 Q90 118 104 122" fill="none" stroke="var(--text-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="62" y="104" text-anchor="middle" dominant-baseline="central">CO₂</text>
<path d="M100 196 Q110 160 140 146" fill="none" stroke="var(--text-secondary)" stroke-width="1" marker-end="url(#arrow)"/></g>
<g id="aOut" style="transition:opacity .4s">
<path d="M276 122 Q288 118 290 86" fill="none" stroke="var(--text-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="318" y="104" text-anchor="middle" dominant-baseline="central">O₂</text>
<path d="M240 146 Q272 160 280 196" fill="none" stroke="var(--text-secondary)" stroke-width="1" marker-end="url(#arrow)"/></g>
<g id="gCarb" style="transition:opacity .4s"><g class="c-teal"><rect x="106" y="100" width="168" height="44" rx="8" stroke-width="0.5"/><text class="th" x="190" y="116" text-anchor="middle" dominant-baseline="central">Carboxylase</text><text class="ts" x="190" y="132" text-anchor="middle" dominant-baseline="central">vitamin K-dependent</text></g></g>
<g id="gRed" style="transition:opacity .4s">
<g stroke="var(--text-primary)" stroke-width="1" fill="none"><polygon points="69.2,228 79.6,234 79.6,246 69.2,252 58.8,246 58.8,234"/><polygon points="90,228 100.4,234 100.4,246 90,252 79.6,246 79.6,234"/><line x1="90" y1="228" x2="90" y2="221"/><line x1="90" y1="252" x2="90" y2="259"/><line x1="100.4" y1="234" x2="110" y2="228"/><line x1="100.4" y1="246" x2="110" y2="252"/></g>
<text class="ts" x="90" y="212" text-anchor="middle" dominant-baseline="central">OH</text><text class="ts" x="90" y="268" text-anchor="middle" dominant-baseline="central">OH</text><text class="ts" x="116" y="224" text-anchor="middle" dominant-baseline="central">R</text>
<text class="th" x="85" y="286" text-anchor="middle" dominant-baseline="central">Vitamin K, reduced</text><text class="ts" x="85" y="302" text-anchor="middle" dominant-baseline="central">active form</text><g id="redDots"></g></g>
<g id="gEpo" style="transition:opacity .4s">
<g stroke="var(--text-primary)" stroke-width="1" fill="none"><polygon points="269.2,228 279.6,234 279.6,246 269.2,252 258.8,246 258.8,234"/><polygon points="290,228 300.4,234 300.4,246 290,252 279.6,246 279.6,234"/><line x1="287" y1="227" x2="287" y2="220"/><line x1="293" y1="227" x2="293" y2="220"/><line x1="287" y1="253" x2="287" y2="260"/><line x1="293" y1="253" x2="293" y2="260"/><line x1="300.4" y1="234" x2="310" y2="228"/><line x1="300.4" y1="246" x2="310" y2="252"/><line x1="300.4" y1="234" x2="306" y2="240"/><line x1="300.4" y1="246" x2="306" y2="240"/></g>
<text class="ts" x="290" y="212" text-anchor="middle" dominant-baseline="central">O</text><text class="ts" x="290" y="268" text-anchor="middle" dominant-baseline="central">O</text><text class="ts" x="316" y="224" text-anchor="middle" dominant-baseline="central">R</text><text class="ts" x="314" y="240" text-anchor="middle" dominant-baseline="central">O</text>
<text class="th" x="290" y="286" text-anchor="middle" dominant-baseline="central">Vitamin K epoxide</text><text class="ts" x="290" y="302" text-anchor="middle" dominant-baseline="central">inactive form</text><g id="epoDots"></g></g>
<g id="aRec" style="transition:opacity .4s">
<path d="M300 328 Q300 368 274 372" fill="none" stroke="var(--text-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M106 372 Q80 368 80 330" fill="none" stroke="var(--text-secondary)" stroke-width="1" marker-end="url(#arrow)"/></g>
<g id="gRdx" style="transition:opacity .4s"><g class="c-purple"><rect x="110" y="352" width="160" height="40" rx="8" stroke-width="0.5"/><text class="th" x="190" y="366" text-anchor="middle" dominant-baseline="central">Epoxide reductase</text><text class="ts" x="190" y="382" text-anchor="middle" dominant-baseline="central">NADH → NAD⁺</text></g></g>
<g id="warf" style="opacity:0;transition:opacity .5s"><line x1="190" y1="394" x2="190" y2="408" stroke="#D85A30" stroke-width="2"/><line x1="176" y1="394" x2="204" y2="394" stroke="#D85A30" stroke-width="2"/><text class="th" x="190" y="420" text-anchor="middle" dominant-baseline="central" style="fill:#D85A30">Warfarin</text></g>
<g id="vk" style="opacity:0;transition:opacity .5s"><rect x="8" y="356" width="70" height="40" rx="6" fill="none" stroke="#BA7517" stroke-width="1"/><text class="ts" x="43" y="369" text-anchor="middle" dominant-baseline="central" style="fill:#BA7517">Vitamin K</text><text class="ts" x="43" y="384" text-anchor="middle" dominant-baseline="central" style="fill:#BA7517">given</text><line x1="40" y1="356" x2="58" y2="330" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/></g>
<g id="badges"></g>
<circle id="tok" cx="0" cy="0" r="6" fill="none" stroke="#BA7517" stroke-width="1.5" style="opacity:0"/>
<text class="ts" id="stat" x="190" y="446" text-anchor="middle" dominant-baseline="central"></text>
</svg>
<p id="cap" style="font-size:15px;line-height:1.6;color:var(--text-primary);margin:10px 0 12px;min-height:130px;"></p>
<div style="display:flex;gap:8px;"><button id="back" style="flex:1;">Back</button><button id="next" style="flex:1;">Next</button></div>
<script>
(function(){
function q(id){return document.getElementById(id);}
var NS='http://www.w3.org/2000/svg';
var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var tm=[];function later(f,ms){tm.push(setTimeout(f,ms));}
var R=[85,318],Cx=[190,148],E=[290,318],RR=[276,372],RL=[104,372],V=[43,350];
[[1,150,180],[2,230,180],[3,190,336]].forEach(function(b){var g=document.createElementNS(NS,'g');g.setAttribute('id','b'+b[0]);g.style.transition='opacity .4s';
g.innerHTML='<circle cx="'+b[1]+'" cy="'+b[2]+'" r="9" fill="none" stroke="var(--text-secondary)" stroke-width="1"/><text class="ts" x="'+b[1]+'" y="'+b[2]+'" text-anchor="middle" dominant-baseline="central">'+b[0]+'</text>';q('badges').appendChild(g);});
var red,epo,gla,cur=0;
function dots(id,n,x0){var g=q(id);g.innerHTML='';var m=Math.min(n,6);var s=x0-(m-1)*6;for(var i=0;i<m;i++){var c=document.createElementNS(NS,'circle');c.setAttribute('cx',s+i*12);c.setAttribute('cy','318');c.setAttribute('r','4');c.setAttribute('fill','none');c.setAttribute('stroke','#BA7517');c.setAttribute('stroke-width','1.2');g.appendChild(c);}}
function draw(){dots('redDots',red,85);dots('epoDots',epo,290);q('stat').textContent='Reduced: '+red+'   ·   Epoxide: '+epo+'   ·   Residues carboxylated: '+gla;}
var tok=q('tok');
function mv(p,d){tok.style.transition=rm||!d?'none':'transform '+d+'s ease';tok.style.transform='translate('+p[0]+'px,'+p[1]+'px)';}
function path(pts,start,leg){var t=start;later(function(){mv(pts[0],0);tok.style.opacity=1;},t);t+=60;pts.slice(1).forEach(function(p){later(function(){mv(p,leg);},t);t+=leg*1000+40;});return t;}
function flash(){var b=q('glaBox');b.setAttribute('class','c-teal');later(function(){b.setAttribute('class','c-gray');},600);}
var ALL=['gGlu','gGla','gCarb','gRed','gEpo','gRdx','aIn','aOut','aRec','b1','b2','b3'];
var START=[3,1,0];
var S=[
{ph:'Normal cycle',hi:['gGlu','gCarb','gRed','aIn','b1'],w:0,v:0,n:[2,1,0],c:'1. Reduced vitamin K (active form) and a glutamate residue in a coagulation factor reach the vitamin K-dependent carboxylase, along with CO₂ and O₂. Reduced vitamin K is required for the carboxylase to work.'},
{ph:'Normal cycle',hi:['gCarb','gGla','gEpo','aOut','b2'],w:0,v:0,n:[2,2,1],c:'2. The carboxylase adds a second COOH to the glutamate, making γ-carboxyglutamate. In the same reaction, vitamin K is converted to vitamin K 2,3-epoxide (inactive form).'},
{ph:'Normal cycle',hi:['gEpo','gRdx','gRed','aRec','b3'],w:0,v:0,n:[3,1,1],c:'3. Epoxide reductase, using NADH, converts the epoxide back to reduced vitamin K. The same vitamin K molecule goes around again, so a small amount of vitamin K supports many carboxylations.'},
{ph:'Warfarin overdose',hi:['gRdx','aRec','b3'],w:1,v:0,n:[3,1,1],c:'4. Warfarin, one of the oral anticoagulants on the slide along with dicumarol, inhibits epoxide reductase. Step 3 can no longer run.'},
{ph:'Warfarin overdose',hi:['gRed','gEpo','gGla','gCarb','gRdx'],w:1,v:0,n:[0,4,4],c:'5. The carboxylase keeps using the reduced vitamin K already present, but each one becomes epoxide that cannot be recycled. Reduced vitamin K runs out, epoxide builds up, and glutamate residues stop being carboxylated.'},
{ph:'Vitamin K treatment',hi:['gRed'],w:1,v:1,n:[3,4,4],c:'6. Vitamin K is given. It enters the reduced (active) pool without passing through epoxide reductase, which is still inhibited.'},
{ph:'Vitamin K treatment',hi:['gRed','gCarb','gGla','gEpo','aIn','aOut','b1','b2'],w:1,v:1,n:[2,5,5],c:'7. With reduced vitamin K available again, steps 1 and 2 run and glutamate is carboxylated. The epoxide still cannot be recycled and keeps building up. The treatment by-passes the inhibited pathway instead of reversing warfarin.'}];
function setN(n){red=n[0];epo=n[1];gla=n[2];draw();}
function anim(i){var st=i+1,t;setN(i===0?START:S[i-1].n);
if(st===1){t=path([R,Cx],0,0.8);later(function(){red--;draw();},120);}
if(st===2){t=path([Cx,E],0,0.8);later(function(){flash();gla++;epo++;draw();tok.style.opacity=0;},t);}
if(st===3){t=path([E,RR,RL,R],0,0.7);later(function(){epo--;draw();},120);later(function(){red++;draw();tok.style.opacity=0;},t);}
if(st===5){t=0;for(var k=0;k<3;k++){(function(s0){t=path([R,Cx,E],s0,0.6);later(function(){red--;draw();},s0+100);later(function(){flash();gla++;draw();},s0+760);later(function(){epo++;draw();tok.style.opacity=0;},t);})(t+150);}
var t2=path([E,RR],t+250,0.7);later(function(){mv(E,0.5);},t2);later(function(){tok.style.opacity=0;},t2+550);}
if(st===6){t=0;for(var k2=0;k2<3;k2++){(function(s0){t=path([V,R],s0,0.6);later(function(){red++;draw();tok.style.opacity=0;},t);})(t+150);}}
if(st===7){t=path([R,Cx,E],0,0.7);later(function(){red--;draw();},120);later(function(){flash();gla++;draw();},820);later(function(){epo++;draw();tok.style.opacity=0;},t);}}
var pills=q('pills');
S.forEach(function(s,i){var b=document.createElement('button');b.textContent=(i+1);b.style.flex='1';b.style.fontSize='13px';b.style.padding='4px 0';b.onclick=function(){go(i,false);};pills.appendChild(b);});
function go(i,play){tm.forEach(clearTimeout);tm=[];tok.style.opacity=0;cur=i;var s=S[i];
ALL.forEach(function(id){q(id).style.opacity=s.hi.indexOf(id)>=0?1:0.3;});
q('warf').style.opacity=s.w;q('vk').style.opacity=s.v;
q('phase').textContent='Phase: '+s.ph;q('cap').textContent=s.c;
if(play&&!rm)anim(i);else setN(s.n);
Array.prototype.forEach.call(pills.children,function(b,k){b.style.background=k===i?'var(--bg-accent)':'';b.style.color=k===i?'var(--text-accent)':'';});
q('next').textContent=i===S.length-1?'Replay':'Next';}
q('next').onclick=function(){go(cur===S.length-1?0:cur+1,true);};
q('back').onclick=function(){go(Math.max(0,cur-1),false);};
go(0,true);
})();
</script>
