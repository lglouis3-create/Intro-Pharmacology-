<script>
(function(){
var T=[200,141],B=[200,336],X=[325,310],O=[60,140],W=[330,180],FE=[178,352],LC=[110,322],RC=[335,392],EZ=[328,262],SIDE=[358,330],SC=[325,335];
var S=[
{n:'Start',p:O,b:0,o2:1,fe:'Fe²⁺',t:'Cytochrome c oxidase',h:'Hemoglobin',a:'',s:0,l:'',r:'',e:'',c:'Panel A. Cytochrome c oxidase holds O₂ between its copper (bound to three histidine rings) and its heme iron. Hemoglobin heme iron is Fe²⁺.'},
{n:'CN binds',p:T,b:1,o2:0,fe:'Fe²⁺',t:'Cyanocytochrome c oxidase',h:'Hemoglobin',a:'',s:0,l:'',r:'',e:'',c:'Panel B, cyanide binding. Cyanide binds the enzyme heme iron in the position O₂ held, forming cyanocytochrome c oxidase.'},
{n:'Step 1',p:T,b:1,o2:0,fe:'Fe³⁺',t:'Cyanocytochrome c oxidase',h:'Methemoglobin',a:'Added: amyl nitrite',s:0,l:'Amyl nitrite',r:'',e:'',c:'Step 1, hemoglobin oxidation. Amyl nitrite removes one electron from the hemoglobin heme iron, so Fe²⁺ becomes Fe³⁺ and hemoglobin becomes methemoglobin.'},
{n:'Step 2',p:B,b:1,o2:1,fe:'Fe³⁺',t:'Cytochrome c oxidase',h:'Cyanomethemoglobin',a:'',s:0,l:'',r:'',e:'',c:'Step 2, cyanide extraction. Cyanide leaves cytochrome c oxidase and binds methemoglobin Fe³⁺, forming cyanomethemoglobin. The enzyme returns to its panel A form with O₂ bound.'},
{n:'Step 3a',p:B,b:1,o2:1,fe:'Fe³⁺',t:'Cytochrome c oxidase',h:'Cyanomethemoglobin',a:'Added: thiosulfate',s:0,l:'',r:'SO₃²⁻',e:'Cys–S–S⁻',c:'Step 3, part 1. Rhodanese takes one sulfur atom from thiosulfate (S₂O₃²⁻) onto a cysteine sulfur in its active site, forming Cys–S–S⁻. The rest of thiosulfate leaves as sulfite (SO₃²⁻).'},
{n:'Step 3b',p:X,b:0,o2:1,fe:'Fe³⁺',t:'Cytochrome c oxidase',h:'Methemoglobin',a:'Rhodanese transfers sulfur',s:1,l:'',r:'SO₃²⁻',e:'Cys–S⁻',c:'Step 3, part 2. Cyanide comes off methemoglobin and reaches rhodanese, which moves the stored sulfur onto cyanide, forming thiocyanate (SCN⁻). Rhodanese returns to Cys–S⁻, ready to take another sulfur from thiosulfate.'},
{n:'Step 4',p:X,b:0,o2:1,fe:'Fe²⁺',t:'Cytochrome c oxidase',h:'Hemoglobin',a:'Added: methylene blue',s:1,l:'Methylene blue',r:'',e:'',c:'Step 4, methemoglobin reduction. Methylene blue supplies one electron to the heme iron, so Fe³⁺ becomes Fe²⁺ and methemoglobin becomes hemoglobin again.'}];
var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function q(id){return document.getElementById(id);}
var cn=q('cn'),eg=q('eg'),sg=q('sgrp'),fe=q('hbfe'),sf=q('sfly'),cur=0,tm=[];
function tr(p){return 'translate('+p[0]+'px,'+p[1]+'px)';}
function later(f,ms){tm.push(setTimeout(f,ms));}
function mv(p,d){cn.style.transition=rm?'none':'transform '+d+'s ease';cn.style.transform=tr(p);}
function setFe(v){fe.textContent=v;fe.style.fill=v==='Fe³⁺'?'#BA7517':'';}
function isUp(p){return p===T||p===O;}
function route(f,t){if(f===t)return[];if(isUp(f)&&t===B)return[W,B];if(isUp(f)&&t===X)return[W,B,X];if(f===B&&isUp(t))return[W,t];if(f===X&&isUp(t))return[B,W,t];return[t];}
function run(path){if(rm){if(path.length)mv(path[path.length-1],0);return 0;}var d=0,leg=path.length>1?0.6:0.9;path.forEach(function(p){later(function(){mv(p,leg);},d);d+=leg*1000+30;});return d;}
function fly(el,pts,start,done){el.style.transition='none';el.style.transform=tr(pts[0]);el.style.opacity=0;
later(function(){el.style.opacity=1;},start);var d=start+80;
pts.slice(1).forEach(function(p){later(function(){el.style.transition='transform .75s ease';el.style.transform=tr(p);},d);d+=800;});
later(function(){done();el.style.transition='opacity .3s';el.style.opacity=0;},d);}
var pills=q('pills');
S.forEach(function(s,i){var b=document.createElement('button');b.textContent=s.n;b.style.fontSize='13px';b.style.padding='4px 10px';b.onclick=function(){go(i);};pills.appendChild(b);});
function go(i){tm.forEach(clearTimeout);tm=[];eg.style.opacity=0;sf.style.opacity=0;
var prev=cur,fwd=(i===prev+1)&&!rm,s=S[i];
var d=run(route(S[prev].p,s.p));cur=i;
q('cnbond').style.opacity=s.b;q('o2').style.opacity=s.o2;
q('topname').textContent=s.t;q('botname').textContent=s.h;q('agent').textContent=s.a;q('cap').textContent=s.c;
q('lchip').style.opacity=s.l?1:0;if(s.l)q('lchiptext').textContent=s.l;
q('rchip').style.opacity=s.r?1:0;if(s.r)q('rchiptext').textContent=s.r;
q('enz').style.opacity=s.e?1:0;if(s.e)q('enzS').textContent=s.e;
setFe(s.fe);sg.style.opacity=s.s;q('cnlab').textContent=s.s?'SCN⁻':'CN⁻';
if(fwd&&i===2){setFe(S[1].fe);fly(eg,[FE,LC],0,function(){setFe(s.fe);});}
if(fwd&&i===6){setFe(S[5].fe);fly(eg,[LC,FE],0,function(){setFe(s.fe);});}
if(fwd&&i===4){q('rchiptext').textContent='S₂O₃²⁻';q('enzS').textContent='Cys–S⁻';
fly(sf,[RC,EZ],400,function(){q('enzS').textContent='Cys–S–S⁻';q('rchiptext').textContent='SO₃²⁻';});}
if(fwd&&i===5){q('enzS').textContent='Cys–S–S⁻';sg.style.opacity=0;q('cnlab').textContent='CN⁻';q('botname').textContent='Cyanomethemoglobin';
later(function(){q('botname').textContent='Methemoglobin';},d);
fly(sf,[EZ,SIDE,SC],d+100,function(){sg.style.opacity=1;q('cnlab').textContent='SCN⁻';q('enzS').textContent='Cys–S⁻';});}
Array.prototype.forEach.call(pills.children,function(b,k){b.style.background=k===i?'var(--bg-accent)':'';b.style.color=k===i?'var(--text-accent)':'';});
q('next').textContent=i===S.length-1?'Replay':'Next';}
q('next').onclick=function(){go(cur===S.length-1?0:cur+1);};
q('back').onclick=function(){go(Math.max(0,cur-1));};
go(0);
})();
</script>
