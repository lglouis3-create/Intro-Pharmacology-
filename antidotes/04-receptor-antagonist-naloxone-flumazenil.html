<body><main>
<a class="back chrome" href="index.html">← All antidote diagrams</a>
<h1>Antidote is a receptor antagonist</h1>
<p class="sub">Naloxone (opioid receptor) and flumazenil (GABAA benzodiazepine receptor)</p>
<div style="display:flex;gap:8px;margin:0 0 8px;"><button id="exA" style="flex:1;">Opioid / naloxone</button><button id="exB" style="flex:1;">Benzo / flumazenil</button></div>
<div style="display:flex;gap:6px;margin:0 0 8px;" id="pills"></div>
<svg width="100%" viewBox="0 0 380 310" role="img" style="display:block;"><title>Receptor antagonist as antidote</title><desc>A membrane receptor with a binding pocket; the toxin agonist binds and activates it, then the antagonist binds the pocket without activating it.</desc>
<line x1="20" y1="170" x2="360" y2="170" stroke="var(--text-secondary)" stroke-width="1"/>
<line x1="20" y1="190" x2="360" y2="190" stroke="var(--text-secondary)" stroke-width="1"/>
<text class="ts" x="24" y="155" dominant-baseline="central">Outside cell</text>
<text class="ts" x="24" y="205" dominant-baseline="central">Inside cell</text>
<rect id="r1" class="c-gray" x="150" y="135" width="80" height="105" rx="4" stroke-width="0.5"/>
<rect id="r2" class="c-gray" x="150" y="110" width="25" height="28" rx="4" stroke-width="0.5"/>
<rect id="r3" class="c-gray" x="205" y="110" width="25" height="28" rx="4" stroke-width="0.5"/>
<text class="ts" id="rname" x="190" y="256" text-anchor="middle" dominant-baseline="central">Opioid receptor</text>
<text class="th" id="eff" x="190" y="285" text-anchor="middle" dominant-baseline="central">Receptor off</text>
<g id="ag" style="transform:translate(70px,70px)"><circle cx="0" cy="0" r="14" fill="none" stroke="#D85A30" stroke-width="1.5"/><text class="ts" id="agname" x="0" y="-36" text-anchor="middle" dominant-baseline="central" style="fill:#D85A30">Opioid</text><text class="ts" x="0" y="-22" text-anchor="middle" dominant-baseline="central" style="fill:#D85A30">agonist</text></g>
<g id="an" style="transform:translate(310px,70px)"><rect x="-13" y="-13" width="26" height="26" rx="2" fill="none" stroke="#534AB7" stroke-width="1.5"/><text class="ts" id="anname" x="0" y="-36" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">Naloxone</text><text class="ts" x="0" y="-22" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7">antagonist</text></g>
</svg>
<p id="cap" style="font-size:15px;line-height:1.6;color:var(--text-primary);margin:10px 0 12px;min-height:96px;"></p>
<div style="display:flex;gap:8px;"><button id="back" style="flex:1;">Back</button><button id="next" style="flex:1;">Next</button></div>
<script>
(function(){
function q(id){return document.getElementById(id);}
var EX={A:{tox:'Opioid',anti:'Naloxone',rec:'Opioid receptor',recShort:'opioid receptor'},B:{tox:'Benzodiazepine',anti:'Flumazenil',rec:'GABAA receptor (benzodiazepine site)',recShort:'GABAA (benzodiazepine) receptor'}};
var ex='A',cur=0;
var AGF=[70,70],AGB=[190,121],ANF=[310,70],ANB=[190,122];
var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function place(el,p){el.style.transition=rm?'none':'transform .9s ease';el.style.transform='translate('+p[0]+'px,'+p[1]+'px)';}
function recOn(on){['r1','r2','r3'].forEach(function(id){q(id).setAttribute('class',on?'c-teal':'c-gray');});}
var names=['No drug','Overdose','Antidote'];
var pills=q('pills');
names.forEach(function(n,i){var b=document.createElement('button');b.textContent=n;b.style.flex='1';b.style.fontSize='13px';b.onclick=function(){go(i);};pills.appendChild(b);});
function caps(i){var e=EX[ex];
if(i===0)return 'No drug bound. The '+e.recShort+' is not signaling.';
if(i===1)return 'Overdose. The '+e.tox.toLowerCase()+' binds the '+e.recShort+' and turns it on. Too much receptor activity produces the toxidrome: somnolence and coma.';
return e.anti+' binds the same receptor and pushes the '+e.tox.toLowerCase()+' off. It does not turn the receptor on, so the toxin effect is blocked. This is the slide point: the treatment blocks the effect of a toxin that acts as an agonist.';}
function go(i){cur=i;var e=EX[ex];
q('agname').textContent=e.tox;q('anname').textContent=e.anti;q('rname').textContent=e.rec;
if(i===0){place(q('ag'),AGF);place(q('an'),ANF);recOn(false);q('eff').textContent='Receptor off';}
if(i===1){place(q('ag'),AGB);place(q('an'),ANF);recOn(true);q('eff').textContent='Receptor on: somnolence, coma';}
if(i===2){place(q('ag'),AGF);place(q('an'),ANB);recOn(false);q('eff').textContent='Receptor off: effect blocked';}
q('cap').textContent=caps(i);
Array.prototype.forEach.call(pills.children,function(b,k){b.style.background=k===i?'var(--bg-accent)':'';b.style.color=k===i?'var(--text-accent)':'';});
q('exA').style.background=ex==='A'?'var(--bg-accent)':'';q('exA').style.color=ex==='A'?'var(--text-accent)':'';
q('exB').style.background=ex==='B'?'var(--bg-accent)':'';q('exB').style.color=ex==='B'?'var(--text-accent)':'';
q('next').textContent=i===2?'Replay':'Next';}
q('exA').onclick=function(){ex='A';go(0);};
q('exB').onclick=function(){ex='B';go(0);};
q('next').onclick=function(){go(cur===2?0:cur+1);};
q('back').onclick=function(){go(Math.max(0,cur-1));};
go(0);
})();
</script>

}
