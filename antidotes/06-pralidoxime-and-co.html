<script>
(function(){
function q(id){return document.getElementById(id);}
var NS='http://www.w3.org/2000/svg',TEAL='#1D9E75';
var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var tm=[];function later(f,ms){tm.push(setTimeout(f,ms));}
function put(el,p,d){el.style.transition=rm||d===0?'none':'transform '+(d||0.9)+'s ease, opacity .5s';el.style.transform='translate('+p[0]+'px,'+p[1]+'px)';}
function fly(txt,a,b,start){var f=q('fly');later(function(){f.textContent=txt;f.style.transition='none';f.style.transform='translate('+a[0]+'px,'+a[1]+'px)';f.style.opacity=1;f.getBoundingClientRect();
later(function(){f.style.transition='transform .9s ease, opacity .4s';f.style.transform='translate('+b[0]+'px,'+b[1]+'px)';},40);
later(function(){f.style.opacity=0;},1000);},start);}
var OPF=[300,240],OPS=[130,166],OPD=[130,236],OPR=[300,236],PF=[300,330],PDOCK=[178,166],PB=[156,166],PBD=[156,236],PR=[190,320];
var P=[
{op:OPF,top:1,x:'X',xv:1,r:'OR₂',sh:1,pam:PF,pa:0,ph:1,pb:0,st:'AChE active',c:'Start. The serine side chain (–CH₂–OH) is the part of AChE that breaks down ACh. The organophosphate (OP) has four groups on phosphorus: =O, R₁, OR₂, and a leaving group X.'},
{op:OPS,top:1,x:'X',xv:0,r:'OR₂',sh:0,pam:PF,pa:0,ph:1,pb:0,st:'AChE inhibited (OP-bound)',c:'Step 1. The OP phosphorus bonds to the serine oxygen and X leaves (with the serine H, as HX). This is organophosphate-bound acetylcholinesterase, and it cannot break down ACh.'},
{op:OPD,top:0,x:'X',xv:0,r:'OR₂',sh:1,pam:PBD,pa:1,ph:0,pb:1,st:'AChE active again',c:'Step 2. Pralidoxime N⁺ lines up at the anionic site, which puts its oxime oxygen next to the phosphorus. The phosphorus bonds to the oxime oxygen and its bond to serine breaks, so the OP leaves as organophosphate-bound pralidoxime. The serine gets its H back and AChE works again.'},
{op:OPR,top:1,x:'OH',xv:1,r:'OR₂',sh:1,pam:PR,pa:1,ph:1,pb:0,st:'OP released, pralidoxime restored',c:'Step 3. The OP splits off pralidoxime as R₁–P(=O)(OH)–OR₂, and pralidoxime returns to its oxime (N–OH) form, free to act on another OP-bound AChE.'},
{op:OPS,top:1,x:'X',xv:0,r:'OH',sh:0,pam:PF,pa:0,ph:1,pb:0,st:'AChE aged',c:'Step 4, aging. This path starts from organophosphate-bound AChE (step 1) instead of step 2. The OR₂ group loses R₂, released as HOR₂, and becomes OH. The figure labels this form After aging.'}];
function apply(s,d){put(q('op'),s.op,d);q('opTop').style.opacity=s.top;q('opX').textContent=s.x;q('opX').style.opacity=s.xv;q('opR').textContent=s.r;
q('serH').style.opacity=s.sh;put(q('pam'),s.pam,d);q('pam').style.opacity=s.pa;q('pamH').style.opacity=s.ph;q('pamB').style.opacity=s.pb;q('pstat').textContent=s.st;}
function animP(i){
if(i===1){apply(P[0],0);later(function(){put(q('op'),OPS);},50);
later(function(){q('opX').style.opacity=0;q('serH').style.opacity=0;q('pstat').textContent=P[1].st;},1000);
fly('HX',[150,130],[330,60],1000);}
if(i===2){apply(P[1],0);var pm=q('pam');pm.style.opacity=1;
later(function(){put(pm,PDOCK);},60);
later(function(){q('pamH').style.opacity=0;q('pamB').style.opacity=1;put(pm,PB,0.4);},1100);
fly('H',[178,146],[106,140],1100);
later(function(){q('opTop').style.opacity=0;q('serH').style.opacity=1;},2100);
later(function(){put(q('op'),OPD,0.9);put(pm,PBD,0.9);q('pstat').textContent=P[2].st;},2300);}
if(i===3){apply(P[2],0);
later(function(){q('pamB').style.opacity=0;put(q('op'),OPR);put(q('pam'),PR);},60);
later(function(){q('opTop').style.opacity=1;q('opX').textContent='OH';q('opX').style.opacity=1;q('pamH').style.opacity=1;q('pstat').textContent=P[3].st;},1050);}
if(i===4){apply(P[1],0);q('pstat').textContent=P[1].st;
later(function(){q('opR').textContent='OH';q('pstat').textContent=P[4].st;},900);
fly('HOR₂',[150,188],[320,300],900);}}
var o2=[];
for(var k=0;k<4;k++){var g=document.createElementNS(NS,'g');
g.innerHTML='<line x1="-3" y1="-8" x2="-3" y2="-17" stroke="'+TEAL+'" stroke-width="1.2"/><line x1="3" y1="-8" x2="3" y2="-17" stroke="'+TEAL+'" stroke-width="1.2"/><text class="th" x="0" y="0" text-anchor="middle" dominant-baseline="central" style="fill:'+TEAL+'">O</text><text class="th" x="0" y="-25" text-anchor="middle" dominant-baseline="central" style="fill:'+TEAL+'">O</text><line class="b" x1="0" y1="8" x2="0" y2="17" stroke="'+TEAL+'" stroke-width="1.2" style="opacity:0"/>';
g.style.opacity=0;g.style.transform='translate(70px,110px)';q('o2s').appendChild(g);o2.push(g);}
var C=[
{co:[200,256],cb:1,o:[[70,110,1,0],[130,80,0,0],[270,80,0,0],[330,150,0,0]],st:'CO on heme iron',c:'Carbon monoxide poisoning. CO is bound to the heme iron of hemoglobin, in the position O₂ uses.'},
{co:[200,256],cb:1,o:[[150,170,1,0],[250,170,1,0],[110,215,1,0],[300,215,1,0]],st:'High-concentration O₂ given',c:'Treatment. The patient receives O₂ at high concentration, so many more O₂ molecules are around the heme.'},
{co:[320,110],cb:0,o:[[200,256,1,1],[250,170,1,0],[110,215,1,0],[300,215,1,0]],st:'O₂ on heme iron, CO removed',c:'O₂ displaces CO. With O₂ at high concentration, O₂ takes the heme iron position and CO comes off, which is the point of the slide.'}];
function goC(i){var s=C[i];put(q('co'),s.co);q('coB').style.opacity=s.cb;
o2.forEach(function(g,k){var o=s.o[k];put(g,[o[0],o[1]]);g.style.opacity=o[2];g.querySelector('.b').style.opacity=o[3];});
q('cstat').textContent=s.st;}
var ex='P',cur=0,pills=q('pills');
function names(){return ex==='P'?['Start','Step 1','Step 2','Step 3','Step 4: aging']:['CO bound','High O₂','O₂ displaces CO'];}
function buildPills(){pills.innerHTML='';names().forEach(function(n,i){var b=document.createElement('button');b.textContent=n;b.style.fontSize='13px';b.style.padding='4px 10px';b.onclick=function(){go(i,false);};pills.appendChild(b);});}
function go(i,fromNext){tm.forEach(clearTimeout);tm=[];q('fly').style.opacity=0;cur=i;
if(ex==='P'){q('pscene').setAttribute('visibility','visible');q('cscene').setAttribute('visibility','hidden');
if(fromNext&&!rm&&i>0)animP(i);else apply(P[i],0);q('cap').textContent=P[i].c;}
else{q('pscene').setAttribute('visibility','hidden');q('cscene').setAttribute('visibility','visible');goC(i);q('cap').textContent=C[i].c;}
Array.prototype.forEach.call(pills.children,function(b,k){b.style.background=k===i?'var(--bg-accent)':'';b.style.color=k===i?'var(--text-accent)':'';});
['P','C'].forEach(function(x){var b=q('ex'+x);b.style.background=ex===x?'var(--bg-accent)':'';b.style.color=ex===x?'var(--text-accent)':'';});
q('next').textContent=i===names().length-1?'Replay':'Next';}
q('exP').onclick=function(){ex='P';buildPills();go(0,false);};
q('exC').onclick=function(){ex='C';buildPills();go(0,false);};
q('next').onclick=function(){var last=names().length-1;if(cur===last)go(0,false);else go(cur+1,true);};
q('back').onclick=function(){go(Math.max(0,cur-1),false);};
buildPills();go(0,false);
})();
</script>
